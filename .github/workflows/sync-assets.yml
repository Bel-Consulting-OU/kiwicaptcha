name: sync-release-assets

# The strict-build parity gate requires the COMMITTED browser-tested
# assets to be byte-identical to the CI build. The wasm asset is not
# cross-platform byte-deterministic (the compiled blob differs between
# macOS and Linux toolchains), so assets that change with source must be
# refreshed by a CI (Linux) build before tagging. Run this workflow after
# any change to the wasm crate, the driver, the worker or the stylesheet.
# It builds strictly and commits the refreshed assets to main when they
# differ; then create the release tag.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    name: Refresh release assets from the CI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - name: clean strict build
        env:
          WASM_OPT_STRICT: "1"
        run: bash packages/kiwicaptcha-wasm/build.sh
      - name: commit refreshed assets when they differ
        run: |
          set -euo pipefail
          if ! git diff --exit-code --quiet -- packages/kiwicaptcha-wasm/assets packages/kiwicaptcha/resources packages/kiwicaptcha/integrations/symfony/Resources/public; then
            git config user.name "kiwicaptcha-assets"
            git config user.email "assets@kiwicaptcha.invalid"
            git add packages/kiwicaptcha-wasm/assets packages/kiwicaptcha/resources packages/kiwicaptcha/integrations/symfony/Resources/public
            git commit -m "chore(assets): refresh release assets from the CI build"
            git push origin main
            echo "release assets refreshed from the CI build — create the release tag now"
          else
            echo "release assets are current — no changes"
          fi
