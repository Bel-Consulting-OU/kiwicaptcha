name: sync-release-assets

# The strict-build parity gate requires the committed browser-tested
# assets to be byte-identical to the CI build. The wasm asset is not
# cross-platform byte-deterministic (the compiled blob differs between
# macOS and Linux toolchains), so assets that change with source must be
# refreshed by a CI (Linux) build before tagging. Run this workflow after
# any change to the wasm crate, the driver, the worker or the stylesheet.
# It builds strictly and uploads the refreshed assets as a CI artifact;
# a maintainer commits them locally (the byte-parity gate then passes
# because the committed assets equal the CI build), then create the
# release tag.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    name: Refresh release assets from the CI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - name: clean strict build
        env:
          WASM_OPT_STRICT: "1"
        run: bash packages/kiwicaptcha-wasm/build.sh
      - name: package the built assets for the refresh commit
        # The protected-main ruleset correctly refuses automated pushes, so
        # the workflow delivers the CI-built assets as an artifact; a
        # maintainer commits them locally (the byte-parity gate then passes
        # because the committed assets equal the CI build).
        run: |
          set -euo pipefail
          mkdir -p /tmp/refreshed/packages/kiwicaptcha-wasm/assets /tmp/refreshed/packages/kiwicaptcha/resources /tmp/refreshed/packages/kiwicaptcha/integrations/symfony/Resources/public
          cp packages/kiwicaptcha-wasm/assets/kiwicaptcha-wasm.js packages/kiwicaptcha-wasm/assets/widget-driver.js packages/kiwicaptcha-wasm/assets/widget.css packages/kiwicaptcha-wasm/assets/kiwi-worker.js /tmp/refreshed/packages/kiwicaptcha-wasm/assets/
          cp packages/kiwicaptcha/resources/kiwicaptcha-wasm.js packages/kiwicaptcha/resources/widget-driver.js packages/kiwicaptcha/resources/widget.css /tmp/refreshed/packages/kiwicaptcha/resources/
          cp packages/kiwicaptcha/integrations/symfony/Resources/public/kiwicaptcha-wasm.js packages/kiwicaptcha/integrations/symfony/Resources/public/widget-driver.js packages/kiwicaptcha/integrations/symfony/Resources/public/widget.css /tmp/refreshed/packages/kiwicaptcha/integrations/symfony/Resources/public/
          echo "refreshed assets staged at /tmp/refreshed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refreshed-assets
          path: /tmp/refreshed
          if-no-files-found: error
