name: Public install smoke

# Clean-room public-registry install proof (release-checklist.md
# steps 1-6): a completely empty application that shares no files with
# this repository installs the published packages from the public
# registries — Packagist (composer smoke) and crates.io (cargo smoke) —
# with no path repository, no local artifact and no repository
# checkout. These jobs are the machine proof that the public
# instructions work from the registries alone. The composer smoke
# covers the full published flow: create the empty application,
# require the bundle, boot it, run the doctor, assert the installed
# package is self-contained, assert the Flex recipe's starter config
# and routes exist, then exercise uninstall -> reinstall -> update.
# Until the packages are published (release-checklist.md step 1/2) a
# dispatch run fails at the require/add step, and until the recipe is
# live (steps 4/5) it fails at the configuration assertion, which is
# the expected honest state of a proof that cannot pass yet. The jobs
# run only on workflow_dispatch with the exact versions to smoke, so a
# failed proof is always attributable to a version pair. The cargo
# lane pins the exact version (=X.Y.Z), then reads cargo metadata back
# and requires the resolved package to carry that exact version with a
# crates.io registry source and no path/git replacement, for both
# published crates (kiwicaptcha and kiwicaptcha-risk).
#
# The composer lane now completes step 6 machine-side: it writes the
# documented minimum configuration against a real Redis service,
# requires kiwicaptcha:doctor to exit cleanly, serves the application,
# and drives a headless browser through issue -> solve -> verify on the
# demo form (the token is solved in the browser and verified
# server-side), then repeats the boot/doctor/page path after
# uninstall -> reinstall -> update.
on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: Exact bundle version to require from Packagist (e.g. 1.0.0)
        required: true
      rust_version:
        description: Exact kiwicaptcha crate version to add from crates.io (e.g. 1.7.0)
        required: true
      risk_rust_version:
        description: Exact kiwicaptcha-risk crate version to add from crates.io (e.g. 0.1.0)
        required: true

permissions:
  contents: read

jobs:
  composer-smoke:
    name: public composer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          php-version: '8.2'
          extensions: gmp, json, openssl, sodium, intl
          coverage: none
      - name: install the symfony CLI (versioned release, sha256-pinned)
        # The installer script from get.symfony.com is a pipe-to-bash
        # download; instead the lane fetches the versioned GitHub
        # release tarball and verifies its sha256 against the hash
        # published in the release checksums file before extracting.
        # Bump `SYMFONY_CLI_VERSION` and `SYMFONY_CLI_SHA256` together
        # from the symfony-cli releases page (the checksums.txt entry
        # of the linux amd64 tarball).
        env:
          SYMFONY_CLI_VERSION: '5.20.0'
          SYMFONY_CLI_SHA256: f50bfbbc1825a2f12a125ea4391f6f7c5b3d7e656901aeeeece0dd8bba135f36
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/symfony-cli.tar.gz \
            "https://github.com/symfony-cli/symfony-cli/releases/download/v${SYMFONY_CLI_VERSION}/symfony-cli_linux_amd64.tar.gz"
          echo "${SYMFONY_CLI_SHA256}  /tmp/symfony-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.symfony5/bin"
          tar -xzf /tmp/symfony-cli.tar.gz -C "$HOME/.symfony5/bin" symfony
          "$HOME/.symfony5/bin/symfony" --version
          echo "$HOME/.symfony5/bin" >> "$GITHUB_PATH"
      - name: create the empty LTS application (--webapp)
        run: |
          set -euo pipefail
          symfony new kiwi-smoke --version=lts --webapp
      - name: require the bundle from Packagist (no path repository)
        working-directory: kiwi-smoke
        env:
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: |
          set -euo pipefail
          composer require "bel-consulting/kiwicaptcha-symfony:$BUNDLE_VERSION" --no-interaction --no-progress
          composer show bel-consulting/kiwicaptcha-symfony
      - name: the application boots (console about)
        working-directory: kiwi-smoke
        run: php bin/console about
      - name: write the documented minimum configuration (secret, public URL, Redis DSN)
        # The quick start's verified flow: protection_profile, the 32-byte
        # secret, the public base URL and the Redis DSN. The Redis service
        # above provides the atomic backend the doctor checks.
        working-directory: kiwi-smoke
        env:
          KIWI_SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          set -euo pipefail
          {
            echo "KIWI_SECRET_KEY=${KIWI_SECRET_KEY}"
            echo "KIWI_PUBLIC_URL=http://127.0.0.1:8000"
            echo "KIWI_REDIS_DSN=redis://127.0.0.1:6379/0"
          } >> .env.local
          cat .env.local
      - name: kiwicaptcha:doctor must exit cleanly on the documented minimum
        # The configured state is the documented minimum, so every check
        # the doctor runs must now pass: a check-level failure is a real
        # failure of the public instructions, never a tolerated outcome.
        working-directory: kiwi-smoke
        run: |
          set -euo pipefail
          php bin/console kiwicaptcha:doctor
          echo "doctor: exit 0 (clean) on the documented minimum configuration"
      - name: the Flex recipe delivered the starter config and the routes
        # The recipe is part of the public instructions (checklist steps
        # 4-5): it writes the starter configuration and registers the
        # bundle routes. Its absence fails this proof loudly instead of
        # pretending the installation story is complete.
        working-directory: kiwi-smoke
        run: |
          set -euo pipefail
          test -f config/packages/kiwicaptcha.yaml \
            || { echo "the Flex recipe has not been applied (checklist steps 4-5 outstanding)"; exit 1; }
          php bin/console debug:router | grep -q kiwicaptcha \
            || { echo "the recipe's kiwicaptcha routes are missing"; exit 1; }
          echo "recipe config + routes present"
      - name: add the demo page (form widget) to the smoke application
        working-directory: kiwi-smoke
        run: |
          set -euo pipefail
          mkdir -p src/Form src/Controller templates
          cat > src/Form/CaptchaDemoType.php <<'PHP'
          <?php

          namespace App\Form;

          use BelConsulting\KiwiCaptchaBundle\Form\Type\KiwiCaptchaType;
          use Symfony\Component\Form\AbstractType;
          use Symfony\Component\Form\FormBuilderInterface;

          final class CaptchaDemoType extends AbstractType
          {
              public function buildForm(FormBuilderInterface $builder, array $options): void
              {
                  $builder->add('captcha', KiwiCaptchaType::class, ['scope' => 'login']);
              }
          }
          PHP
          cat > src/Form/CaptchaDemoInput.php <<'PHP'
          <?php

          namespace App\Form;

          use Symfony\Component\Validator\Constraints as Assert;

          final class CaptchaDemoInput
          {
              #[Assert\NotBlank]
              public ?string $captcha = null;
          }
          PHP
          cat > src/Controller/CaptchaDemoController.php <<'PHP'
          <?php

          namespace App\Controller;

          use App\Form\CaptchaDemoInput;
          use App\Form\CaptchaDemoType;
          use Symfony\Bundle\FrameworkBundle\Controller\AbstractController;
          use Symfony\Component\HttpFoundation\Request;
          use Symfony\Component\HttpFoundation\Response;
          use Symfony\Component\Routing\Attribute\Route;

          final class CaptchaDemoController extends AbstractController
          {
              #[Route('/captcha-demo', name: 'captcha_demo', methods: ['GET', 'POST'])]
              public function __invoke(Request $request): Response
              {
                  $form = $this->createForm(CaptchaDemoType::class, new CaptchaDemoInput());
                  $form->handleRequest($request);
                  $result = null;
                  if ($form->isSubmitted()) {
                      $result = json_encode([
                          'ok' => $form->isValid(),
                          'errors' => array_map(
                              static fn ($violation): string => (string) $violation->getMessage(),
                              iterator_to_array($form->getErrors(true)),
                          ),
                      ], JSON_THROW_ON_ERROR);
                  }

                  return $this->render('captcha_demo.html.twig', ['form' => $form, 'result' => $result]);
              }
          }
          PHP
          cat > templates/captcha_demo.html.twig <<'TWIG'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>KiwiCaptcha smoke</title></head>
          <body{% if result %} data-result="{{ result|e('html_attr') }}"{% endif %}>
          {{ form_start(form) }}
          {{ form_widget(form) }}
          <button id="demo-submit" type="submit">Verify</button>
          {{ form_end(form) }}
          </body>
          </html>
          TWIG
          cat > config/packages/kiwicaptcha_widget.yaml <<'YAML'
          twig:
              form_themes:
                  - '@KiwiCaptcha/form_div_layout.html.twig'
          YAML
          php bin/console cache:clear
          php bin/console debug:router | grep -q captcha_demo
          echo "demo page wired"
      - name: start the application server
        working-directory: kiwi-smoke
        run: |
          set -euo pipefail
          symfony serve --no-tls --port=8000 --daemon
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/captcha-demo > /dev/null; then
              echo "application server answering on 127.0.0.1:8000"
              exit 0
            fi
            sleep 1
          done
          echo "application server did not answer in 60 s" >&2
          exit 1
      - name: issue, solve and verify in a real browser
        # The whole public journey: the page renders the widget, the widget
        # posts its challenge, solves it in the browser, writes the hidden
        # token, and the form submit verifies the token server-side. Any
        # step failing means a new external user cannot reach a working
        # CAPTCHA, which is exactly what this proof exists to catch.
        working-directory: kiwi-smoke
        run: |
          set -euo pipefail
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.62.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          cat > e2e.mjs <<'JS'
          import { chromium } from 'playwright';

          const base = 'http://127.0.0.1:8000';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          page.on('console', (message) => console.log('[browser]', message.type(), message.text()));
          await page.goto(`${base}/captcha-demo`, { waitUntil: 'load' });
          await page.waitForSelector('.kiwi-widget[data-state="verified"]', { timeout: 180000 });
          const token = await page.locator('input[data-kiwi-token]').first().inputValue();
          if (!token) {
            throw new Error('the widget reached verified without writing a token');
          }
          await page.click('#demo-submit');
          await page.waitForFunction(() => document.body.dataset.result !== undefined, { timeout: 60000 });
          const result = JSON.parse(await page.evaluate(() => document.body.dataset.result));
          if (result.ok !== true) {
            throw new Error(`server-side verification refused the token: ${JSON.stringify(result)}`);
          }
          console.log(`issue -> solve -> verify OK (token bytes: ${token.length})`);
          await browser.close();
          JS
          node e2e.mjs
      - name: uninstall -> reinstall -> update cycle
        # The remaining composer half of checklist step 6: a published
        # package must survive removal, a fresh require and an update
        # without leaving the application broken.
        working-directory: kiwi-smoke
        env:
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: |
          set -euo pipefail
          composer remove bel-consulting/kiwicaptcha-symfony --no-interaction
          composer require "bel-consulting/kiwicaptcha-symfony:$BUNDLE_VERSION" --no-interaction --no-progress
          php bin/console about
          php bin/console kiwicaptcha:doctor
          composer update bel-consulting/kiwicaptcha-symfony --no-interaction --no-progress
          php bin/console about
          php bin/console kiwicaptcha:doctor
          curl -fsS http://127.0.0.1:8000/captcha-demo > /dev/null
          echo "uninstall -> reinstall -> update cycle OK (boot, doctor and demo page after each step)"

      - name: the installed bundle ships its own assets (no repository file)
        # The installed package must be self-contained: the widget
        # assets ride the bundle's own Resources/public (the files-tier
        # delivery reads them from the package), never a repository
        # checkout.
        working-directory: kiwi-smoke
        run: |
          set -euo pipefail
          test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/kiwicaptcha-wasm.js
          test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/widget-driver.js
          test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/widget-risk.js
          test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/widget-telemetry.js
          test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/widget-locales.js
          test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/widget-compat.js
          echo "bundle assets present in the installed package"

  cargo-smoke:
    name: public cargo smoke (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: kiwicaptcha
            version: ${{ inputs.rust_version }}
          - crate: kiwicaptcha-risk
            version: ${{ inputs.risk_rust_version }}
    steps:
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
      - name: init an empty crate in a temp dir (no repo checkout)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/kiwi-cargo-smoke"
          cargo init --name kiwi-cargo-smoke "$RUNNER_TEMP/kiwi-cargo-smoke"
      - name: add the exact crates.io version (=) and check (no path, no git source)
        env:
          CRATE: ${{ matrix.crate }}
          RUST_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kiwi-cargo-smoke"
          # `=X.Y.Z` is the only requirement that cannot resolve to a
          # newer compatible release: a caret requirement would accept
          # 1.7.1 for a requested 1.7.0 and the smoke would still pass.
          cargo add "$CRATE@=$RUST_VERSION"
          cargo check
          cargo tree -p "$CRATE" --depth 0
          # Read the resolution back: exactly one package of that name,
          # the requested version, a crates.io registry source, and no
          # path/git replacement (a replacement has source null).
          cargo metadata --format-version 1 > "$RUNNER_TEMP/kiwi-cargo-smoke/meta.json"
          python3 - "$CRATE" "$RUST_VERSION" "$RUNNER_TEMP/kiwi-cargo-smoke/meta.json" <<'PY'
          import json
          import sys

          crate, want, path = sys.argv[1], sys.argv[2], sys.argv[3]
          meta = json.load(open(path))
          named = [p for p in meta['packages'] if p['name'] == crate]
          exact = [p for p in named if p['version'] == want]
          assert len(exact) == 1, (
              f'{crate}@{want} must resolve to exactly one package, got '
              f'{[p["version"] for p in named]}'
          )
          source = exact[0].get('source') or ''
          assert source.startswith('registry+') and 'crates.io' in source, (
              f'{crate}@{want} resolved from {source!r}, not the crates.io registry'
          )
          print(f'cargo smoke: verified {crate}@{want} from {source}')
          PY
          echo "cargo smoke: $CRATE@$RUST_VERSION resolved and checked from crates.io"
