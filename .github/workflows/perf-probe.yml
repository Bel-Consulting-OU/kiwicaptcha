name: perf runner probe

# A manually dispatched probe that measures the two real-Redis timing
# lanes on the CI runner class, with the same service container and PHP
# extension set the "Performance budgets" job uses. The lanes are
# non-gating there, and their ratchets were calibrated on a quiet
# workstation, so this probe answers the question the local machine
# cannot: what does this code cost on the runner that actually gates a
# merge, and what is its spread between runs.
#
# It is also the only place lane one (the SHA-256 path through
# RedisStorage) can be measured on CI after the Lua envelope scanner
# was made single-pass. Delete this file once the runner-class numbers
# are recorded in the baseline.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: runner-class timing probe
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73 # Redis 7.x.y, the digest the perf job pins
        ports:
          - 6399:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          extensions: gmp, json, openssl, sodium
          coverage: none
      - name: install PHP core (cached)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/kiwicaptcha-php
      - name: install Symfony bundle (cached)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: packages/kiwicaptcha/integrations/symfony
      - name: runner identity
        run: |
          echo "nproc=$(nproc)"
          echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          echo "mem=$(free -m | awk '/Mem:/{print $2}') MiB"
          php -v | head -1
          redis-cli -h 127.0.0.1 -p 6399 info server | grep -E 'redis_version|os:' || true
      - name: lane one, SHA-256 through RedisStorage
        env:
          KC_REDIS_URL: redis://127.0.0.1:6399
        run: |
          for i in 1 2 3; do
            php packages/kiwicaptcha/tools/perf-bench.php --redis || true
          done
      - name: lane two, concurrent risk-enabled issuance
        env:
          KC_REDIS_URL: redis://127.0.0.1:6399
        run: |
          for i in 1 2 3 4 5; do
            php packages/kiwicaptcha/tools/perf-bench-risk.php --redis || true
          done
      - name: lane two with one worker per core
        # The ceiling was calibrated with eight workers on an eighteen-core
        # workstation, where every worker owns a core for the measured
        # window. On a four-vCPU runner the same eight workers queue, so
        # the per-operation latency measures the runner's core budget
        # rather than the code. This runs the same workload with one
        # worker per available core, which is the topology the per-op
        # metric is comparable in.
        env:
          KC_REDIS_URL: redis://127.0.0.1:6399
        run: |
          for w in 2 4; do
            echo "--- workers=$w (nproc=$(nproc)) ---"
            for i in 1 2 3; do
              php packages/kiwicaptcha/tools/perf-bench-risk.php --redis --workers "$w" || true
            done
          done
