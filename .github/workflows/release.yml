name: Release

# Audit round 16/17: the actual release pipeline — the browser assets are
# first-class security artifacts. The workflow OWNS the entire immutable
# release lifecycle on every v* tag push:
#   tag -> strict pinned build -> manifests -> SLSA attestation ->
#   idempotent GitHub Release creation -> asset upload.
#
# One auditable chain: the release is created HERE (if missing) with the
# build's own artifacts; nothing is uploaded to a release the workflow did
# not itself see created or verified.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-assets:
    name: Build, attest and upload release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: packages/kiwicaptcha-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0 (node24)
        with:
          # Audit round 17: pinned Node for the SRI manifest generator.
          node-version: 22
      - name: strict deterministic build
        env:
          WASM_OPT_STRICT: "1"
        run: bash build.sh
      - name: release manifest (SHA-256 + SRI)
        run: |
          set -euo pipefail
          shasum -a 256 assets/kiwicaptcha-wasm.js assets/kiwi-worker.js \
                 assets/widget-driver.js assets/widget.css > SHA256SUMS
          node tools/sri-hashes.mjs > SRI.txt
          cat SHA256SUMS
          cat SRI.txt
      - name: attest the release artifacts (SLSA provenance)
        # Audit round 17: `defaults.run.working-directory` applies to run
        # steps only — a `uses:` action resolves subjects against the
        # Actions workspace, so the paths must be workspace-rooted.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ github.workspace }}/packages/kiwicaptcha-wasm/assets/kiwicaptcha-wasm.js
            ${{ github.workspace }}/packages/kiwicaptcha-wasm/assets/kiwi-worker.js
            ${{ github.workspace }}/packages/kiwicaptcha-wasm/assets/widget-driver.js
            ${{ github.workspace }}/packages/kiwicaptcha-wasm/assets/widget.css
      - name: create the release (idempotent) + upload assets + manifest
        # Audit round 17: the workflow OWNS the release lifecycle — the
        # GitHub Release is created here (with --verify-tag so it can only
        # ever reference the tag that triggered this run) and never assumed
        # to pre-exist. A concurrent/recreated release is tolerated
        # (--clobber upload), so the chain stays deterministic.
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "KiwiCaptcha $GITHUB_REF_NAME" \
              --notes "Release built and attested by .github/workflows/release.yml (strict pinned pipeline, Rust 1.96.0, wasm-bindgen 0.2.127, binaryen version_119, --locked). Manifests: SHA256SUMS (sha256) + SRI.txt (sha384)." \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            assets/kiwicaptcha-wasm.js \
            assets/kiwi-worker.js \
            assets/widget-driver.js \
            assets/widget.css \
            SHA256SUMS \
            SRI.txt \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
