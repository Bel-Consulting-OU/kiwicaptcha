name: Release

# Audit round 18: the release pipeline is CI-GATED and publishes
# ATOMICALLY. On every v* tag push:
#   gate (all CI jobs passed for the EXACT tag SHA, commit on protected
#         main) -> strict pinned build -> released==committed byte proof ->
#   manifests -> SLSA attestation -> single atomic publish.
#
# The published release is IMMUTABLE by policy: v* tags are protected by a
# repository ruleset (no update/delete outside admins), immutable releases
# are enabled, and the publish step fails instead of clobbering an
# existing release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-assets:
    name: Gate, build, attest and publish release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      checks: read
    defaults:
      run:
        working-directory: packages/kiwicaptcha-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
      - name: gate — the exact tag SHA must have passed ALL CI jobs
        # Audit round 18: publication is gated on the FULL security/test
        # matrix for EXACTLY this tagged commit (the tag push also triggers
        # ci.yml on the same SHA; we wait for its check runs and require
        # every one to be success). A tag accidentally placed on a commit
        # with failing parity/Redis/browser tests can never publish.
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          # The tagged commit must be reachable from protected main.
          ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq '.ahead_by')"
          if [[ "$ahead" != "0" ]]; then
            echo "refusing to release: $sha is not reachable from protected main (ahead_by=$ahead)" >&2
            exit 1
          fi
          echo "tagged commit $sha is reachable from protected main"
          # Wait for the tag-SHA CI check runs and require ALL to pass.
          deadline=$((SECONDS + 1800))
          while :; do
            total="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --jq '.total_count')"
            incomplete="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --jq '[.check_runs[] | select(.status != "completed")] | length')"
            failed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --jq '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required")] | length')"
            echo "checks: total=$total incomplete=$incomplete failed=$failed"
            if [[ "$failed" != "0" ]]; then
              echo "refusing to release: CI check runs failed for $sha" >&2
              exit 1
            fi
            if [[ "$total" -gt 0 && "$incomplete" == "0" ]]; then
              echo "all $total CI check runs passed for $sha"
              break
            fi
            if (( SECONDS > deadline )); then
              echo "timed out waiting for CI on $sha (release gate)" >&2
              exit 1
            fi
            sleep 30
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24) — same pin as ci.yml
        with:
          # Audit round 18: pinned Node for the SRI manifest generator.
          node-version: "22"
      - name: strict deterministic build
        env:
          WASM_OPT_STRICT: "1"
        run: bash build.sh
      - name: released bytes must equal the committed (browser-tested) bytes
        # Audit round 18: the committed assets are what the browser suite
        # and the Symfony byte-parity job test. The strict rebuild must
        # reproduce them EXACTLY — any drift fails the release, so tested
        # bytes == released bytes by construction.
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            assets/kiwicaptcha-wasm.js \
            assets/kiwi-worker.js \
            assets/widget-driver.js \
            assets/widget.css
          echo "strict rebuild == committed/tested assets"
      - name: release manifest (SHA-256 + SRI)
        # Audit round 18: SHA256SUMS uses BASENAMES so `shasum -c
        # SHA256SUMS` works in a flat download folder; SRI covers all four
        # release assets (widget.css is SRI-capable via <link>).
        run: |
          set -euo pipefail
          ( cd assets && shasum -a 256 kiwicaptcha-wasm.js kiwi-worker.js widget-driver.js widget.css ) > SHA256SUMS
          node tools/sri-hashes.mjs > SRI.txt
          cat SHA256SUMS
          cat SRI.txt
      - name: attest the release artifacts (SLSA provenance)
        # Audit round 17: `defaults.run.working-directory` applies to run
        # steps only — a `uses:` action resolves subjects against the
        # Actions workspace, so the paths must be workspace-rooted.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ github.workspace }}/packages/kiwicaptcha-wasm/assets/kiwicaptcha-wasm.js
            ${{ github.workspace }}/packages/kiwicaptcha-wasm/assets/kiwi-worker.js
            ${{ github.workspace }}/packages/kiwicaptcha-wasm/assets/widget-driver.js
            ${{ github.workspace }}/packages/kiwicaptcha-wasm/assets/widget.css
      - name: publish the release atomically (draft -> upload -> publish)
        # Audit round 18: assets are passed DIRECTLY to `gh release create`
        # — GitHub CLI creates the release as a DRAFT, uploads the assets,
        # and only then publishes it; a failure never leaves a public
        # partial release. An EXISTING release is a HARD FAILURE (no
        # --clobber): a rerun with different bytes must never silently
        # replace published artifacts.
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "refusing to publish: release $GITHUB_REF_NAME already exists (releases are immutable)" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            assets/kiwicaptcha-wasm.js \
            assets/kiwi-worker.js \
            assets/widget-driver.js \
            assets/widget.css \
            SHA256SUMS \
            SRI.txt \
            --verify-tag \
            --title "KiwiCaptcha $GITHUB_REF_NAME" \
            --notes "Release CI-gated, strict-built and SLSA-attested by .github/workflows/release.yml (Rust 1.96.0, wasm-bindgen 0.2.127 --locked, binaryen version_119 verified, released bytes == browser-tested bytes). Manifests: SHA256SUMS (sha256, basenames) + SRI.txt (sha384). Verify: gh attestation verify <asset> --repo $GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
