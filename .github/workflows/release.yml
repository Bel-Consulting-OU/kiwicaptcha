name: Release

# Audit round 16: the actual release pipeline — the browser assets are
# first-class security artifacts. On every v* tag push this workflow:
#   1. builds the assets under the STRICT deterministic pipeline (pinned
#      toolchain, --locked, verified wasm-opt, wasm-bindgen version lock);
#   2. generates the SHA-256 manifest;
#   3. attaches SLSA provenance via GitHub artifact attestation;
#   4. uploads the assets + manifest to the tagged GitHub release.
# The release notes (cut with `gh release create`) carry the component
# versions and the manifest hashes from this build.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-assets:
    name: Build, attest and upload release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: packages/kiwicaptcha-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: strict deterministic build
        env:
          WASM_OPT_STRICT: "1"
        run: bash build.sh
      - name: release manifest (SHA-256 + SRI)
        run: |
          set -euo pipefail
          shasum -a 256 assets/kiwicaptcha-wasm.js assets/kiwi-worker.js \
                 assets/widget-driver.js assets/widget.css > SHA256SUMS
          node tools/sri-hashes.mjs > SRI.txt
          cat SHA256SUMS
          cat SRI.txt
      - name: attest the release artifacts (SLSA provenance)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            assets/kiwicaptcha-wasm.js
            assets/kiwi-worker.js
            assets/widget-driver.js
            assets/widget.css
      - name: upload assets + manifest to the tagged release
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            assets/kiwicaptcha-wasm.js \
            assets/kiwi-worker.js \
            assets/widget-driver.js \
            assets/widget.css \
            SHA256SUMS \
            SRI.txt \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
