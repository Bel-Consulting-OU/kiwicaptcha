name: Release

# Audit round 19: the release pipeline is CI-GATED on the EXACT tag-
# triggered ci.yml run, split into a blast-radius-limited build job and an
# attest/publish job, and publishes ATOMICALLY:
#
#   job 1 (contents: read, actions: write — cannot publish/attest):
#     gate (exact tag CI run succeeded; commit on protected main; release
#     does not exist yet) -> strict pinned build -> released==committed
#     byte proof -> manifests -> workflow artifact
#
#   job 2 (contents: write, id-token: write, attestations: write — only
#     runs after job 1):
#     download the immutable artifact -> SLSA attestation -> atomic
#     `gh release create` (draft -> upload -> publish, no clobber).
#
# v* tags are protected by a repository ruleset; GitHub Immutable
# Releases is ENABLED (PUT /repos/{owner}/{repo}/immutable-releases), so
# every published release object locks its tag and assets and carries a
# release-level attestation; the publish step verifies both
# (immutable:true API assertion + gh release verify, audited round 21).
on:
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate-and-build:
    name: Gate and build release assets
    runs-on: ubuntu-latest
    # Audit round 19: this job can NEVER publish or attest — it only has
    # read access to contents plus the actions permission required to
    # upload the workflow artifact. The blast radius of repo-controlled
    # bash build.sh is bounded to artifact production.
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: packages/kiwicaptcha-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
      - name: gate — exact tag CI, protected-main reachability, no existing release
        # Audit round 19: the gate selects the SPECIFIC ci.yml workflow run
        # triggered by THIS tag push (head_sha == GITHUB_SHA AND
        # head_branch == GITHUB_REF_NAME AND event == push) and requires it
        # to be completed with success. Querying all check runs for the SHA
        # is wrong twice over: the release job's own run can never complete
        # while it waits (the v1.6.0 deadlock), and the same SHA carries
        # both a main-push and a tag-push CI copy — only the tag-triggered
        # run proves "the CI workflow triggered by this tag passed".
        # An existing release is also refused HERE, before any build,
        # manifest or attestation work (never create attestations for a
        # release that cannot be published).
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "refusing to publish: release $tag already exists (releases are immutable)" >&2
            exit 1
          fi
          echo "release $tag does not exist yet"

          ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq '.ahead_by')"
          if [[ "$ahead" != "0" ]]; then
            echo "refusing to release: $sha is not reachable from protected main (ahead_by=$ahead)" >&2
            exit 1
          fi
          echo "tagged commit $sha is reachable from protected main"

          deadline=$((SECONDS + 1800))
          while :; do
            ci_run="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&per_page=100" \
                | jq -c --arg sha "$sha" --arg tag "$tag" '
                    [.workflow_runs[]
                     | select(.head_sha == $sha and .head_branch == $tag and .event == "push")]
                    | sort_by(.run_number)
                    | last // empty'
            )"
            if [[ -n "$ci_run" && "$ci_run" != "null" ]]; then
              status="$(jq -r '.status' <<<"$ci_run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$ci_run")"
              echo "tag CI: status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "refusing release: the exact tag CI did not succeed (conclusion=$conclusion)" >&2
                  exit 1
                fi
                echo "exact tag CI succeeded for $sha"
                break
              fi
            else
              echo "tag CI run not found yet (head_sha=$sha head_branch=$tag)"
            fi
            if (( SECONDS > deadline )); then
              echo "timed out waiting for the exact tag CI run" >&2
              exit 1
            fi
            sleep 15
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24) — same pin as ci.yml
        with:
          node-version: "22"
      - name: strict deterministic build
        env:
          WASM_OPT_STRICT: "1"
        run: bash build.sh
      - name: released bytes must equal the committed (browser-tested) bytes
        # Audit round 19: the committed assets are what the browser suite
        # and the Symfony/core parity jobs test. The strict rebuild must
        # reproduce them EXACTLY — any drift fails the release, so tested
        # bytes == released bytes by construction.
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            assets/kiwicaptcha-wasm.js \
            assets/kiwi-worker.js \
            assets/widget-driver.js \
            assets/widget.css
          echo "strict rebuild == committed/tested assets"
      - name: release manifest (SHA-256 + SRI)
        # SHA256SUMS uses BASENAMES so `shasum -c SHA256SUMS` works in a
        # flat download folder; SRI covers all four release assets
        # (widget.css is SRI-capable via <link>). Both manifests are
        # written INSIDE assets/ so the single upload directory carries
        # everything with a predictable layout (no common-prefix
        # flattening ambiguity across multiple upload paths).
        run: |
          set -euo pipefail
          ( cd assets && shasum -a 256 kiwicaptcha-wasm.js kiwi-worker.js widget-driver.js widget.css > SHA256SUMS && node ../tools/sri-hashes.mjs > SRI.txt && cat SHA256SUMS && cat SRI.txt )
      - name: upload the immutable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: packages/kiwicaptcha-wasm/assets
          if-no-files-found: error
          retention-days: 7

  attest-and-publish:
    name: Attest and publish the release
    runs-on: ubuntu-latest
    needs: gate-and-build
    # Audit round 19: ONLY this job holds publish/attestation capability,
    # and it runs only after the gated build produced the artifact.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No defaults.run.working-directory here: every path is absolute via
    # $GITHUB_WORKSPACE. The checkout exists only so `gh release create
    # --verify-tag` can verify the tag against a git repo (gh runs git
    # locally); the attested/published files come from the artifact.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: download the immutable build artifact
        # The artifact carries the assets + manifests at its root (the
        # upload path was the assets directory itself), extracted into
        # $GITHUB_WORKSPACE.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
      - name: attest the release artifacts (SLSA provenance)
        # Producer: actions/attest-build-provenance (the only supported
        # producer); consumer: `gh attestation verify`. Subject paths are
        # workspace-rooted (defaults.run.working-directory does not apply
        # to uses: actions).
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ github.workspace }}/kiwicaptcha-wasm.js
            ${{ github.workspace }}/kiwi-worker.js
            ${{ github.workspace }}/widget-driver.js
            ${{ github.workspace }}/widget.css
            ${{ github.workspace }}/SHA256SUMS
            ${{ github.workspace }}/SRI.txt
      - name: publish the release atomically (draft -> upload -> publish)
        # Audit round 19: assets are passed DIRECTLY to `gh release create`
        # — GitHub CLI creates the release as a DRAFT, uploads the assets,
        # and only then publishes it; a failure never leaves a public
        # partial release. An EXISTING release was already refused in the
        # gate (and is refused again here) — no --clobber, ever.
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "refusing to publish: release $GITHUB_REF_NAME already exists (releases are immutable)" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$GITHUB_WORKSPACE/kiwicaptcha-wasm.js" \
            "$GITHUB_WORKSPACE/kiwi-worker.js" \
            "$GITHUB_WORKSPACE/widget-driver.js" \
            "$GITHUB_WORKSPACE/widget.css" \
            "$GITHUB_WORKSPACE/SHA256SUMS" \
            "$GITHUB_WORKSPACE/SRI.txt" \
            --verify-tag \
            --title "KiwiCaptcha $GITHUB_REF_NAME" \
            --notes "Release CI-gated (exact tag CI), strict-built and SLSA-attested by .github/workflows/release.yml (Rust 1.96.0, wasm-bindgen 0.2.127 --locked, binaryen version_119 verified, released bytes == browser-tested bytes). Manifests: SHA256SUMS (sha256, basenames) + SRI.txt (sha384). Verify: gh attestation verify <asset> --repo $GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: verify the published release (immutability + attestation)
        # Audit round 20: with GitHub Immutable Releases ENABLED, the
        # publish step must PROVE the release object is immutable and its
        # release-level attestation verifies — a release that fails either
        # assertion is a broken pipeline, not a release. Audit round 21:
        # the release-level attestation is created ASYNCHRONOUSLY after
        # publication (the v1.6.11 immediate check failed while the
        # release itself verifies fine), so the check is polled for up to
        # three minutes.
        run: |
          set -euo pipefail
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.immutable')"
          echo "release $GITHUB_REF_NAME immutable=$immutable"
          if [[ "$immutable" != "true" ]]; then
            echo "refusing to consider the release published: immutable != true (Immutable Releases not effective)" >&2
            exit 1
          fi
          deadline=$((SECONDS + 180))
          while :; do
            if gh release verify "$GITHUB_REF_NAME"; then
              echo "release verified: immutable + attestation OK"
              exit 0
            fi
            echo "release-level attestation not ready yet — retrying" >&2
            if (( SECONDS > deadline )); then
              echo "release attestation did not appear within 180s" >&2
              exit 1
            fi
            sleep 15
          done
        env:
          GH_TOKEN: ${{ github.token }}
