name: Release

# The release pipeline is gated on the exact tag-triggered ci.yml
# run, split into a blast-radius-limited build job and an attest/publish
# job, and publishes atomically:
#
#   job 1 (contents: read, actions: write — cannot publish/attest):
#     tag-ruleset preflight (the v* tag ruleset must be active with
#     creation + deletion + non-fast-forward blocked) -> gate (no
#     existing release; immutable-releases chain; tag SHA == authorized
#     protected-branch head; signed annotated tag; exact tag CI run
#     succeeded) -> strict pinned build -> released==committed byte
#     proof -> manifests -> release asset contract -> workflow artifact
#
#   job 2 (contents: write, id-token: write, attestations: write — only
#     runs after job 1):
#     download the immutable artifact -> SLSA attestation -> atomic
#     `gh release create` (draft -> upload -> publish, no clobber).
#
# v* tags are protected by an active repository ruleset (creation,
# deletion and non-fast-forward are blocked for refs/tags/v*; the
# bypass-actor list is empty), and the pipeline re-proves that ruleset
# on every run as its first release step. A ruleset that is unreadable,
# inactive or missing any of the three rules fails the run closed.
# GitHub Immutable Releases is enabled
# (PUT /repos/{owner}/{repo}/immutable-releases), so every published
# release object locks its tag and assets and carries a release-level
# attestation; the publish step verifies both (immutable:true API
# assertion + gh release verify).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate-and-build:
    name: Gate and build release assets
    runs-on: ubuntu-latest
    # This job can never publish or attest — it only has read access to
    # contents plus the actions permission required to upload the workflow
    # artifact. The blast radius of repo-controlled bash build.sh is
    # bounded to artifact production.
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: packages/kiwicaptcha-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
      - name: preflight — the v* tag ruleset protects release-tag creation
        # Repository rulesets are the only enforcement that can restrict
        # who creates v* tags, so a release is refused unless the tag
        # ruleset is live: enforcement active, the creation rule plus
        # deletion and non-fast-forward on refs/tags/v*, and no routine
        # bypass actor (only the dedicated release GitHub App may ever be
        # listed). This is the first release step and it fails closed: a
        # 403, a 404 or any other unreadable or unparseable ruleset
        # response is a hard refusal, never a warning — a ruleset that
        # cannot be proven is treated as absent. The parser is shared
        # with the CI fixture (tools/ci/tag-ruleset-check.sh), so the
        # fixture matrix proves the exact logic this step runs.
        run: |
          set -euo pipefail
          ruleset_id="20868582"
          if ! ruleset_json="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id")"; then
            echo "refusing to release: cannot read the v* tag ruleset $ruleset_id (ruleset preflight fails closed on 403/404/unreadable)" >&2
            exit 1
          fi
          printf '%s\n' "$ruleset_json" | bash "$GITHUB_WORKSPACE/tools/ci/tag-ruleset-check.sh" "$ruleset_id"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: gate — exact tag CI, authorized-HEAD equality, signed annotated tag, no existing release
        # The gate runs in a fixed order: an existing release is refused
        # first (releases are immutable), then the immutable-releases
        # preflight chain, then the authorized-head equality (the tag
        # SHA must equal the current head of the authorized protected
        # branch, never merely an ancestor of it), then the signed
        # annotated tag pointing exactly at this workflow SHA, then the
        # GitHub-verified commit, and finally the exact tag CI run. The
        # CI wait is last because the release job's own run can never
        # complete while it waits, and because every cheaper gate should
        # fail before any waiting starts. Querying all check runs for
        # the SHA is wrong twice over: the same SHA carries both a
        # main-push and a tag-push CI copy — only the tag-triggered run
        # proves "the CI workflow triggered by this tag passed",
        # selected by head_sha == GITHUB_SHA AND head_branch ==
        # GITHUB_REF_NAME AND event == push. An existing release is
        # also refused before any build, manifest or attestation work
        # (never create attestations for a release that cannot be
        # published).
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "refusing to publish: release $tag already exists (releases are immutable)" >&2
            exit 1
          fi
          echo "release $tag does not exist yet"

          # Preflight repository immutability before any build/attestation:
          # publishing must never leave behind a public mutable release
          # because the setting was disabled; this check fails the
          # pipeline closed on it. The organization policy is additionally
          # enforced org-wide (PUT /orgs/{org}/settings/immutable-releases
          # enforced_repositories=all), so repository drift is impossible.
          #
          # Live read-only immutable-policy preflight: the repository/org
          # Setting endpoints are admin-gated (403 for this job's plain
          # GITHUB_TOKEN), but the release object exposes the platform's
          # enforcement: every release created while immutable releases
          # are enabled carries `immutable: true` (GET
          # /repos/{o}/{r}/releases/latest — plain token, read-only).
          # Disabling the setting flips existing releases mutable, so the
          # last release's flag is a live behavioral probe of the current
          # policy: if it reads anything but true, the pipeline fails
          # closed before any build work. The admin-declared variable
          # gate below remains as the complementary governance contract —
          # Both sources must agree (the variable names the org admin's
          # declaration; the live field proves the platform actually
          # enforces it).
          live_immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.immutable // empty' 2>/dev/null || true)"
          if [[ -z "$live_immutable" ]]; then
            # No prior release (first release ever): no behavioral probe
            # exists yet — the declared variable gate + the mandatory
            # post-publish immutable assertion with auto-delete carry the
            # chain for this one release.
            echo "immutability preflight: no previous release to probe (first release) — falling back to the declared gate"
          elif [[ "$live_immutable" != "true" ]]; then
            echo "refusing to release: LIVE immutable-policy preflight FAILED — the most recent release reports immutable=$live_immutable (immutable releases appear DISABLED for this repository)" >&2
            exit 1
          else
            echo "immutability preflight: live read-only probe OK (most recent release is immutable=true)"
          fi

          # Hard admin-declared gate: the repository variable must be
          # declared "true" by an org admin. Without it — or when it reads
          # as anything else — the release is refused before any
          # build/attestation work. This is a strict contract: a release
          # can never proceed unless an org admin has declared the
          # immutability governance in place.
          declared="${IMMUTABLE_RELEASES_ENFORCED:-UNSET}"
          echo "immutability gate: IMMUTABLE_RELEASES_ENFORCED=$declared"
          if [[ "$declared" != "true" ]]; then
            echo "refusing to release: IMMUTABLE_RELEASES_ENFORCED is not declared 'true' (admin governance gate) — an org admin must set the repository variable" >&2
            exit 1
          fi

          # Direct preflight (fail-closed when the identity CAN read these
          # admin-gated endpoints — e.g. a GitHub App / admin-token run).
          repo_immutable="$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" 2>/dev/null | jq -r '.enabled // empty' 2>/dev/null || true)"
          org_policy="$(gh api "orgs/$GITHUB_REPOSITORY_OWNER/settings/immutable-releases" 2>/dev/null | jq -r '.enforced_repositories // empty' 2>/dev/null || true)"
          echo "preflight: repo enabled=$repo_immutable org policy=$org_policy"
          if [[ -n "$repo_immutable" && "$repo_immutable" != "true" ]]; then
            echo "refusing to release: immutable releases are DISABLED for this repository" >&2
            exit 1
          fi
          if [[ -n "$org_policy" && "$org_policy" != "all" && "$org_policy" != "selected" ]]; then
            echo "refusing to release: the organization immutable-releases policy is not enforcing ($org_policy)" >&2
            exit 1
          fi
          if [[ "$org_policy" == "selected" ]]; then
            # 'selected' only proves enforcement when this repository is in
            # the selected set. The membership check walks the documented
            # response shape ({total_count, repositories:[{id,...}]}) with
            # pagination — a jq index() against the raw response silently
            # proves nothing (and swallows errors).
            repo_id="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.id' 2>/dev/null || echo '')"
            if [[ -n "$repo_id" ]]; then
              member="false"
              page=1
              while :; do
                body="$(gh api "orgs/$GITHUB_REPOSITORY_OWNER/settings/immutable-releases/repositories?per_page=100&page=$page" 2>/dev/null || true)"
                [[ -z "$body" ]] && break
                found="$(printf '%s' "$body" | jq -r --argjson id "$repo_id" '[.repositories[].id] | index($id) != null' 2>/dev/null || echo false)"
                if [[ "$found" == "true" ]]; then member="true"; break; fi
                total="$(printf '%s' "$body" | jq -r '.total_count // 0' 2>/dev/null || echo 0)"
                fetched="$(printf '%s' "$body" | jq -r '[.repositories[]] | length' 2>/dev/null || echo 0)"
                [[ "$fetched" == "0" || $((page * 100)) -ge "$total" ]] && break
                page=$((page + 1))
              done
              echo "selected-set membership: repo $repo_id member=$member"
              if [[ "$member" != "true" ]]; then
                echo "refusing to release: org policy is 'selected' but this repository is NOT in the selected set" >&2
                exit 1
              fi
            fi
          fi

          # The tag SHA must equal the current head of the authorized
          # protected branch — never merely be an ancestor of it. A
          # signed tag pointing at an older commit would pass an
          # ancestry gate and publish an outdated snapshot as the newest
          # release; exact equality subsumes reachability, so the tagged
          # commit is the branch head. The authorized branch is main by
          # default and is set by the repository variable
          # `RELEASE_AUTHORIZED_BRANCH`; a maintenance release may be cut
          # only from an explicit protected release/N.N branch (for
          # example release/1.6), and any other value is refused. The
          # local-git proof is used because the GitHub compare endpoint
          # is not usable for every ref pair on this repository.
          authorized_branch="${RELEASE_AUTHORIZED_BRANCH:-main}"
          case "$authorized_branch" in
            main|release/[0-9]*.[0-9]*) ;;
            *)
              echo "refusing to release: RELEASE_AUTHORIZED_BRANCH=$authorized_branch is not 'main' or a protected 'release/N.N' branch" >&2
              exit 1
              ;;
          esac
          git fetch --quiet --depth=100 origin "refs/heads/$authorized_branch:refs/remotes/origin/$authorized_branch"
          authorized_head="$(git rev-parse --verify "refs/remotes/origin/$authorized_branch")"
          if [[ "$sha" != "$authorized_head" ]]; then
            echo "refusing to release: tag SHA $sha does not equal the protected $authorized_branch head ($authorized_head) — releases publish only the exact current authorized-branch head" >&2
            exit 1
          fi
          echo "authorized-HEAD equality: $sha == protected $authorized_branch head (local git)"

          # The release tag itself must be a signed annotated tag whose
          # target is exactly this workflow SHA. A lightweight tag or an
          # unsigned annotated tag is refused even when the commit is
          # verified: the tag object carries the release identity and
          # must show GitHub-recognized signature verification of its
          # own. The git tag-object API is the only read path that
          # exposes tag-object verification; the tag ref is fetched so
          # the local resolution is exact.
          git fetch --quiet --depth=100 origin "+refs/tags/$tag:refs/tags/$tag"
          tag_ref="refs/tags/$tag"
          if ! tag_obj_sha="$(git rev-parse --verify "$tag_ref" 2>/dev/null)"; then
            echo "refusing to release: cannot resolve $tag_ref locally" >&2
            exit 1
          fi
          tag_type="$(git cat-file -t "$tag_ref" 2>/dev/null || true)"
          if [[ "$tag_type" != "tag" ]]; then
            echo "refusing to release: $tag_ref is a $tag_type tag, not an annotated tag — release tags must be annotated and signed" >&2
            exit 1
          fi
          if ! tag_ver="$(
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_obj_sha" \
              --jq '{verified: .verification.verified, reason: .verification.reason, type: .object.type, target: .object.sha}'
          )"; then
            echo "refusing to release: cannot read the annotated tag object $tag_obj_sha (signed-tag preflight fails closed)" >&2
            exit 1
          fi
          echo "annotated tag verification: $tag_ver"
          tag_verified="$(jq -r '.verified' <<<"$tag_ver")"
          tag_target_type="$(jq -r '.type' <<<"$tag_ver")"
          tag_target="$(jq -r '.target' <<<"$tag_ver")"
          if [[ "$tag_verified" != "true" ]]; then
            echo "refusing to release: annotated tag $tag is not GitHub-verified (signed-annotated-tag provenance required)" >&2
            exit 1
          fi
          if [[ "$tag_target_type" != "commit" ]]; then
            echo "refusing to release: annotated tag $tag points at a $tag_target_type object, not a commit" >&2
            exit 1
          fi
          if [[ "$tag_target" != "$sha" ]]; then
            echo "refusing to release: annotated tag $tag points at $tag_target, not the workflow SHA $sha" >&2
            exit 1
          fi
          echo "signed annotated tag OK: $tag_obj_sha verified and targeted at the workflow SHA"

          # Release provenance must survive an administrator bypass of
          # branch protection: the exact tagged commit must be
          # GitHub-verified (signed with a key GitHub recognizes as the
          # committer's) before anything is built or published. An
          # unsigned or unknown-key tag is refused.
          ver="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '{verified: .commit.verification.verified, reason: .commit.verification.reason, signature: .commit.verification.signature}')"
          echo "tag commit verification: $ver"
          verified="$(jq -r '.verified' <<<"$ver")"
          if [[ "$verified" != "true" ]]; then
            echo "refusing to release: the exact tag commit $sha is not GitHub-verified (signed-commit provenance required)" >&2
            exit 1
          fi

          deadline=$((SECONDS + 1800))
          while :; do
            ci_run="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&per_page=100" \
                | jq -c --arg sha "$sha" --arg tag "$tag" '
                    [.workflow_runs[]
                     | select(.head_sha == $sha and .head_branch == $tag and .event == "push")]
                    | sort_by(.run_number)
                    | last // empty'
            )"
            if [[ -n "$ci_run" && "$ci_run" != "null" ]]; then
              status="$(jq -r '.status' <<<"$ci_run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$ci_run")"
              echo "tag CI: status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "refusing release: the exact tag CI did not succeed (conclusion=$conclusion)" >&2
                  exit 1
                fi
                echo "exact tag CI succeeded for $sha"
                break
              fi
            else
              echo "tag CI run not found yet (head_sha=$sha head_branch=$tag)"
            fi
            if (( SECONDS > deadline )); then
              echo "timed out waiting for the exact tag CI run" >&2
              exit 1
            fi
            sleep 15
          done
        env:
          GH_TOKEN: ${{ github.token }}
          # Admin-declared immutability gate: the vars context is
          # natively readable by the workflow — set the repository
          # variable `IMMUTABLE_RELEASES_ENFORCED=true` as part of the
          # governance contract.
          IMMUTABLE_RELEASES_ENFORCED: ${{ vars.IMMUTABLE_RELEASES_ENFORCED }}
          # The authorized release branch (main by default; a protected
          # release/N.N branch for a maintenance release). The variable
          # is set by an org admin before a maintenance tag push.
          RELEASE_AUTHORIZED_BRANCH: ${{ vars.RELEASE_AUTHORIZED_BRANCH }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24) — same pin as ci.yml
        with:
          node-version: "22"
      - name: strict deterministic build
        env:
          WASM_OPT_STRICT: "1"
        run: bash build.sh
      - name: released bytes must equal the committed (browser-tested) bytes
        # The committed assets are what the browser suite and the
        # Symfony/core parity jobs test. The strict rebuild must reproduce
        # them exactly — any drift fails the release, so tested bytes ==
        # released bytes by construction.
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            assets/kiwicaptcha-wasm.js \
            assets/kiwi-worker.js \
            assets/execution-interpreter.js \
            assets/widget-driver.js \
            assets/widget-risk.js \
            assets/widget-telemetry.js \
            assets/widget-locales.js \
            assets/widget-compat.js \
            assets/widget.css
          echo "strict rebuild == committed/tested assets"
      - name: release manifest (SHA-256 + SRI)
        # SHA256SUMS uses basenames so `shasum -c SHA256SUMS` works in a
        # flat download folder; SRI covers all five release assets
        # (widget.css is SRI-capable via <link>). Both manifests are
        # written inside assets/ so the single upload directory carries
        # everything with a predictable layout (no common-prefix
        # flattening ambiguity across multiple upload paths).
        run: |
          set -euo pipefail
          ( cd assets && shasum -a 256 kiwicaptcha-wasm.js kiwi-worker.js widget-driver.js widget-risk.js widget-telemetry.js widget-locales.js widget-compat.js widget.css execution-interpreter.js > SHA256SUMS && node ../tools/sri-hashes.mjs > SRI.txt && cat SHA256SUMS && cat SRI.txt )
      - name: release asset contract (workflow lists == generated manifests)
        # The asset contract is re-proven here on the exact artifacts
        # about to be attested and published: every asset in
        # release-assets.txt must appear in the workflow's attestation
        # list, publish list, manifest producer and SRI producer, and
        # the freshly generated SHA256SUMS and SRI.txt files. The same
        # script is a required CI job, so drift fails CI long before a
        # tag exists; this step makes the contract part of the release
        # run itself.
        run: bash "$GITHUB_WORKSPACE/tools/ci/release-asset-contract.sh"
      - name: upload the immutable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: packages/kiwicaptcha-wasm/assets
          if-no-files-found: error
          retention-days: 7

  attest-and-publish:
    name: Attest and publish the release
    runs-on: ubuntu-latest
    needs: gate-and-build
    # Only this job holds publish/attestation capability, and it runs only
    # after the gated build produced the artifact.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # No defaults.run.working-directory here: every path is absolute via
    # $GITHUB_WORKSPACE. The checkout exists only so `gh release create
    # --verify-tag` can verify the tag against a git repo (gh runs git
    # locally); the attested/published files come from the artifact.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: download the immutable build artifact
        # The artifact carries the assets + manifests at its root (the
        # upload path was the assets directory itself), extracted into
        # $GITHUB_WORKSPACE.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
      - name: attest the release artifacts (SLSA provenance)
        # Producer: actions/attest-build-provenance (the only supported
        # producer); consumer: `gh attestation verify`. Subject paths are
        # workspace-rooted (defaults.run.working-directory does not apply
        # to uses: actions).
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ github.workspace }}/kiwicaptcha-wasm.js
            ${{ github.workspace }}/kiwi-worker.js
            ${{ github.workspace }}/widget-driver.js
            ${{ github.workspace }}/widget-risk.js
            ${{ github.workspace }}/widget-telemetry.js
            ${{ github.workspace }}/widget-locales.js
            ${{ github.workspace }}/widget-compat.js
            ${{ github.workspace }}/widget.css
            ${{ github.workspace }}/execution-interpreter.js
            ${{ github.workspace }}/SHA256SUMS
            ${{ github.workspace }}/SRI.txt
      - name: publish the release atomically (draft -> upload -> publish)
        # Assets are passed directly to `gh release create` — GitHub CLI
        # creates the release as a draft, uploads the assets, and only
        # then publishes it; a failure never leaves a public partial
        # release. An existing release is already refused in the gate
        # (and is refused again here) — no --clobber, ever.
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "refusing to publish: release $GITHUB_REF_NAME already exists (releases are immutable)" >&2
            exit 1
          fi
          # The release evidence is generated from the API (never
          # hand-written): the exact tag CI job counts and the
          # verified-commit state are computed here and embedded in the
          # notes, so the evidence cannot go stale.
          ci_run="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&per_page=100" \
              | jq -c --arg sha "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" '
                  [.workflow_runs[] | select(.head_sha == $sha and .head_branch == $tag and .event == "push")]
                  | sort_by(.run_number) | last // empty'
          )"
          ci_run_id="$(jq -r '.id' <<<"$ci_run")"
          jobs_total="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/jobs?per_page=100" --jq '.total_count')"
          jobs_success="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "success")] | length')"
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')"
          cat > "$GITHUB_WORKSPACE/RELEASE_NOTES.md" <<NOTES
          Release CI-gated, strict-built and SLSA-attested by .github/workflows/release.yml (Rust 1.96.0, wasm-bindgen 0.2.127 --locked, binaryen version_119 verified, released bytes == browser-tested bytes).

          CI evidence (API-generated): exact tag CI run #$ci_run_id — $jobs_success/$jobs_total jobs successful. Tag commit $GITHUB_SHA GitHub-verified: $verified.

          Manifests: SHA256SUMS (sha256, basenames) + SRI.txt (sha384). Verify: gh attestation verify <asset> --repo $GITHUB_REPOSITORY
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "$GITHUB_WORKSPACE/kiwicaptcha-wasm.js" \
            "$GITHUB_WORKSPACE/kiwi-worker.js" \
            "$GITHUB_WORKSPACE/widget-driver.js" \
            "$GITHUB_WORKSPACE/widget-risk.js" \
            "$GITHUB_WORKSPACE/widget-telemetry.js" \
            "$GITHUB_WORKSPACE/widget-locales.js" \
            "$GITHUB_WORKSPACE/widget-compat.js" \
            "$GITHUB_WORKSPACE/widget.css" \
            "$GITHUB_WORKSPACE/execution-interpreter.js" \
            "$GITHUB_WORKSPACE/SHA256SUMS" \
            "$GITHUB_WORKSPACE/SRI.txt" \
            --verify-tag \
            --title "KiwiCaptcha $GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: verify the published release (immutability + attestation)
        # With GitHub Immutable Releases enabled, the publish step must
        # prove the release object is immutable and its release-level
        # attestation verifies — a release that fails either assertion is
        # a broken pipeline, not a release. The release-level attestation
        # is created asynchronously after publication, so the check is
        # polled for up to three minutes.
        run: |
          set -euo pipefail
          immutable="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.immutable')"
          echo "release $GITHUB_REF_NAME immutable=$immutable"
          if [[ "$immutable" != "true" ]]; then
            # A post-publication immutability failure immediately deletes
            # the release (best-effort containment — the org-level policy
            # and the preflight make this path unreachable in practice)
            # and then fails.
            echo "immutable != true — deleting the failed release immediately" >&2
            gh release delete "$GITHUB_REF_NAME" --yes || true
            echo "refusing to consider the release published: immutable != true" >&2
            exit 1
          fi
          deadline=$((SECONDS + 180))
          while :; do
            if gh release verify "$GITHUB_REF_NAME"; then
              echo "release verified: immutable + attestation OK"
              exit 0
            fi
            echo "release-level attestation not ready yet — retrying" >&2
            if (( SECONDS > deadline )); then
              echo "release attestation did not appear within 180s" >&2
              exit 1
            fi
            sleep 15
          done
        env:
