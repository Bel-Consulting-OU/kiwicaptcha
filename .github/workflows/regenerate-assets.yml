name: Regenerate canonical assets

# Audit round 19: the committed browser assets must be byte-identical to
# what the release pipeline produces. wasm-opt output is machine-dependent
# (thread-count/parallel-scheduling sensitive), so the canonical bytes are
# generated ON THE SAME runner platform as the release (ubuntu-latest,
# x86_64, 4 vCPU) instead of any developer machine. Run this workflow
# (workflow_dispatch), download the `canonical-assets` artifact, verify,
# and commit the bytes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Strict build on the release platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: packages/kiwicaptcha-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24) — same pin as ci.yml
        with:
          node-version: "22"
      - name: strict deterministic build (release platform)
        env:
          WASM_OPT_STRICT: "1"
        run: bash build.sh
      - name: upload the canonical assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-assets
          path: |
            packages/kiwicaptcha-wasm/assets/kiwicaptcha-wasm.js
            packages/kiwicaptcha-wasm/assets/kiwi-worker.js
            packages/kiwicaptcha-wasm/assets/widget-driver.js
            packages/kiwicaptcha-wasm/assets/widget.css
          if-no-files-found: error
          retention-days: 30
