  browser:
    name: Native browser runtime (solver + lifecycle, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: gmp, json, openssl, sodium
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: '22'
      - name: install PHP core (fixture server)
        working-directory: packages/kiwicaptcha-php
        run: composer install --no-interaction --prefer-dist
      - name: install Symfony bundle (real ApiJsController for the compat endpoints)
        # The fixture router serves /kiwi-captcha/api.js and
        # /kiwi-captcha/widget.css through the real bundle controller: the
        # bundle vendor must exist so the production code path (not a
        # hard-coded concat) is what the browser tests exercise.
        working-directory: packages/kiwicaptcha/integrations/symfony
        run: composer install --no-interaction --no-scripts --prefer-dist
      - name: install Playwright
        working-directory: tests/browser
        run: |
          # npm ci installs exactly the committed package-lock.json
          # (reproducible browser-suite deps).
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: run browser tests
        working-directory: tests/browser
        run: npx playwright test


  # The accessibility acceptance suite and the curated cross-browser
  # critical-path suite run across Chromium + Firefox + WebKit
  # (playwright.a11y.config.mjs). This is a required status check —
  # three-engine evidence is part of the AA conformance claim.
  browser-a11y:
    name: Browser accessibility + cross-browser (Chromium + Firefox + WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: gmp, json, openssl, sodium
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: '22'
      - name: install PHP core (fixture server)
        working-directory: packages/kiwicaptcha-php
        run: composer install --no-interaction --prefer-dist
      - name: install Symfony bundle (real controllers for the fixture)
        working-directory: packages/kiwicaptcha/integrations/symfony
        run: composer install --no-interaction --no-scripts --prefer-dist
      - name: install Playwright + all three engines
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: run WCAG + cross-browser suite (three engines)
        working-directory: tests/browser
        run: npx playwright test --config=playwright.a11y.config.mjs

  n1-compat:
    # N-1 compatibility evidence for the capability header: the lane
    # adds the last revision that predates Kiwi-Execution-Max-Version
    # (b32ec01e) as a git worktree and boots its own fixture server
    # plus its real ChallengeController, then drives the current
    # widget's request shapes against that frozen backend. The foreign
    # capability header must be ignored (HTTP 200, op_version 1), a
    # foreign body field must still answer 422 with error code
    # `UNKNOWN_FIELDS` (the strict closed body set is why the
    # capability rides a header, never a body field), and a headerless
    # request must keep issuing version-1 programs. No Redis service is
    # needed: the frozen fixture mints with ArrayStorage and temp
    # files. The current backend's side of the rectangle stays owned
    # by the browser and Symfony lanes.
    name: N-1 compatibility (frozen previous release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          # The lane adds the frozen revision as a git worktree, so
          # this checkout must carry the full history.
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: gmp, json, openssl, sodium
          coverage: none
      - name: add the frozen revision as a worktree
        run: |
          git -C "$GITHUB_WORKSPACE" worktree remove --force /tmp/kiwi-n1 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" worktree add /tmp/kiwi-n1 b32ec01e
      - name: N-1 compatibility (frozen previous release)
        run: bash tools/ci/n1-compat.sh /tmp/kiwi-n1
      - name: remove the frozen worktree
        if: always()
        run: git -C "$GITHUB_WORKSPACE" worktree remove --force /tmp/kiwi-n1

  repo-sanity:
    # Semantic repository/release sanity gate: a mechanically valid
    # release pipeline must never sign and attest the wrong product
    # content. Checks the product identity of the `README`, the Cargo
    # package, the Composer packages and the release asset names.
    name: Repo semantic sanity (product identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          # Full history: the baseline-integrity step resolves its
          # comparison base (the PR base / the push's previous head) from
          # the repository, and the docs-lint scan covers workflow prose,
          # so a shallow checkout would make the base unresolvable.
          fetch-depth: 0
      - name: product identity checks
        run: |
          set -euo pipefail
          KIWI_HDR='# KiwiCaptcha'
          APEX_HDR='# ApexM''ail'
          grep -q "^$KIWI_HDR" README.md || { echo "README is not the KiwiCaptcha README" >&2; exit 1; }
          if grep -q "^$APEX_HDR" README.md; then echo "README contains the wrong product header" >&2; exit 1; fi
          grep -q 'packages/kiwicaptcha' README.md || { echo "README lost the package references" >&2; exit 1; }
          grep -q '"name": "bel-consulting/kiwicaptcha-symfony"' packages/kiwicaptcha/integrations/symfony/composer.json || { echo "bundle composer name wrong" >&2; exit 1; }
          grep -q '^name = "kiwicaptcha"' packages/kiwicaptcha/Cargo.toml || { echo "Cargo package name wrong" >&2; exit 1; }
          for asset in kiwicaptcha-wasm.js kiwi-worker.js widget-driver.js widget-risk.js widget-telemetry.js widget-locales.js widget-compat.js widget.css; do
            test -f "packages/kiwicaptcha-wasm/assets/$asset" || { echo "missing release asset $asset" >&2; exit 1; }
          done
          test -f tests/browser/compat-capabilities.json || { echo "missing capability matrix" >&2; exit 1; }
          # The packages/ hierarchy is the only source root — top-level
          # mirrors must never reappear (they diverged in
          # security-adjacent source before removal).
          for d in kiwicaptcha kiwicaptcha-php kiwicaptcha-wasm kiwicaptcha-risk kiwicaptcha-risk-php; do
            test ! -d "$d" || { echo "duplicate source root $d/ exists — packages/ is canonical" >&2; exit 1; }
          done
          echo "product identity OK"
      - name: accessibility documents must be byte-identical
        # The canonical accessibility document lives in the WASM package;
        # the Symfony bundle ships a packaged copy that must never drift
        # from it (the conformance claim is a single canonical text).
        run: |
          set -euo pipefail
          cmp packages/kiwicaptcha-wasm/ACCESSIBILITY.md \
            packages/kiwicaptcha/integrations/symfony/Resources/ACCESSIBILITY.md \
            || { echo "ACCESSIBILITY.md drift: packages/kiwicaptcha-wasm/ACCESSIBILITY.md and packages/kiwicaptcha/integrations/symfony/Resources/ACCESSIBILITY.md differ — the packaged Symfony copy must stay byte-identical to the canonical WASM document" >&2; exit 1; }
          echo "accessibility documents byte-identical"
      - name: Install gawk (deterministic prose lint)
        run: sudo apt-get update && sudo apt-get install -y gawk

      - name: docs-lint adoption-manifest one-shot tests
        # The adoption manifest's one-shot semantics (an entry applies
        # once, is consumed when its path lands, and never re-adopts a
        # reintroduced path) are behavior, not convention — this step
        # runs the shell-level test suite against throwaway
        # baselines/manifests before the lint steps enforce them.
        run: sh packages/kiwicaptcha/tools/docs-lint-one-shot-test.sh

      - name: error-code parity (PHP enum vs Rust code() mapping)
        # The cross-language wire-vocabulary drift gate: parses the PHP
        # VerifyError enum's case values and greps the Rust core's
        # code() mapping, failing on any PHP code without a Rust twin
        # (outside the script's documented-divergence table). A
        # handwritten Rust-side list cannot detect PHP-side drift; this
        # reads both sources directly.
        run: sh packages/kiwicaptcha/tools/verify-error-code-parity.sh

      - name: docs-lint (prose lint, baseline ratchet)
        # Baseline ratchet: the committed baseline
        # (packages/kiwicaptcha/tools/docs-lint-baseline.txt) is tracked
        # and intentionally reduced over time; this step fails when any
        # scanned file exceeds its per-file row (a scanned file without
        # a row counts as a new file with baseline 0) or the total
        # exceeds the baseline total. Scan roots: the five kiwicaptcha
        # package families, the browser test suite under tests/browser,
        # the design docs under protocol/, the workflow prose under
        # .github/workflows/, and the product root files `README.md` and
        # `SECURITY.md` (root-level roots are scanned only when present).
        # After deliberate rewrites, --update-baseline regenerates the
        # per-file baseline; once it reaches zero, advisory mode is
        # removed.
        run: |
          set -euo pipefail
          bash packages/kiwicaptcha/tools/docs-lint.sh --source --baseline packages/kiwicaptcha/tools/docs-lint-baseline.txt
      - name: docs-lint (prose lint, baseline integrity)
        # The comparison base is the PR base branch or the push's
        # previous head, so a whole proposed change may only decrease the
        # baseline; a single-commit comparison is insufficient. The
        # committed baseline must be monotonic against the base baseline:
        # every tracked path's row may only stay equal or decrease (a
        # path dropped from the baseline is a deletion and is fine), a
        # path newly tracked by the current baseline is allowed only when
        # adopted in packages/kiwicaptcha/tools/docs-lint-adopted.txt,
        # and the total may only stay equal or decrease. Regeneration
        # with --update-baseline may only reduce the rows, so a scan that
        # needs headroom must be fixed by a rewrite, never by
        # regenerating the baseline. The adoption manifest is one-shot:
        # every entry must be absent from the base baseline, and an entry
        # that already has a row there is stale (its adoption landed) and
        # fails the step, forcing its removal. If no comparison base is
        # resolvable the step fails closed: a baseline that cannot be
        # compared cannot be trusted.
        run: |
          set -euo pipefail
          # The comparison base is resolved from the explicit event
          # context only: a pull_request compares against its base branch
          # head, a push against the previous head. Any other trigger
          # (workflow_dispatch, schedule, merge_group) has no defined
          # base — the step fails closed with a clear message instead of
          # silently comparing against an arbitrary commit (an
          # environment-variable probe with unconditional parent
          # fallbacks could compare a single-commit window and understate
          # a whole change).
          case "${{ github.event_name }}" in
            pull_request)
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              BASE_SHA="${{ github.event.before }}"
              ;;
            *)
              echo "::error::baseline-integrity requires a pull_request or push event context (got ${{ github.event_name }}); no comparison base is defined"
              exit 1
              ;;
          esac
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # A push with no readable 'before' (a tag push or a new
            # branch push — GitHub reports the zero SHA) still has a
            # defined comparison base: the pushed commit's parent. The
            # tag-triggered CI run is the release pipeline's gate, so
            # this path must stay comparable, never skipped.
            BASE_SHA="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
            if [ -z "$BASE_SHA" ]; then
              echo "::error::baseline-integrity cannot run: the push carries no 'before' and HEAD has no parent (a root commit has no comparison base)"
              exit 1
            fi
            echo "note: no 'before' in the event context — comparing against the parent $BASE_SHA"
          fi
          if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "::error::baseline-integrity cannot run: base $BASE_SHA is not readable in this checkout"
            exit 1
          fi
          if ! git cat-file -e "$BASE_SHA:packages/kiwicaptcha/tools/docs-lint-baseline.txt" 2>/dev/null; then
            echo "::error::baseline-integrity cannot run: no baseline file at the base $BASE_SHA"
            exit 1
          fi
          git show "$BASE_SHA:packages/kiwicaptcha/tools/docs-lint-baseline.txt" > /tmp/base-baseline.txt
          # Adoption one-shot enforcement: every entry must be absent
          # from the base baseline; an entry with a row there is stale
          # and fails the step, forcing its removal from the manifest.
          while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%%#*}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] || continue
            if awk -v p="$entry" '!/^TOTAL[ \t]/ && $2 == p { found = 1 } END { exit !found }' /tmp/base-baseline.txt; then
              echo "::error::stale adoption manifest entry: $entry already has a row in the base baseline; remove it from packages/kiwicaptcha/tools/docs-lint-adopted.txt"
              exit 1
            fi
          done < packages/kiwicaptcha/tools/docs-lint-adopted.txt
          bash packages/kiwicaptcha/tools/docs-lint.sh --source --integrity /tmp/base-baseline.txt

  release-contract:
    # Release governance semantic gate, required like its repo-sanity
    # neighbors: the release asset contract (every manifest asset must
    # ride every release carrier list and the manifests, as one set),
    # the tag-ruleset parser fixture matrix (the release workflow's
    # ruleset preflight logic, proven without network), and the
    # version-prose ratchet (stale execution-version and bypass
    # governance claims anywhere in the scanned roots fail CI).
    name: Release asset contract + governance fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: release asset contract (workflow asset lists == manifests)
        run: bash tools/ci/release-asset-contract.sh
      - name: release governance fixtures (tag-ruleset parser matrix)
        run: bash tools/ci/release-governance-fixture.sh
      - name: version prose lint (stale execution-version/bypass claims)
        run: bash tools/ci/version-prose-lint.sh

  doc-hygiene:
    # Static-doc hygiene gate: production source, browser release assets,
    # public READMEs and the workflows themselves must never carry
    # internal-history commentary (audit IDs, round labels, severity
    # tags, behavior-history narration, or references to the wrong
    # upstream product). Changelogs and release notes are the designated
    # home for history and are excluded from the scan; an informational
    # step surfaces drift in those excluded categories without failing.
    name: Doc hygiene (no internal-history commentary in product source)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: install ripgrep
        # The scan below is rg-based and the ubuntu runners do not ship
        # ripgrep: the `if rg` gate would fail open (command-not-found)
        # and the lane would silently never gate, so rg is installed
        # before the scan.
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: scan product source for internal-history commentary
        run: |
          set -euo pipefail
          # Production source, browser release assets, public READMEs and
          # the workflows themselves must not carry internal-history
          # commentary (audit IDs, round labels, severity tags,
          # behavior-history narration, or references to the wrong
          # upstream product). Changelogs and release notes are the
          # designated home for history; an informational step surfaces
          # drift there without failing.
          PATTERN='audit( round)? #[0-9]''+''|audit roun''d''|round[- ]?[0-9]''+''|\bP[0-3]\b''|the o''ld''|previousl''y''|previous implementatio''n''|catastroph''ic''|ApexMa''il'
          if rg -n -i \
            --glob '!CHANGELOG*' \
            --glob '!**/CHANGELOG*' \
            --glob '!**/vendor/**' \
            --glob '!**/node_modules/**' \
            --glob '!**/target/**' \
            "$PATTERN" \
            packages tests README.md SECURITY.md .github/workflows; then
            echo "internal-history commentary found in product source/docs (see matches above)" >&2
            exit 1
          fi
          echo "doc hygiene OK: no internal-history commentary in product source"
      - name: excluded-category match count (changelogs/workflows, informational)
        run: |
          echo "excluded-category matches (changelogs/workflows):"
          PATTERN='audit( round)? #[0-9]''+''|audit roun''d''|round[- ]?[0-9]''+''|\bP[0-3]\b'
          rg -n -i --glob '*CHANGELOG*' --glob '.github/**' "$PATTERN" . 2>/dev/null | wc -l

  package-cargo:
    name: Package (cargo publish readiness)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
      - name: cargo package (risk crate)
        working-directory: packages/kiwicaptcha-risk
        run: |
          cargo package --list | grep -q 'resources/risk-v1.lua' || { echo 'resources/risk-v1.lua missing from the .crate'; exit 1; }
      - name: standalone build outside the monorepo (no include_str escape)
        run: |
          set -euo pipefail
          rm -rf /tmp/crate-check
          mkdir -p /tmp/crate-check
          cp -r packages/kiwicaptcha-risk /tmp/crate-check/
          cd /tmp/crate-check/kiwicaptcha-risk
          rm -rf target
          # Point the versioned dependency at the local core (as crates.io
          # resolution would once kiwicaptcha 1.7.0 is published). The
          # include_str!("../resources/risk-v1.lua") must resolve here.
          sed -i 's|path = "../kiwicaptcha"|path = "'"$GITHUB_WORKSPACE"'/packages/kiwicaptcha"|' Cargo.toml
          cargo check
      - name: quick-start end-to-end
        # The example's #[test] is also executed in the package-readiness
        # job: the artifact a publisher ships must pass the documented
        # flow.
        working-directory: packages/kiwicaptcha
        run: cargo test -p kiwicaptcha --example quickstart
      - name: cargo package (core crate, REAL verification)
        # `cargo package --locked` runs Cargo's full verification build of
        # the packaged representation (tarball -> unpack -> compile), not
        # just `--no-verify` list checks. The core crate's dependencies
        # are all registry crates, so verification is genuine. (The risk
        # crate keeps --no-verify until kiwicaptcha 1.7.0 is on the
        # registry — its path+version dependency cannot be verified from
        # the tarball alone.)
        working-directory: packages/kiwicaptcha
        run: cargo package --locked

  package-composer:
    name: Package (composer clean-room install)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: gmp, json, openssl, sodium
          coverage: none
      - name: clean-room install outside the monorepo
        run: |
          set -euo pipefail
          mkdir -p /tmp/composer-clean/packages
          cp -r packages/kiwicaptcha-php /tmp/composer-clean/packages/
          cp -r packages/kiwicaptcha-risk-php /tmp/composer-clean/packages/
          rm -rf /tmp/composer-clean/packages/*/vendor /tmp/composer-clean/packages/*/composer.lock
          cd /tmp/composer-clean
          composer init --no-interaction --name=ci/smoke
          composer config repositories.php '{"type": "path", "url": "/tmp/composer-clean/packages/kiwicaptcha-php", "options": {"versions": {"kiwicaptcha/kiwicaptcha-php": "1.0.0"}}}'
          composer config repositories.risk '{"type": "path", "url": "/tmp/composer-clean/packages/kiwicaptcha-risk-php", "options": {"versions": {"kiwicaptcha/kiwicaptcha-risk-php": "0.1.0"}}}'
          composer require kiwicaptcha/kiwicaptcha-php kiwicaptcha/kiwicaptcha-risk-php --no-interaction --prefer-dist
          test -f vendor/kiwicaptcha/kiwicaptcha-risk-php/resources/risk-v1.lua \
            || { echo 'risk-v1.lua not shipped in the published package'; exit 1; }
          # Smoke: the store constructor resolves the bundled Lua without
          # the monorepo (no Redis needed — Predis connects lazily).
          # shellcheck disable=SC2016 # PHP variable inside single-quoted code
          php -r 'require "vendor/autoload.php"; $s = new KiwiCaptcha\Risk\Storage\RedisRiskStateStore(new Predis\Client(), "smoke"); echo "OK\n";'

  lua-parity:
    name: Package (canonical Lua byte parity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: every canonical Lua file exists in all three locations and is byte-identical
        # Explicit existence + cmp per file fails unambiguously on any
        # drift: hashing a non-existent path collapses the pipeline to a
        # single unique hash and proves nothing, so every canonical file
        # is asserted to exist in all three locations and byte-compared.
        run: |
          set -euo pipefail
          for f in risk-v1.lua calibration.lua confirm.lua correction.lua \
                    outcome_confirm.lua outcome_correct.lua outcome_register.lua \
                    register_decision.lua sampling_metrics.lua; do
            test -f "protocol/risk-v1/$f" || { echo "missing protocol/risk-v1/$f"; exit 1; }
            test -f "packages/kiwicaptcha-risk/resources/$f" || { echo "missing packages/kiwicaptcha-risk/resources/$f"; exit 1; }
            test -f "packages/kiwicaptcha-risk-php/resources/$f" || { echo "missing packages/kiwicaptcha-risk-php/resources/$f"; exit 1; }
            cmp -s "protocol/risk-v1/$f" "packages/kiwicaptcha-risk/resources/$f" \
              || { echo "mismatch: $f (protocol vs rust)"; exit 1; }
            cmp -s "protocol/risk-v1/$f" "packages/kiwicaptcha-risk-php/resources/$f" \
              || { echo "mismatch: $f (protocol vs php)"; exit 1; }
          done
          echo "all 9 canonical Lua copies byte-identical"

  rust-redis-verify:
    name: Rust core Redis verifier (redis feature)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73 # Redis 7.x.y (digest of the redis:7 tag as of 2026-08-05), digest-pinned
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/kiwicaptcha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
      - name: redis_verify integration tests (real Redis)
        # The production RedisChallengeStore + verifier are feature-gated
        # behind `redis`, so the default-feature build never compiles or
        # runs them. This job exercises them against a real Redis
        # (consumed-state transitions, leases, replica-wait barriers,
        # concurrency) on every push.
        env:
          RISK_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --features redis --test redis_verify

  # INDEPENDENT-runner reproducibility: the in-runner double build
  # (build-reproducibility) proves cache independence; this pair proves
  # environment independence (two separate runners), byte-compared by the
  # follow-up job.
  build-repro-a:
    name: Build reproducibility A (independent runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/kiwicaptcha-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: clean strict build (runner A)
        env:
          WASM_OPT_STRICT: "1"
        run: |
          bash build.sh
          mkdir -p /tmp/repro-a
          ls assets/ && cp assets/kiwicaptcha-wasm.js assets/kiwi-worker.js assets/widget-driver.js assets/widget-risk.js assets/widget-telemetry.js assets/widget-locales.js assets/widget-compat.js assets/widget.css /tmp/repro-a/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 # v5.0.1 (node24)
        with:
          name: repro-a
          path: /tmp/repro-a
          if-no-files-found: error

  build-repro-b:
    name: Build reproducibility B (independent runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/kiwicaptcha-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: clean strict build (runner B)
        env:
          WASM_OPT_STRICT: "1"
        run: |
          bash build.sh
          mkdir -p /tmp/repro-b
          cp assets/kiwicaptcha-wasm.js assets/kiwi-worker.js assets/widget-driver.js assets/widget-risk.js assets/widget-telemetry.js assets/widget-locales.js assets/widget-compat.js assets/widget.css /tmp/repro-b/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 # v5.0.1 (node24)
        with:
          name: repro-b
          path: /tmp/repro-b
          if-no-files-found: error

  build-repro-compare:
    name: Build reproducibility (independent byte-compare)
    needs: [build-repro-a, build-repro-b]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 # v5.0.1 (node24)
        with:
          name: repro-a
          path: /tmp/repro-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 # v5.0.1 (node24)
        with:
          name: repro-b
          path: /tmp/repro-b
      - name: byte-compare the independent artifacts
        run: |
          set -euo pipefail
          for asset in kiwicaptcha-wasm.js kiwi-worker.js widget-driver.js widget-risk.js widget-telemetry.js widget-locales.js widget-compat.js widget.css; do
            cmp "/tmp/repro-a/$asset" "/tmp/repro-b/$asset" || { echo "independent builds differ on $asset" >&2; exit 1; }
            shasum -a 256 "/tmp/repro-a/$asset"
          done
          echo "two INDEPENDENT runners produced byte-identical assets"

  build-reproducibility:
    # Two fully clean build-tree/cache runs in ONE controlled runner
    # (same Rust env + registry) demonstrate reproducibility; the
    # build-repro-a/b pair extends the proof to independent environments.
    name: Build reproducibility (two clean strict builds, one runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/kiwicaptcha-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: first clean strict build
        # Reproducibility is demonstrated, not inferred from version pins:
        # two fully clean strict builds (fresh target dir, fresh pkg dir,
        # fresh wasm-opt download) must produce identical asset hashes.
        env:
          WASM_OPT_STRICT: "1"
        run: |
          bash build.sh
          shasum -a 256 assets/kiwicaptcha-wasm.js assets/kiwi-worker.js \
                 assets/widget-driver.js assets/widget-risk.js assets/widget-telemetry.js assets/widget-locales.js assets/widget-compat.js assets/widget.css > /tmp/build1.sha256
      - name: second clean strict build (fresh cache + target)
        env:
          WASM_OPT_STRICT: "1"
        run: |
          cargo clean
          rm -rf pkg
          rm -rf "$HOME/.cache/kiwicaptcha-wasm"
          bash build.sh
          shasum -a 256 assets/kiwicaptcha-wasm.js assets/kiwi-worker.js \
                 assets/widget-driver.js assets/widget-risk.js assets/widget-telemetry.js assets/widget-locales.js assets/widget-compat.js assets/widget.css > /tmp/build2.sha256
      - name: byte-compare the two builds
        run: |
          diff /tmp/build1.sha256 /tmp/build2.sha256
          echo "two clean isolated strict builds produce identical asset hashes"

  symfony-assets:
    name: Symfony widget assets (byte parity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
      - name: core crate resources must be byte-identical to the canonical assets
        # The core crate embeds assets from its own resources/ directory
        # (cargo package verification cannot reach outside the crate);
        # build.sh regenerates the copies and they must never drift from
        # the canonical wasm assets.
        run: |
          set -euo pipefail
          for f in widget-driver.js widget-risk.js widget-telemetry.js widget-locales.js widget-compat.js widget.css kiwicaptcha-wasm.js execution-interpreter.js; do
            cmp -s "packages/kiwicaptcha-wasm/assets/$f" \
              "packages/kiwicaptcha/resources/$f" \
              || { echo "stale $f in packages/kiwicaptcha/resources — run packages/kiwicaptcha-wasm/build.sh"; exit 1; }
          done
          echo "core crate resources byte-identical to the canonical assets"
      - name: bundle copies must be byte-identical to the canonical assets
        # The bundle's public copies must be byte-identical to the
        # canonical built assets: a generated duplicate that drifts is
        # mechanically impossible to merge while stale, enforced here with
        # cmp on every push.
        run: |
          set -euo pipefail
          for f in widget-driver.js widget-risk.js widget-telemetry.js widget-locales.js widget-compat.js kiwicaptcha-wasm.js widget.css execution-interpreter.js; do
            cmp -s "packages/kiwicaptcha-wasm/assets/$f" \
              "packages/kiwicaptcha/integrations/symfony/Resources/public/$f" \
              || { echo "stale $f in the Symfony bundle — run bin/sync-assets.sh"; exit 1; }
          done
          echo "Symfony widget assets byte-identical to the canonical build"
      - name: worker source is generated into the driver (no manual drift)
        # assets/kiwi-worker.js is the source of truth; the driver's
        # embedded KIWI_WORKER_SRC literal is machine-generated by the
        # kiwicaptcha-embed-worker Rust tool (run by build.sh) — a
        # hand-edited embedded copy fails here.
        run: |
          cargo run --locked --manifest-path packages/kiwicaptcha-wasm/tools/embed-worker/Cargo.toml -- --check

  perf-budget:
    # Deterministic performance budgets. The hard byte limits run first
    # and are gating: the three widget-driver copies (raw, gzip and
    # brotli) and the decoy-armed and v4 execution-armed
    # challenge-response JSON must stay under their caps
    # or this job fails. The synthetic-load benchmark steps then measure
    # issuance and verification p50/p95 under fixed workloads — the
    # ArrayStorage SHA baseline, the real-Redis SHA path (a redis
    # service on 6399, the KC_REDIS_URL contract of perf-bench.php), the
    # Argon2id admission path (64 MiB, t=3), the risk-enabled
    # controller path, the real-Redis concurrent risk-enabled path
    # (forked workers through the DSN-built client, the --redis mode of
    # perf-bench-risk.php) and the verified-WAIT fixtures: the
    # single-node round trip (perf-wait.php, the shortfall/fail-closed
    # path) and the local primary+replica fixture (perf-wait-replica.php,
    # the successful-acknowledgment path), both non-gating by design.
    # Every timing step is
    # non-gating by design (a shared GitHub runner is too noisy for a
    # hard latency gate), so a timing regression surfaces loudly without
    # blocking the merge lane while a byte regression blocks it. The
    # benchmark's relative ratchets are documented as
    # noisy-runner-tolerant in tools/perf-bench.php, tools/perf-bench-risk.php
    # and tools/perf-load.php. The manually dispatched hard-ratchet benchmark lives in the
    # separate "Performance latency (manual hard-ratchet benchmark)"
    # job, which is workflow_dispatch-only and runs these same timing
    # steps without continue-on-error.
    name: Performance budgets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73 # Redis 7.x.y (digest of the redis:7 tag as of 2026-08-05), digest-pinned
        ports:
          - 6399:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          php-version: '8.2'
          extensions: gmp, json, openssl, sodium
          coverage: none
      - name: install brotli (compressed widget-driver budgets)
        # The ubuntu runners ship gzip but no brotli; the compressed
        # budget is enforced only when a brotli encoder exists, so the
        # runner installs the CLI (perf-budget.sh falls back to the
        # python3 brotli module and notes a skipped cap when neither is
        # available on a local machine).
        run: sudo apt-get update && sudo apt-get install -y brotli
      - name: install PHP core (the challenge-response measure issues real challenges)
        working-directory: packages/kiwicaptcha-php
        run: composer install --no-interaction --prefer-dist
      - name: install Symfony bundle (risk-enabled controller benchmark)
        # perf-bench-risk.php drives the real ChallengeController with
        # the adaptive risk engine wired, so the bundle vendor must
        # exist (the kiwicaptcha-php/risk-php dependencies ride along).
        working-directory: packages/kiwicaptcha/integrations/symfony
        run: composer install --no-interaction --no-scripts --prefer-dist
      - name: hard byte budgets (widget-driver raw/gzip/brotli copies + challenge responses)
        run: bash packages/kiwicaptcha/tools/perf-budget.sh
      - name: client-performance release-baseline gate (CI mode)
        # The release-baseline validator enforces that every
        # release-required cell in tools/client-perf/release-budgets.json
        # (every released solver mode x qualified tier x cold/warm) has a
        # measured p95 under budget in the committed baseline, and prints
        # the current performance-qualification status. CI mode never
        # fails solely on the status: a lab-status gate is an honest
        # not-yet-certified signal. The release workflow re-runs the same
        # validator with --release, where a non-physical qualification
        # status is a hard failure (the release boundary is physical-device
        # data, per tools/client-perf/README.md).
        run: node tools/ci/validate-release-baseline.mjs tools/client-perf/results/baseline.json
      - name: synthetic-load benchmark (SHA-256 array, p50/p95, non-gating timing)
        continue-on-error: true
        run: php packages/kiwicaptcha/tools/perf-bench.php
      - name: real-Redis benchmark (SHA-256 through RedisStorage, p50/p95, non-gating timing)
        continue-on-error: true
        env:
          KC_REDIS_URL: redis://127.0.0.1:6399
        run: php packages/kiwicaptcha/tools/perf-bench.php --redis
      - name: Argon2id admission benchmark (64 MiB issuance + verification, p50/p95, non-gating timing)
        continue-on-error: true
        run: php packages/kiwicaptcha/tools/perf-bench.php --argon
      - name: risk-enabled controller benchmark (bundle issuance path, p50/p95, non-gating timing)
        continue-on-error: true
        run: php packages/kiwicaptcha/tools/perf-bench-risk.php
      - name: real-Redis concurrent risk benchmark (8 forked workers through the DSN-built client, p50/p95, non-gating timing)
        continue-on-error: true
        env:
          KC_REDIS_URL: redis://127.0.0.1:6399
        run: php packages/kiwicaptcha/tools/perf-bench-risk.php --redis
      - name: verified-WAIT round-trip fixture (waitReplicas 0 vs 1 on the single-node service, advisory timings)
        continue-on-error: true
        env:
          KC_REDIS_URL: redis://127.0.0.1:6399
        run: php packages/kiwicaptcha/tools/perf-wait.php
      - name: verified-WAIT primary+replica fixture (local master + replica, successful-ack timings and shortfall, advisory)
        # perf-wait-replica.php boots its own local master + replica on
        # free ports, so it needs redis-server/redis-cli on the runner;
        # when they are missing (or the gate Redis is unreachable) the
        # script prints a loud note and exits 0. Advisory like every
        # other timing step: the fixture has no ratchet.
        continue-on-error: true
        env:
          KC_REDIS_URL: redis://127.0.0.1:6399
        run: php packages/kiwicaptcha/tools/perf-wait-replica.php

  perf-latency-quiet:
    # Manually dispatched hard-ratchet benchmark on a GitHub-hosted
    # runner. The same timing benchmarks as the "Performance budgets"
    # job, but without continue-on-error, so a failure inside a manual
    # run is visible. This job is NOT a merge gate: it is skipped on
    # every push and pull_request, it is not a protected-main required
    # context, and the release workflow does not consult it. A shared
    # GitHub runner is too noisy to gate on, so the hard ratchets here
    # only certify a quiet, dedicated machine; until such a runner
    # exists, treat the 3x-p95 failures as signals, not blockers. Every
    # ratchet step sets KIWI_STRICT_BASELINE=1, so a missing
    # timing-baseline leaf fails the run: a hard-ratchet run with no
    # baseline is not a hard ratchet. The noisy CI timing steps in the
    # "Performance budgets" job never set the flag and keep the note
    # degradation. The byte budgets are not part of this job; they stay
    # gating in "Performance budgets" on every push.
    if: github.event_name == 'workflow_dispatch'
    name: Performance latency (manual hard-ratchet benchmark)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          php-version: '8.2'
          extensions: gmp, json, openssl, sodium
          coverage: none
      - name: install PHP core (the benchmarks issue real challenges)
        working-directory: packages/kiwicaptcha-php
        run: composer install --no-interaction --prefer-dist
      - name: install Symfony bundle (risk-enabled controller benchmark)
        working-directory: packages/kiwicaptcha/integrations/symfony
        run: composer install --no-interaction --no-scripts --prefer-dist
      - name: manual-benchmark Redis preflight (the hard-ratchet run requires a reachable Redis)
        env:
          KC_REDIS_URL: ${{ inputs.redis_url }}
        run: |
          # shellcheck disable=SC2016 # PHP variables inside single-quoted code
          php -r '
            require "packages/kiwicaptcha-php/vendor/autoload.php";
            $url = getenv("KC_REDIS_URL") ?: "redis://127.0.0.1:6399";
            $client = new Predis\Client($url, ["timeout" => 5.0, "read_write_timeout" => 5.0]);
            $client->ping();
            echo "manual-benchmark preflight: Redis answers at $url\n";
          '
      - name: synthetic-load benchmark (SHA-256 array, p50/p95, hard ratchet gate)
        env:
          KIWI_STRICT_BASELINE: '1'
        run: php packages/kiwicaptcha/tools/perf-bench.php
      - name: real-Redis benchmark (SHA-256 through RedisStorage, p50/p95, hard ratchet gate)
        env:
          KIWI_STRICT_BASELINE: '1'
          KC_REDIS_URL: ${{ inputs.redis_url }}
        run: php packages/kiwicaptcha/tools/perf-bench.php --redis
      - name: Argon2id admission benchmark (64 MiB issuance + verification, p50/p95, hard ratchet gate)
        env:
          KIWI_STRICT_BASELINE: '1'
        run: php packages/kiwicaptcha/tools/perf-bench.php --argon
      - name: risk-enabled controller benchmark (bundle issuance path, p50/p95, hard ratchet gate)
        env:
          KIWI_STRICT_BASELINE: '1'
        run: php packages/kiwicaptcha/tools/perf-bench-risk.php
      - name: real-Redis concurrent risk benchmark (8 forked workers through the DSN-built client, p50/p95, hard ratchet gate)
        env:
          KIWI_STRICT_BASELINE: '1'
          KC_REDIS_URL: ${{ inputs.redis_url }}
        run: php packages/kiwicaptcha/tools/perf-bench-risk.php --redis
      - name: verified-WAIT round-trip fixture (waitReplicas 0 vs 1, barrier invariants gate; timings advisory)
        env:
          KC_REDIS_URL: ${{ inputs.redis_url }}
        run: php packages/kiwicaptcha/tools/perf-wait.php
      - name: verified-WAIT primary+replica fixture (local master + replica, successful-ack timings and shortfall, advisory-only)
        # The replica fixture has no ratchet and spins its own local
        # topology, so it stays advisory even in the manual benchmark: it
        # notes loudly and exits 0 when redis-server/redis-cli are
        # missing, and its invariants gate only the barrier semantics.
        continue-on-error: true
        env:
          KC_REDIS_URL: ${{ inputs.redis_url }}
        run: php packages/kiwicaptcha/tools/perf-wait-replica.php

  cross-language:
    name: Cross-language (both directions)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73 # Redis 7.x.y (digest of the redis:7 tag as of 2026-08-05), digest-pinned
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: gmp, json, openssl, sodium
          coverage: none
      - name: composer install (PHP core)
        working-directory: packages/kiwicaptcha-php
        run: composer install --no-interaction --prefer-dist
      - name: PHP issues a SHA-256 challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_PHP_RECORD: /tmp/kc_php_record.json
          KC_PHP_ALGO: sha256
        run: php tests/CrossLanguageIssue.php
      - name: Rust verifies the PHP-issued SHA-256 challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_PHP_RECORD: /tmp/kc_php_record.json
        run: cargo test --test cross_language rust_verifies_php_issued_record -- --nocapture
      - name: PHP issues an Argon2id challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_PHP_RECORD: /tmp/kc_php_record_argon.json
          KC_PHP_ALGO: argon2id
        run: php tests/CrossLanguageIssue.php
      - name: Rust verifies the PHP-issued Argon2id challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_PHP_RECORD: /tmp/kc_php_record_argon.json
        run: cargo test --test cross_language rust_verifies_php_issued_record -- --nocapture
      - name: Rust issues a SHA-256 challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record.json
          KC_RUST_ALGO: sha256
        run: cargo test --test cross_language rust_issues_record_for_php -- --nocapture
      - name: PHP verifies the Rust-issued SHA-256 challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record.json
        run: php tests/CrossLanguageVerify.php
      - name: Rust issues an Argon2id challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record_argon.json
          KC_RUST_ALGO: argon2id
        run: cargo test --test cross_language rust_issues_record_for_php -- --nocapture
      - name: PHP verifies the Rust-issued Argon2id challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record_argon.json
        run: php tests/CrossLanguageVerify.php
      - name: PHP issues an rsw challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_PHP_RECORD: /tmp/kc_php_record_rsw.json
          KC_PHP_ALGO: rsw
        run: php tests/CrossLanguageIssue.php
      - name: Rust verifies the PHP-issued rsw challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_PHP_RSW_RECORD: /tmp/kc_php_record_rsw.json
        run: cargo test --test cross_language rust_verifies_php_issued_rsw_record -- --nocapture
      - name: Rust issues an rsw challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_RUST_RSW_RECORD: /tmp/kc_rust_record_rsw.json
        run: cargo test --test cross_language rust_issues_rsw_record_for_php -- --nocapture
      - name: PHP verifies the Rust-issued rsw challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record_rsw.json
        run: php tests/CrossLanguageVerify.php
      - name: Redis runtime-state interoperability (PHP/Rust consume, commit, recovery claims)
        working-directory: packages/kiwicaptcha
        env:
          KC_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --features redis --test cross_language redis_runtime_state_interop_with_php -- --nocapture
      - name: Protocol-v3 decoy interoperability (PHP/Rust armed issuance, v2-plus-decoy rejection)
        working-directory: packages/kiwicaptcha
        env:
          KC_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --features redis --test cross_language redis_v3_decoy_interop_with_php -- --nocapture
      - name: Protocol-v4 execution interoperability (PHP issues the real digest:trace token, Rust decodes and verifies through the production verifier)
        working-directory: packages/kiwicaptcha
        env:
          KC_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --features redis --test cross_language redis_v4_execution_interop_with_php -- --nocapture
      - name: RSW time-lock interoperability (PHP issues and solves into Redis, Rust verifies through the production verifier, and the reverse direction)
        working-directory: packages/kiwicaptcha
        env:
          KC_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --features redis --test cross_language redis_rsw_interop_with_php -- --nocapture
      - name: Rust issues the v4 execution record and serializes the digest:trace token (reverse direction)
        working-directory: packages/kiwicaptcha
        env:
          KC_REDIS_URL: redis://127.0.0.1:6379
          KC_RUST_RECORD: /tmp/kc_rust_record_v4.json
        run: cargo test --features redis --test cross_language rust_issues_v4_execution_record_for_php -- --nocapture
      - name: PHP verifies the Rust-issued v4 execution record (digest:trace recomputed from the stored program)
        working-directory: packages/kiwicaptcha-php
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record_v4.json
        run: php tests/CrossLanguageVerify.php
      - name: PHP rejects the tampered digest on the Rust-issued v4 execution record (deterministic rejection)
        working-directory: packages/kiwicaptcha-php
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record_v4.json
          KC_RUST_EXPECT_TAMPER: '1'
        run: php tests/CrossLanguageVerify.php
