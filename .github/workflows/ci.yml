name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test, wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: wasm32 build
        # kiwicaptcha-wasm is a STANDALONE crate (not a workspace member), so
        # the build runs from its own directory.
        working-directory: packages/kiwicaptcha-wasm
        run: cargo build --target wasm32-unknown-unknown
      - name: cargo audit (dependency/security)
        run: |
          cargo install cargo-audit --locked --quiet || true
          cargo audit

  php:
    name: PHP ${{ matrix.php }} core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: packages/kiwicaptcha-php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl, sodium
          coverage: none
      - name: composer validate
        run: composer validate --strict
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer audit (dependency/security)
        run: composer audit --locked
      - name: phpunit
        run: vendor/bin/phpunit

  symfony:
    name: Symfony bundle (container + KernelBrowser)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symfony: ['6.4', '7.x']
    defaults:
      run:
        working-directory: packages/kiwicaptcha/integrations/symfony
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer audit (dependency/security)
        run: composer audit --locked
      - name: pin Symfony 6.4
        if: matrix.symfony == '6.4'
        # `--with` (temporary constraints) is required: a wildcard
        # `composer update "symfony/*:6.4.*"` does NOT constrain anything.
        # The transitive packages (property-info, error-handler) are also
        # pinned — Symfony 6.4's validator loader is incompatible with the
        # 8.x line they would otherwise resolve to.
        run: composer update --no-interaction --with symfony/framework-bundle:6.4.* --with symfony/http-kernel:6.4.* --with symfony/http-foundation:6.4.* --with symfony/validator:6.4.* --with symfony/form:6.4.* --with symfony/config:6.4.* --with symfony/dependency-injection:6.4.* --with symfony/twig-bridge:6.4.* --with symfony/routing:6.4.* --with symfony/cache:6.4.* --with symfony/property-info:6.4.* --with symfony/error-handler:6.4.*
      - name: phpunit (container compilation + KernelBrowser + router)
        run: vendor/bin/phpunit

  redis:
    name: Real-Redis concurrency (GETDEL, leases, rate limits)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/kiwicaptcha/integrations/symfony
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: real-redis integration tests
        env:
          KC_REDIS_URL: tcp://127.0.0.1:6379
        run: vendor/bin/phpunit --filter RealRedis

  risk-rust:
    name: Risk Rust (fmt, clippy, test + Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/kiwicaptcha-risk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test (incl. real-Redis suite)
        env:
          RISK_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test

  risk-php:
    name: Risk PHP (phpunit + Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/kiwicaptcha-risk-php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: phpunit (incl. real-Redis suite)
        env:
          RISK_REDIS_URL: tcp://127.0.0.1:6379
        run: vendor/bin/phpunit

  risk-parity:
    name: Risk parity (Rust == PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: PHP fixture hash
        working-directory: packages/kiwicaptcha-risk-php
        run: |
          composer install --no-interaction --prefer-dist
          php tools/fixture_hash.php
      - name: Rust fixture hash
        working-directory: packages/kiwicaptcha-risk
        run: cargo run --example fixture_hash
      - name: assert identical hashes
        working-directory: packages/kiwicaptcha-risk
        run: |
          PHP_HASH=$(cd ../kiwicaptcha-risk-php && php tools/fixture_hash.php)
          RUST_HASH=$(cargo run --quiet --example fixture_hash)
          echo "php=$PHP_HASH rust=$RUST_HASH"
          test "$PHP_HASH" = "$RUST_HASH"

  browser:
    name: Browser solver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install PHP core (fixture server)
        working-directory: packages/kiwicaptcha-php
        run: composer install --no-interaction --prefer-dist
      - name: install Playwright
        working-directory: tests/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: run browser tests
        working-directory: tests/browser
        run: npx playwright test

  cross-language:
    name: Cross-language (both directions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: composer install (PHP core)
        working-directory: packages/kiwicaptcha-php
        run: composer install --no-interaction --prefer-dist
      - name: PHP issues a SHA-256 challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_PHP_RECORD: /tmp/kc_php_record.json
          KC_PHP_ALGO: sha256
        run: php tests/CrossLanguageIssue.php
      - name: Rust verifies the PHP-issued SHA-256 challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_PHP_RECORD: /tmp/kc_php_record.json
        run: cargo test --test cross_language rust_verifies_php_issued_record -- --nocapture
      - name: PHP issues an Argon2id challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_PHP_RECORD: /tmp/kc_php_record_argon.json
          KC_PHP_ALGO: argon2id
        run: php tests/CrossLanguageIssue.php
      - name: Rust verifies the PHP-issued Argon2id challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_PHP_RECORD: /tmp/kc_php_record_argon.json
        run: cargo test --test cross_language rust_verifies_php_issued_record -- --nocapture
      - name: Rust issues a SHA-256 challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record.json
          KC_RUST_ALGO: sha256
        run: cargo test --test cross_language rust_issues_record_for_php -- --nocapture
      - name: PHP verifies the Rust-issued SHA-256 challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record.json
        run: php tests/CrossLanguageVerify.php
      - name: Rust issues an Argon2id challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record_argon.json
          KC_RUST_ALGO: argon2id
        run: cargo test --test cross_language rust_issues_record_for_php -- --nocapture
      - name: PHP verifies the Rust-issued Argon2id challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record_argon.json
        run: php tests/CrossLanguageVerify.php
