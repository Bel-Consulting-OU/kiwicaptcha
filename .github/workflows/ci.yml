name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test, wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          # Audit round 16: the toolchain is pinned EXPLICITLY (the repo
          # rust-toolchain.toml also pins 1.96.0 — this makes the action
          # install it directly instead of resolving a rolling stable).
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: quick-start end-to-end
        # Audit round 16/17: the public quick-start is an executable
        # behavioral test (issue -> solve -> verify -> VerifyOutcome::Valid)
        # — cargo test --workspace only COMPILES examples; this step
        # EXECUTES the example's #[test] so a compilable-but-broken
        # quick-start can never ship again.
        run: cargo test -p kiwicaptcha --example quickstart
      - name: wasm32 build
        # kiwicaptcha-wasm is a STANDALONE crate (not a workspace member), so
        # the build runs from its own directory.
        working-directory: packages/kiwicaptcha-wasm
        run: cargo build --target wasm32-unknown-unknown
      - name: cargo audit (dependency/security)
        # Audit round 22: cargo-audit is pinned to an exact tested version
        # and the install FAILS (no `|| true` silently falling back to an
        # older pre-existing binary) — a security gate must be
        # deterministic.
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  quick-start:
    # Audit round 22: the public quick-start is an executable behavioral
    # test (issue -> solve -> verify -> VerifyOutcome::Valid) and is now a
    # STANDALONE job — the protected-main ruleset requires it as an
    # independent status context (the previous step-inside-the-Rust-job
    # form never emitted a check run, so PRs could wait forever on the
    # phantom "quick-start end-to-end" context).
    name: quick-start end-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
      - name: quick-start end-to-end
        run: cargo test -p kiwicaptcha --example quickstart

  workflow-lint:
    # Audit round 22 (P1): a malformed workflow (duplicate `on:`) broke the
    # release pipeline while ordinary CI stayed green. CI now lints its own
    # configuration — actionlint (pinned Docker tag) validates every
    # workflow on every push, and this job is a required status check on
    # main, so a config regression fails CI instead of silently disabling
    # the release system.
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: docker://rhysd/actionlint:v1.7.7
        with:
          args: -color

  php:
    name: PHP ${{ matrix.php }} core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: packages/kiwicaptcha-php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl, sodium
          coverage: none
      - name: composer validate
        run: composer validate --strict
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer audit (dependency/security)
        # Audit round 19: packagist's security-advisories API is
        # occasionally flaky (502s/timeouts). The audit retries with
        # backoff and only then fails closed — a transient packagist
        # outage must not block unrelated CI (or the release gate), while
        # a genuinely failing audit still blocks.
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if composer audit --locked; then
              exit 0
            fi
            echo "composer audit attempt $i failed — retrying in 30s" >&2
            sleep 30
          done
          echo "composer audit failed after 5 attempts (packagist unreachable or real advisories)" >&2
          exit 1
      - name: phpunit
        run: vendor/bin/phpunit

  symfony:
    name: Symfony bundle (container + KernelBrowser)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symfony: ['6.4', '7.x']
    defaults:
      run:
        working-directory: packages/kiwicaptcha/integrations/symfony
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer audit (dependency/security)
        # Retry wrapper (audit round 19): packagist's advisories API is
        # occasionally flaky; fail closed only after 5 attempts.
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if composer audit --locked; then
              exit 0
            fi
            echo "composer audit attempt $i failed — retrying in 30s" >&2
            sleep 30
          done
          echo "composer audit failed after 5 attempts (packagist unreachable or real advisories)" >&2
          exit 1
      - name: pin Symfony 6.4
        if: matrix.symfony == '6.4'
        # `--with` (temporary constraints) is required: a wildcard
        # `composer update "symfony/*:6.4.*"` does NOT constrain anything.
        # The transitive packages (property-info, error-handler) are also
        # pinned — Symfony 6.4's validator loader is incompatible with the
        # 8.x line they would otherwise resolve to.
        run: composer update --no-interaction --with symfony/framework-bundle:6.4.* --with symfony/http-kernel:6.4.* --with symfony/http-foundation:6.4.* --with symfony/validator:6.4.* --with symfony/form:6.4.* --with symfony/config:6.4.* --with symfony/dependency-injection:6.4.* --with symfony/twig-bridge:6.4.* --with symfony/routing:6.4.* --with symfony/cache:6.4.* --with symfony/property-info:6.4.* --with symfony/error-handler:6.4.*
      - name: phpunit (container compilation + KernelBrowser + router)
        run: vendor/bin/phpunit

  redis:
    name: Real-Redis concurrency (consumed transitions, leases, rate limits)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/kiwicaptcha/integrations/symfony
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: real-redis integration tests
        env:
          KC_REDIS_URL: tcp://127.0.0.1:6379
        run: vendor/bin/phpunit --filter RealRedis

  risk-rust:
    name: Risk Rust (fmt, clippy, test + Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/kiwicaptcha-risk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned (audit round 16) — matches rust-toolchain.toml
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test (incl. real-Redis suite)
        env:
          RISK_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test

  risk-php:
    name: Risk PHP (phpunit + Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/kiwicaptcha-risk-php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: phpunit (incl. real-Redis suite)
        env:
          RISK_REDIS_URL: tcp://127.0.0.1:6379
        run: vendor/bin/phpunit

  risk-parity:
    name: Risk parity (Rust == PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned (audit round 16) — matches rust-toolchain.toml
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: PHP fixture hash
        working-directory: packages/kiwicaptcha-risk-php
        run: |
          composer install --no-interaction --prefer-dist
          php tools/fixture_hash.php
      - name: Rust fixture hash
        working-directory: packages/kiwicaptcha-risk
        run: cargo run --example fixture_hash
      - name: assert identical hashes
        working-directory: packages/kiwicaptcha-risk
        run: |
          PHP_HASH=$(cd ../kiwicaptcha-risk-php && php tools/fixture_hash.php)
          RUST_HASH=$(cargo run --quiet --example fixture_hash)
          echo "php=$PHP_HASH rust=$RUST_HASH"
          test "$PHP_HASH" = "$RUST_HASH"

  browser:
    name: Browser solver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: '22'
      - name: install PHP core (fixture server)
        working-directory: packages/kiwicaptcha-php
        run: composer install --no-interaction --prefer-dist
      - name: install Playwright
        working-directory: tests/browser
        run: |
          # Audit round 16: npm ci installs EXACTLY the committed
          # package-lock.json (reproducible browser-suite deps).
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: run browser tests
        working-directory: tests/browser
        run: npx playwright test

  package-cargo:
    name: Package (cargo publish readiness)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned (audit round 16) — matches rust-toolchain.toml
      - name: cargo package (risk crate)
        working-directory: packages/kiwicaptcha-risk
        run: |
          cargo package --list | grep -q 'resources/risk-v1.lua' || { echo 'resources/risk-v1.lua missing from the .crate'; exit 1; }
      - name: standalone build outside the monorepo (no include_str escape)
        run: |
          set -euo pipefail
          rm -rf /tmp/crate-check
          mkdir -p /tmp/crate-check
          cp -r packages/kiwicaptcha-risk /tmp/crate-check/
          cd /tmp/crate-check/kiwicaptcha-risk
          rm -rf target
          # Point the versioned dependency at the local core (as crates.io
          # resolution would once kiwicaptcha 1.1.0 is published). The
          # include_str!("../resources/risk-v1.lua") must resolve here.
          sed -i 's|path = "../kiwicaptcha"|path = "'"$GITHUB_WORKSPACE"'/packages/kiwicaptcha"|' Cargo.toml
          cargo check
      - name: quick-start end-to-end
        # Audit round 17: the example's #[test] is also executed in the
        # package-readiness job (the artifact a publisher ships must pass
        # the documented flow).
        working-directory: packages/kiwicaptcha
        run: cargo test -p kiwicaptcha --example quickstart
      - name: cargo package (core crate, REAL verification)
        # Audit round 18: `cargo package --locked` runs Cargo's full
        # verification build of the PACKAGED representation (tarball ->
        # unpack -> compile), not just `--no-verify` list checks. The core
        # crate's dependencies are all registry crates, so verification is
        # genuine. (The risk crate keeps --no-verify until kiwicaptcha
        # 1.1.0 is on the registry — its path+version dependency cannot be
        # verified from the tarball alone.)
        working-directory: packages/kiwicaptcha
        run: cargo package --locked

  package-composer:
    name: Package (composer clean-room install)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: clean-room install outside the monorepo
        run: |
          set -euo pipefail
          mkdir -p /tmp/composer-clean/packages
          cp -r packages/kiwicaptcha-php /tmp/composer-clean/packages/
          cp -r packages/kiwicaptcha-risk-php /tmp/composer-clean/packages/
          rm -rf /tmp/composer-clean/packages/*/vendor /tmp/composer-clean/packages/*/composer.lock
          cd /tmp/composer-clean
          composer init --no-interaction --name=ci/smoke
          composer config repositories.php '{"type": "path", "url": "/tmp/composer-clean/packages/kiwicaptcha-php", "options": {"versions": {"kiwicaptcha/kiwicaptcha-php": "1.0.0"}}}'
          composer config repositories.risk '{"type": "path", "url": "/tmp/composer-clean/packages/kiwicaptcha-risk-php", "options": {"versions": {"kiwicaptcha/kiwicaptcha-risk-php": "0.1.0"}}}'
          composer require kiwicaptcha/kiwicaptcha-php kiwicaptcha/kiwicaptcha-risk-php --no-interaction --prefer-dist
          test -f vendor/kiwicaptcha/kiwicaptcha-risk-php/resources/risk-v1.lua \
            || { echo 'risk-v1.lua not shipped in the published package'; exit 1; }
          # Smoke: the store constructor resolves the bundled Lua without
          # the monorepo (no Redis needed — Predis connects lazily).
          # shellcheck disable=SC2016 # PHP variable inside single-quoted code
          php -r 'require "vendor/autoload.php"; $s = new KiwiCaptcha\Risk\Storage\RedisRiskStateStore(new Predis\Client(), "smoke"); echo "OK\n";'

  lua-parity:
    name: Package (canonical Lua byte parity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: every canonical Lua file exists in all three locations and is byte-identical
        # Audit round 14: the previous job hashed the non-existent
        # protocol/risk-v1/risk.lua (the canonical file is risk-v1.lua) —
        # the empty pipeline collapsed to a single unique hash and the job
        # went green while proving nothing. Explicit existence + cmp per
        # file fails unambiguously on any drift.
        run: |
          set -euo pipefail
          for f in risk-v1.lua calibration.lua confirm.lua correction.lua \
                    outcome_confirm.lua outcome_correct.lua outcome_register.lua \
                    register_decision.lua sampling_metrics.lua; do
            test -f "protocol/risk-v1/$f" || { echo "missing protocol/risk-v1/$f"; exit 1; }
            test -f "packages/kiwicaptcha-risk/resources/$f" || { echo "missing packages/kiwicaptcha-risk/resources/$f"; exit 1; }
            test -f "packages/kiwicaptcha-risk-php/resources/$f" || { echo "missing packages/kiwicaptcha-risk-php/resources/$f"; exit 1; }
            cmp -s "protocol/risk-v1/$f" "packages/kiwicaptcha-risk/resources/$f" \
              || { echo "mismatch: $f (protocol vs rust)"; exit 1; }
            cmp -s "protocol/risk-v1/$f" "packages/kiwicaptcha-risk-php/resources/$f" \
              || { echo "mismatch: $f (protocol vs php)"; exit 1; }
          done
          echo "all 9 canonical Lua copies byte-identical"

  rust-redis-verify:
    name: Rust core Redis verifier (redis feature)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/kiwicaptcha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned (audit round 16) — matches rust-toolchain.toml
      - name: redis_verify integration tests (real Redis)
        # Audit round 14: the production RedisChallengeStore + verifier are
        # feature-gated behind `redis` — the default-feature build never
        # compiled or ran them. This job exercises them against a real
        # Redis (consumed-state transitions, leases, replica-wait barriers,
        # concurrency) on every push.
        env:
          RISK_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test --features redis --test redis_verify

  build-reproducibility:
    # Audit round 18 wording: two fully clean build-tree/cache runs in ONE
    # controlled runner (same Rust env + registry). Truly independent
    # environments would require separate containers + a comparing job —
    # tracked as a future refinement.
    name: Build reproducibility (two clean strict builds, one runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/kiwicaptcha-wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned (audit round 16) — matches rust-toolchain.toml
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: first clean strict build
        # Audit round 16: reproducibility is DEMONSTRATED, not inferred from
        # version pins — two fully clean strict builds (fresh target dir,
        # fresh pkg dir, fresh wasm-opt download) must produce identical
        # asset hashes.
        env:
          WASM_OPT_STRICT: "1"
        run: |
          bash build.sh
          shasum -a 256 assets/kiwicaptcha-wasm.js assets/kiwi-worker.js \
                 assets/widget-driver.js assets/widget.css > /tmp/build1.sha256
      - name: second clean strict build (fresh cache + target)
        env:
          WASM_OPT_STRICT: "1"
        run: |
          cargo clean
          rm -rf pkg
          rm -rf "$HOME/.cache/kiwicaptcha-wasm"
          bash build.sh
          shasum -a 256 assets/kiwicaptcha-wasm.js assets/kiwi-worker.js \
                 assets/widget-driver.js assets/widget.css > /tmp/build2.sha256
      - name: byte-compare the two builds
        run: |
          diff /tmp/build1.sha256 /tmp/build2.sha256
          echo "two clean isolated strict builds produce identical asset hashes"

  symfony-assets:
    name: Symfony widget assets (byte parity)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned (audit round 16) — matches rust-toolchain.toml
      - name: core crate resources must be byte-identical to the canonical assets
        # Audit round 18: the core crate embeds the assets from its own
        # resources/ directory (cargo package verification cannot reach
        # outside the crate) — the copies are regenerated by build.sh and
        # must never drift from the canonical wasm assets.
        run: |
          set -euo pipefail
          for f in widget-driver.js widget.css kiwicaptcha-wasm.js; do
            cmp -s "packages/kiwicaptcha-wasm/assets/$f" \
              "packages/kiwicaptcha/resources/$f" \
              || { echo "stale $f in packages/kiwicaptcha/resources — run packages/kiwicaptcha-wasm/build.sh"; exit 1; }
          done
          echo "core crate resources byte-identical to the canonical assets"
      - name: bundle copies must be byte-identical to the canonical assets
        # Audit round 14 (P0): the Symfony bundle shipped a stale 17 KB
        # driver (document-level listeners, telemetry, main-thread Argon
        # CHUNK=16) while the canonical driver was the hardened worker-based
        # build. A generated duplicate must be mechanically impossible to
        # merge while stale — bin/sync-assets.sh is the ONLY way, enforced
        # here with cmp on every push.
        run: |
          set -euo pipefail
          for f in widget-driver.js kiwicaptcha-wasm.js widget.css; do
            cmp -s "packages/kiwicaptcha-wasm/assets/$f" \
              "packages/kiwicaptcha/integrations/symfony/Resources/public/$f" \
              || { echo "stale $f in the Symfony bundle — run bin/sync-assets.sh"; exit 1; }
          done
          echo "Symfony widget assets byte-identical to the canonical build"
      - name: worker source is generated into the driver (no manual drift)
        # Audit round 15: assets/kiwi-worker.js is the source of truth; the
        # driver's embedded KIWI_WORKER_SRC literal is machine-generated by
        # the kiwicaptcha-embed-worker Rust tool (run by build.sh) — a
        # hand-edited embedded copy fails here.
        run: |
          cargo run --locked --manifest-path packages/kiwicaptcha-wasm/tools/embed-worker/Cargo.toml -- --check


  cross-language:
    name: Cross-language (both directions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch HEAD (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned (audit round 16) — matches rust-toolchain.toml
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: json, openssl, sodium
          coverage: none
      - name: composer install (PHP core)
        working-directory: packages/kiwicaptcha-php
        run: composer install --no-interaction --prefer-dist
      - name: PHP issues a SHA-256 challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_PHP_RECORD: /tmp/kc_php_record.json
          KC_PHP_ALGO: sha256
        run: php tests/CrossLanguageIssue.php
      - name: Rust verifies the PHP-issued SHA-256 challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_PHP_RECORD: /tmp/kc_php_record.json
        run: cargo test --test cross_language rust_verifies_php_issued_record -- --nocapture
      - name: PHP issues an Argon2id challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_PHP_RECORD: /tmp/kc_php_record_argon.json
          KC_PHP_ALGO: argon2id
        run: php tests/CrossLanguageIssue.php
      - name: Rust verifies the PHP-issued Argon2id challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_PHP_RECORD: /tmp/kc_php_record_argon.json
        run: cargo test --test cross_language rust_verifies_php_issued_record -- --nocapture
      - name: Rust issues a SHA-256 challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record.json
          KC_RUST_ALGO: sha256
        run: cargo test --test cross_language rust_issues_record_for_php -- --nocapture
      - name: PHP verifies the Rust-issued SHA-256 challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record.json
        run: php tests/CrossLanguageVerify.php
      - name: Rust issues an Argon2id challenge
        working-directory: packages/kiwicaptcha
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record_argon.json
          KC_RUST_ALGO: argon2id
        run: cargo test --test cross_language rust_issues_record_for_php -- --nocapture
      - name: PHP verifies the Rust-issued Argon2id challenge
        working-directory: packages/kiwicaptcha-php
        env:
          KC_RUST_RECORD: /tmp/kc_rust_record_argon.json
        run: php tests/CrossLanguageVerify.php
