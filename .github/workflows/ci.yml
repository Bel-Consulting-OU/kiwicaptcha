name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      redis_url:
        description: Redis URL the manual hard-ratchet benchmark runs against (defaults to the local instance)
        required: false
        default: redis://127.0.0.1:6399

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test, wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          # The toolchain is pinned explicitly: the repo
          # rust-toolchain.toml also pins 1.96.0, which makes the action
          # install it directly instead of resolving a rolling stable.
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: quick-start end-to-end
        # The public quick-start is an executable behavioral test
        # (issue -> solve -> verify -> VerifyOutcome::Valid): cargo test
        # --workspace only compiles examples; this step runs the
        # example's #[test], so a broken quick-start can never ship.
        run: cargo test -p kiwicaptcha --example quickstart
      - name: wasm32 build
        # kiwicaptcha-wasm is a standalone crate (not a workspace member), so
        # the build runs from its own directory.
        working-directory: packages/kiwicaptcha-wasm
        run: cargo build --target wasm32-unknown-unknown
      - name: cargo audit (dependency/security)
        # cargo-audit is pinned to an exact tested version and the install
        # fails closed (no `|| true` falling back to a pre-existing
        # binary) — a security gate must be deterministic.
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  quick-start:
    # The public quick-start is an executable behavioral test
    # (issue -> solve -> verify -> VerifyOutcome::Valid) and is a
    # standalone job: the protected-main ruleset requires it as an
    # independent status context — a step inside the Rust job never emits
    # a check run, so PRs could wait forever on a phantom
    # "quick-start end-to-end" context.
    name: quick-start end-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # @stable branch head (rolling, 2026-08-05)
        with:
          toolchain: 1.96.0 # pinned — matches rust-toolchain.toml
      - name: quick-start end-to-end
        run: cargo test -p kiwicaptcha --example quickstart

  workflow-lint:
    # A malformed workflow (duplicate `on:`) can break the release
    # pipeline while ordinary CI stays green. CI lints its own
    # configuration: actionlint (pinned Docker tag) validates every
    # workflow on every push, and this job is a required status check on
    # main, so a config regression fails CI instead of silently disabling
    # the release system.
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # actionlint 1.7.12, digest-pinned
        with:
          args: -color

  php:
    name: PHP ${{ matrix.php }} core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: packages/kiwicaptcha-php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, json, openssl, sodium
          coverage: none
      - name: composer validate
        run: composer validate --strict
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer PSR-4 layout check
        run: bash ../kiwicaptcha/tools/check-psr4.sh

      - name: composer audit (dependency/security)
        # Packagist's security-advisories API is occasionally flaky
        # (502s/timeouts). The audit retries with backoff and only then
        # fails closed — a transient packagist outage must not block
        # unrelated CI (or the release gate), while a genuinely failing
        # audit still blocks.
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if composer audit --locked; then
              exit 0
            fi
            echo "composer audit attempt $i failed — retrying in 30s" >&2
            sleep 30
          done
          echo "composer audit failed after 5 attempts (packagist unreachable or real advisories)" >&2
          exit 1
      - name: phpunit
        run: vendor/bin/phpunit

  php-nightly:
    # Non-gating forward-compatibility probe on the PHP 8.6 development
    # line: setup-php v2.37.2 maps `nightly` to 8.6, the current
    # pre-release branch (no stable 8.6 entry exists in its version
    # map yet; switch the pin to '8.6' when the first stable release
    # lands). Deliberately NOT in the protected-main required-check
    # set, mirroring the Redis 8 compatibility lane: a nightly core may
    # change behavior before 8.6 stabilizes, and this lane surfaces
    # that drift as a visible warning instead of blocking the release
    # gate. The stable 8.5 lane above is the gating evidence; this lane
    # is aspirational.
    name: PHP 8.6 nightly core (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/kiwicaptcha-php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          php-version: 'nightly'
          extensions: gmp, json, openssl, sodium
          coverage: none
      - name: composer validate
        run: composer validate --strict
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer PSR-4 layout check
        run: bash ../kiwicaptcha/tools/check-psr4.sh
      - name: phpunit
        run: vendor/bin/phpunit

  php-matrix:
    # Stable aggregator over the PHP core version matrix (8.1..8.5): the
    # protected-main ruleset requires ONE stable context ("PHP core
    # supported-matrix") instead of the per-version cells, so a future
    # matrix expansion cannot silently change the externally visible
    # required-check names. The gate reads the matrix aggregate result,
    # which GitHub computes from the per-cell results with the worst
    # first ordering: failure, then cancelled, then skipped, then
    # success. The whitelist below accepts exactly `success`: anything
    # else — a failed cell, a cancelled cell or a skipped cell — exits
    # 1. A lane that is legitimately non-applicable must itself execute
    # a deterministic no-op/pass rather than being skipped (nothing in
    # this workflow is path-filtered today, so no lane is ever skipped;
    # a future path filter must keep that contract). The job runs even
    # when a cell failed, via the `if: always()`. The 8.6 nightly lane
    # is deliberately NOT in `needs`: it is non-gating by design and
    # must stay outside the required evidence.
    name: PHP core supported-matrix
    needs: [php]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: every required PHP core cell succeeded
        run: |
          set -euo pipefail
          case '${{ needs.php.result }}' in
            success)
              echo "PHP core supported-matrix OK: every required cell succeeded"
              ;;
            skipped)
              echo "::error::PHP core supported-matrix: a required cell was skipped — a lane that is non-applicable must execute a deterministic no-op/pass, never skip"
              exit 1
              ;;
            *)
              echo "::error::PHP core supported-matrix: a required matrix cell failed or was cancelled"
              exit 1
              ;;
          esac

  php-no-gmp:
    # The GMP optionality proof: this lane installs PHP without ext-gmp
    # (the distro php-cli carries openssl and sodium as built-ins; the
    # Ubuntu 24.04 distro ships no separate php-openssl or php-sodium
    # packages), proves the premise with a dedicated step, and then
    # runs tools/ci/no-gmp-verify.php, which exercises the whole
    # non-RSW surface through the public API (sha256 issue+verify,
    # argon2id issue+verify, execution issue+verify at the live grammar
    # maximum) and asserts an rsw configuration refuses cleanly with
    # the documented missing-extension error. The script prints one
    # pass line per check and exits non-zero on any failure.
    name: PHP core no-GMP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kiwicaptcha-php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: install the distro php without ext-gmp
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq
          php-cli
          php-mbstring
          php-xml
          php-zip
          php-curl
          php-bcmath
          composer
      - name: prove required built-ins are loaded and ext-gmp is absent
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # PHP variables inside single-quoted code
          php -r '
            foreach (["openssl", "sodium"] as $extension) {
                if (!extension_loaded($extension)) {
                    fwrite(STDERR, "$extension missing\n");
                    exit(1);
                }
            }
          '
          # shellcheck disable=SC2016 # PHP variables inside single-quoted code
          php -r 'exit(extension_loaded("gmp") ? 1 : 0);'
      - name: composer validate
        run: composer validate --strict
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer PSR-4 layout check
        run: bash ../kiwicaptcha/tools/check-psr4.sh
      - name: no-GMP surface proof
        run: php ../../tools/ci/no-gmp-verify.php

  symfony:
    name: Symfony bundle (container + KernelBrowser)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicit PHP pairs per Symfony line: each lane runs the
          # PHP the line is tested against upstream. 8.5 pairs with
          # the 8.x line only, mirroring the previous 8.4 pairing:
          # the 6.4 lane stays on its supported line (Symfony 6.4 is
          # tested through PHP 8.4), and the 7.x lane keeps the
          # original 8.2 pairing.
          - symfony: '6.4'
            php: '8.2'
          - symfony: '7.x'
            php: '8.2'
          - symfony: '8.x'
            php: '8.4'
          - symfony: '8.x'
            php: '8.5'
    defaults:
      run:
        working-directory: packages/kiwicaptcha/integrations/symfony
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: ${{ matrix.php }}
          extensions: gmp, json, openssl, sodium
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: composer audit (dependency/security)
        # Retry wrapper: packagist's advisories API is
        # occasionally flaky; fail closed only after 5 attempts.
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if composer audit --locked; then
              exit 0
            fi
            echo "composer audit attempt $i failed — retrying in 30s" >&2
            sleep 30
          done
          echo "composer audit failed after 5 attempts (packagist unreachable or real advisories)" >&2
          exit 1
      - name: pin Symfony 8.x
        # Only the five declared packages are pinned: --with requires the
        # temporary constraint to be a subset of composer.json, and the
        # transitive packages (config, dependency-injection, twig-bridge,
        # routing, cache, property-info, error-handler) resolve to the
        # correct 8.1 line automatically when the direct deps are pinned
        # (unlike the 6.4 lane, whose older validator forces explicit
        # transitive pins to prevent 8.x transitive drift).
        if: matrix.symfony == '8.x'
        run: composer update --no-interaction --with symfony/framework-bundle:8.1.* --with symfony/http-kernel:8.1.* --with symfony/http-foundation:8.1.* --with symfony/validator:8.1.* --with symfony/form:8.1.*
      - name: pin Symfony 6.4
        if: matrix.symfony == '6.4'
        # `--with` (temporary constraints) is required: a wildcard
        # `composer update "symfony/*:6.4.*"` does NOT constrain anything.
        # The transitive packages (property-info, error-handler) are also
        # pinned — Symfony 6.4's validator loader is incompatible with the
        # 8.x line they would otherwise resolve to.
        run: composer update --no-interaction --with symfony/framework-bundle:6.4.* --with symfony/http-kernel:6.4.* --with symfony/http-foundation:6.4.* --with symfony/validator:6.4.* --with symfony/form:6.4.* --with symfony/config:6.4.* --with symfony/dependency-injection:6.4.* --with symfony/twig-bridge:6.4.* --with symfony/routing:6.4.* --with symfony/cache:6.4.* --with symfony/property-info:6.4.* --with symfony/error-handler:6.4.*
      - name: phpunit (container compilation + KernelBrowser + router)
        run: vendor/bin/phpunit

  symfony-matrix:
    # Stable aggregator over the Symfony bundle matrix (6.4/8.2,
    # 7.x/8.2, 8.x/8.4, 8.x/8.5): the protected-main ruleset requires
    # ONE stable context ("Symfony supported-matrix") instead of the
    # per-cell names, so a future matrix expansion cannot silently
    # change the externally visible required-check names. The gate
    # reads the matrix aggregate result, which GitHub computes from the
    # per-cell results with the worst first ordering: failure, then
    # cancelled, then skipped, then success. The whitelist below
    # accepts exactly `success`: anything else — a failed cell, a
    # cancelled cell or a skipped cell — exits 1. A lane that is
    # legitimately non-applicable must itself execute a deterministic
    # no-op/pass rather than being skipped (nothing in this workflow is
    # path-filtered today, so no lane is ever skipped; a future path
    # filter must keep that contract). The job runs even when a cell
    # failed, via the `if: always()`.
    name: Symfony supported-matrix
    needs: [symfony]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: every required Symfony matrix cell succeeded
        run: |
          set -euo pipefail
          case '${{ needs.symfony.result }}' in
            success)
              echo "Symfony supported-matrix OK: every required cell succeeded"
              ;;
            skipped)
              echo "::error::Symfony supported-matrix: a required cell was skipped — a lane that is non-applicable must execute a deterministic no-op/pass, never skip"
              exit 1
              ;;
            *)
              echo "::error::Symfony supported-matrix: a required matrix cell failed or was cancelled"
              exit 1
              ;;
          esac

  redis:
    name: Real-Redis concurrency (consumed transitions, leases, rate limits)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73 # Redis 7.x.y (digest of the redis:7 tag as of 2026-08-05), digest-pinned
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/kiwicaptcha/integrations/symfony
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.2'
          extensions: gmp, json, openssl, sodium
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: real-redis integration tests
        # The lane owns the bundle real-Redis suites AND the protocol-v3
        # upgrade walk (the walk class name does not match the RealRedis
        # filter); KIWI_REQUIRE_REAL_REDIS_TESTS=1 makes the walk fail
        # instead of skip when the Redis env is lost.
        env:
          KC_REDIS_URL: tcp://127.0.0.1:6379
          TEST_REDIS_URL: tcp://127.0.0.1:6379
          KIWI_REQUIRE_REAL_REDIS_TESTS: '1'
        run: vendor/bin/phpunit --filter "RealRedis|ProtocolV3UpgradeTimelineWalkTest"

  docker-reference-deployment:
    # The deploy/ reference image must build and run as the audit
    # demands. This lane builds the image, boots the compose stack
    # (Valkey + captcha) and walks the full sequence against the real
    # storage. The sequence: /healthz until 200, POST /challenge, a
    # SHA-256 solve inside the container, POST /verify success and the
    # replay rejection of the same token. Then a captcha restart,
    # /healthz again and a second issue/solve/verify against the
    # persistent Valkey volume. The secret is a fresh random value
    # written to deploy/.env in the lane (gitignored), so the repo
    # test credentials are never touched.
    name: Docker reference deployment e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - name: docker build the deploy image
        run: docker build -f deploy/Dockerfile -t kiwicaptcha/reference-deployment .
      - name: write a fresh random secret to deploy/.env
        working-directory: deploy
        run: |
          set -euo pipefail
          umask 077
          printf 'KIWI_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" > .env
          printf 'KIWI_SHA_TARGET_BITS=8\n' >> .env
      - name: docker compose up (valkey + captcha)
        working-directory: deploy
        run: docker compose up -d
      - name: retry /healthz until 200
        working-directory: deploy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then
              echo "healthz answered 200 on attempt $attempt"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs captcha
          echo "healthz never answered 200 within 120s" >&2
          exit 1
      - name: POST /challenge and capture the challenge document
        working-directory: deploy
        run: |
          set -euo pipefail
          curl -fsS -o /tmp/challenge.json -X POST -H 'Content-Type: application/json' \
            -d '{"scope":"login"}' http://127.0.0.1:8080/challenge
      - name: solve the SHA-256 proof inside the captcha container
        working-directory: deploy
        run: |
          set -euo pipefail
          docker compose cp /tmp/challenge.json captcha:/tmp/challenge.json
          docker compose exec -T captcha php /srv/kiwicaptcha/deploy/app/solve.php /tmp/challenge.json > /tmp/token.txt
          test -s /tmp/token.txt
          printf '%s' "$(tr -d '\r\n' < /tmp/token.txt)" > /tmp/token-clean.txt
      - name: POST /verify with the solved token (success)
        working-directory: deploy
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/token-clean.txt)"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"token\":\"$TOKEN\",\"scope\":\"login\"}" \
            http://127.0.0.1:8080/verify | tee /tmp/verify1.json
          php -r 'exit(json_decode(file_get_contents("/tmp/verify1.json"), true)["ok"] === true ? 0 : 1);'
      - name: POST the same /verify again (replay rejection)
        working-directory: deploy
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/token-clean.txt)"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"token\":\"$TOKEN\",\"scope\":\"login\"}" \
            http://127.0.0.1:8080/verify | tee /tmp/replay.json
          # shellcheck disable=SC2016 # PHP variables inside single-quoted code
          php -r '$d = json_decode(file_get_contents("/tmp/replay.json"), true); exit($d["ok"] === false && $d["code"] === "already_consumed" ? 0 : 1);'
      - name: F1 algorithm-ownership table (sha256 profile rows)
        working-directory: deploy
        run: |
          set -euo pipefail
          challenge_row() {  # $1 = request body; asserts a 200 challenge
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "$1" http://127.0.0.1:8080/challenge > /tmp/f1-challenge.json
          }
          challenge_row '{"scope":"login"}'
          grep -q '"algorithm":"sha256"' /tmp/f1-challenge.json
          challenge_row '{"scope":"login","algorithm":"sha256"}'
          grep -q '"algorithm":"sha256"' /tmp/f1-challenge.json
          # The field stays accepted but only validated: a nonsense value
          # is refused with a 422 before any issuance.
          STATUS="$(curl -sS -o /tmp/f1-invalid.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"scope":"login","algorithm":"nonsense"}' \
            http://127.0.0.1:8080/challenge)"
          test "$STATUS" = "422"
          grep -q '"code":"INVALID_ALGORITHM"' /tmp/f1-invalid.json
      - name: F1 algorithm-ownership table (argon2id profile rows)
        working-directory: deploy
        run: |
          set -euo pipefail
          SECRET="$(sed -n 's/^KIWI_SECRET_KEY=//p' .env | head -1)"
          test -n "$SECRET"
          {
            printf 'KIWI_SECRET_KEY=%s\n' "$SECRET"
            printf 'KIWI_SHA_TARGET_BITS=8\n'
            printf 'KIWI_ALGORITHM=argon2id\n'
          } > .env
          docker compose up -d --force-recreate captcha
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then
              echo "healthz answered 200 on attempt $attempt under the argon2id profile"
              break
            fi
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = "200"
          for body in '{"scope":"login"}' '{"scope":"login","algorithm":"argon2id"}' \
            '{"scope":"login","algorithm":"sha256"}'; do
            curl -fsS -X POST -H 'Content-Type: application/json' -d "$body" \
              http://127.0.0.1:8080/challenge > /tmp/f1-challenge.json
            grep -q '"algorithm":"argon2id"' /tmp/f1-challenge.json
          done
      - name: F1 algorithm-ownership table (rsw profile rows)
        working-directory: deploy
        run: |
          set -euo pipefail
          SECRET="$(sed -n 's/^KIWI_SECRET_KEY=//p' .env | head -1)"
          test -n "$SECRET"
          # The committed rsw fixture pair (packages/kiwicaptcha-php
          # tests/Support/RswFixture.php) supplies the trapdoor values
          # for the CI-only profile rows; the container's php reads them.
          docker compose cp ../packages/kiwicaptcha-php/tests/Support/RswFixture.php \
            captcha:/tmp/RswFixture.php
          MODULUS_N="$(docker compose exec -T captcha php -r \
            'require "/tmp/RswFixture.php"; echo \KiwiCaptcha\Tests\Support\RswFixture::MODULUS_N_B64;')"
          LAMBDA="$(docker compose exec -T captcha php -r \
            'require "/tmp/RswFixture.php"; echo \KiwiCaptcha\Tests\Support\RswFixture::LAMBDA_B64;')"
          test -n "$MODULUS_N"
          test -n "$LAMBDA"
          {
            printf 'KIWI_SECRET_KEY=%s\n' "$SECRET"
            printf 'KIWI_SHA_TARGET_BITS=8\n'
            printf 'KIWI_ALGORITHM=rsw\n'
            printf 'KIWI_RSW_MODULUS_N=%s\n' "$MODULUS_N"
            printf 'KIWI_RSW_LAMBDA=%s\n' "$LAMBDA"
          } > .env
          docker compose up -d --force-recreate captcha
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then
              echo "healthz answered 200 on attempt $attempt under the rsw profile"
              break
            fi
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = "200"
          for body in '{"scope":"login","algorithm":"sha256"}' \
            '{"scope":"login","algorithm":"argon2id"}'; do
            curl -fsS -X POST -H 'Content-Type: application/json' -d "$body" \
              http://127.0.0.1:8080/challenge > /tmp/f1-challenge.json
            grep -q '"algorithm":"rsw"' /tmp/f1-challenge.json
          done
      - name: "F1 table done: restore the default sha256 profile"
        working-directory: deploy
        run: |
          set -euo pipefail
          SECRET="$(sed -n 's/^KIWI_SECRET_KEY=//p' .env | head -1)"
          {
            printf 'KIWI_SECRET_KEY=%s\n' "$SECRET"
            printf 'KIWI_SHA_TARGET_BITS=8\n'
          } > .env
          docker compose up -d --force-recreate captcha
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then
              echo "healthz answered 200 on attempt $attempt after the profile restore"
              break
            fi
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = "200"
      - name: F2 request-binding table (real /verify, one challenge per row)
        working-directory: deploy
        run: |
          set -euo pipefail
          issue() {  # $1 = issue binding (empty = unbound)
            local body='{"scope":"login"}'
            if [ -n "$1" ]; then
              body="{\"scope\":\"login\",\"request_binding\":\"$1\"}"
            fi
            curl -fsS -X POST -H 'Content-Type: application/json' -d "$body" \
              http://127.0.0.1:8080/challenge > /tmp/f2-challenge.json
            docker compose cp /tmp/f2-challenge.json captcha:/tmp/f2-challenge.json
            docker compose exec -T captcha php /srv/kiwicaptcha/deploy/app/solve.php \
              /tmp/f2-challenge.json > /tmp/f2-token.txt
            test -s /tmp/f2-token.txt
            tr -d '\r\n' < /tmp/f2-token.txt > /tmp/f2-token-clean.txt
            sleep 0.15
          }
          verify() {  # $1 = presented binding (empty = absent)
            local token
            token="$(cat /tmp/f2-token-clean.txt)"
            local body="{\"token\":\"$token\",\"scope\":\"login\"}"
            if [ -n "$1" ]; then
              body="{\"token\":\"$token\",\"scope\":\"login\",\"request_binding\":\"$1\"}"
            fi
            curl -sS -X POST -H 'Content-Type: application/json' -d "$body" \
              http://127.0.0.1:8080/verify > /tmp/f2-verify.json
          }
          # Issue bound to txn-A, verify with txn-A -> success.
          issue txn-A
          verify txn-A
          grep -q '"ok":true' /tmp/f2-verify.json
          # Issue bound to txn-A, verify with txn-B -> request_binding_mismatch.
          issue txn-A
          verify txn-B
          grep -q '"ok":false' /tmp/f2-verify.json
          grep -q '"code":"request_binding_mismatch"' /tmp/f2-verify.json
          # Issue bound to txn-A, verify with no binding -> request_binding_mismatch.
          issue txn-A
          verify ''
          grep -q '"ok":false' /tmp/f2-verify.json
          grep -q '"code":"request_binding_mismatch"' /tmp/f2-verify.json
          # Issue unbound, verify with no binding -> success.
          issue ''
          verify ''
          grep -q '"ok":true' /tmp/f2-verify.json
          # Issue unbound, verify with txn-A -> request_binding_mismatch.
          issue ''
          verify txn-A
          grep -q '"ok":false' /tmp/f2-verify.json
          grep -q '"code":"request_binding_mismatch"' /tmp/f2-verify.json
          # Correct binding, second redemption -> already_consumed.
          issue txn-A
          verify txn-A
          grep -q '"ok":true' /tmp/f2-verify.json
          verify txn-A
          grep -q '"ok":false' /tmp/f2-verify.json
          grep -q '"code":"already_consumed"' /tmp/f2-verify.json
          # One-shot row: a wrong binding attempt leaves the record
          # intact, so the correct redemption still succeeds afterwards.
          issue txn-A
          verify txn-B
          grep -q '"ok":false' /tmp/f2-verify.json
          grep -q '"code":"request_binding_mismatch"' /tmp/f2-verify.json
          verify txn-A
          grep -q '"ok":true' /tmp/f2-verify.json
      - name: restart the captcha container
        working-directory: deploy
        run: docker compose restart captcha
      - name: retry /healthz after the restart
        working-directory: deploy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then
              echo "healthz answered 200 on attempt $attempt after the restart"
              exit 0
            fi
            sleep 2
          done
          docker compose logs captcha
          echo "healthz never answered 200 after the restart" >&2
          exit 1
      - name: issue, solve and verify again against the persistent store
        working-directory: deploy
        run: |
          set -euo pipefail
          curl -fsS -o /tmp/challenge2.json -X POST -H 'Content-Type: application/json' \
            -d '{"scope":"login"}' http://127.0.0.1:8080/challenge
          docker compose cp /tmp/challenge2.json captcha:/tmp/challenge2.json
          docker compose exec -T captcha php /srv/kiwicaptcha/deploy/app/solve.php /tmp/challenge2.json > /tmp/token2.txt
          TOKEN2="$(tr -d '\r\n' < /tmp/token2.txt)"
          test -n "$TOKEN2"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"token\":\"$TOKEN2\",\"scope\":\"login\"}" \
            http://127.0.0.1:8080/verify | tee /tmp/verify2.json
          php -r 'exit(json_decode(file_get_contents("/tmp/verify2.json"), true)["ok"] === true ? 0 : 1);'
      - name: docker compose down
        if: always()
        working-directory: deploy
        run: docker compose down

  php-core-real-redis:
    # The real-Redis fault/topology/death coverage of the PHP core
    # must actually RUN in CI: the default PHP core matrix lanes have
    # no Redis service and no `KC_REDIS_URL`/`TEST_REDIS_URL`, so the
    # four real-Redis suites they reach would silently skip. This
    # dedicated required lane publishes the Redis env AND the
    # KIWI_REQUIRE_REAL_REDIS_TESTS=1 flag: the suites fail instead of
    # skipping when the Redis service, the redis-server/redis-cli
    # binaries or the pcntl/posix extensions are missing, so a future
    # change that breaks real failover boundary behavior,
    # worker-death recovery, Sentinel/Cluster behavior or the
    # two-phase protocol transition fails this required context
    # instead of staying green on skipped tests.
    name: PHP core real-Redis fault/topology
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73 # Redis 7.x.y (digest of the redis:7 tag as of 2026-08-05), digest-pinned
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: packages/kiwicaptcha-php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          php-version: '8.2'
          extensions: pcntl, posix, json, openssl, sodium
          coverage: none
      - name: composer install
        run: composer install --no-interaction --prefer-dist
      - name: install local redis binaries (topology suites)
        # The cluster and sentinel suites boot their own redis-server
        # processes from the binaries on `PATH`, and the ubuntu-latest
        # runner image does not ship them, so the lane installs the apt
        # packages. The apt postinst starts a systemd redis on 6379,
        # which would fight the docker service published on the same
        # port: the service is stopped right away, leaving the binaries
        # for the suites.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
          sudo systemctl stop redis-server || true
      - name: real-redis tooling preflight
        # The suites fail on a missing piece only when the run reaches
        # them; this preflight fails the lane loudly and immediately
        # when redis-server/redis-cli or the pcntl/posix extensions are
        # missing, so a broken runner image can never no-op the lane.
        run: |
          set -euo pipefail
          command -v redis-server >/dev/null || { echo "::error::redis-server is missing on PATH" >&2; exit 1; }
          command -v redis-cli >/dev/null || { echo "::error::redis-cli is missing on PATH" >&2; exit 1; }
          php -r 'if (!extension_loaded("pcntl") || !extension_loaded("posix")) { fwrite(STDERR, "pcntl/posix missing\n"); exit(1); } echo "pcntl/posix OK\n";'
      - name: install Symfony bundle vendor (cluster semaphore tests)
        # The cluster suite's RedisAdmissionSemaphore tests run the
        # bundle's real semaphore against the live cluster; without the
        # bundle vendor they skip (the keyslot tests cover the key
        # shapes instead). The lane installs the vendor so every test
        # of the four real-Redis suites runs — the lane's fail-on-skip
        # contract is that a missing piece fails the lane, never that a
        # test silently no-ops.
        working-directory: packages/kiwicaptcha/integrations/symfony
        run: composer install --no-interaction --no-scripts --prefer-dist
      - name: real-Redis fault/topology/death suites
        env:
          KC_REDIS_URL: redis://127.0.0.1:6379
          TEST_REDIS_URL: redis://127.0.0.1:6379
          KIWI_REQUIRE_REAL_REDIS_TESTS: '1'
        run: vendor/bin/phpunit --filter "FailoverPromotionStateLossRealRedisTest|WorkerDeathMatrixRealRedisTest|RedisClusterTopologyTest|RedisSentinelFailoverTest"

  phpredis-siteverify:
    # The Siteverify idempotency store and the invalid-secret log gate
    # accept both Predis and native PhpRedis, so the \Redis branch
    # (Redis::eval with the array-argument form) is validated here. This
    # required lane runs the Siteverify + idempotency suites with the
    # phpredis extension loaded and smokes the \Redis branch of the
    # idempotency store directly against the real Redis container.
    name: PhpRedis Siteverify (idempotency + log gate, real Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73 # Redis 7.x.y (digest of the redis:7 tag as of 2026-08-05), digest-pinned
        ports:
          - 6379:6379
          # The Siteverify suites hard-code tcp://127.0.0.1:6399 (repo
          # convention: docker run -d -p 6399:6379 redis:7-alpine) — the
          # PhpRedis smoke and SiteVerify(Concurrency)Test need that host
          # port; the container port stays 6379 like every other lane.
          - 6399:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 (node24)
        with:
          tools: composer:v2.9
          php-version: '8.3'
          extensions: redis, json, openssl, sodium
          coverage: none
      - name: install PHP core
        working-directory: packages/kiwicaptcha-php
        run: composer install --no-interaction --prefer-dist
      - name: install Symfony bundle
        # predis is a DEV dependency of the bundle (composer.json
        # require-dev) — the install brings it without an explicit require.
        working-directory: packages/kiwicaptcha/integrations/symfony
        run: composer install --no-interaction --no-scripts --prefer-dist
      - name: verify phpredis extension is loaded
        run: php -r 'if (!extension_loaded("redis")) { fwrite(STDERR, "redis extension missing\n"); exit(1); } echo "phpredis OK\n";'
      - name: phpredis idempotency-store smoke (real Redis, \Redis branch)
        # The Siteverify suites construct Predis clients explicitly and the
        # store branches on the client type — this smoke proves the \Redis
        # branch (Redis::eval with the array-argument form) against the
        # real Redis at 127.0.0.1:6399 before the suites run.
        working-directory: packages/kiwicaptcha/integrations/symfony
        run: |
          # shellcheck disable=SC2016 # PHP variables inside single-quoted code
          php -r '
            require "vendor/autoload.php";
            $r = new \Redis();
            $r->connect("127.0.0.1", 6399);
            $r->ping();
            $store = new BelConsulting\KiwiCaptchaBundle\SiteVerify\RedisSiteVerifyIdempotencyStore($r);
            $backendId = hash("sha256", "smoke-secret");
            $uuid = "8f2a1c3e-4b5d-4e6f-9a0b-1c2d3e4f5a6b";
            $key = "{kiwicaptcha}:siteverify-idem:" . $backendId . ":" . $uuid;
            $r->del($key);
            [$claim, $owner] = $store->claim($backendId, $uuid, "smoke-response-hash", 60, "no-ip");
            if ($claim !== BelConsulting\KiwiCaptchaBundle\SiteVerify\IdempotencyClaim::Claimed || !is_string($owner)) {
                fwrite(STDERR, "first claim was not CLAIMED\n"); exit(1);
            }
            $store->finalize($backendId, $uuid, "smoke-response-hash", $owner, ["success" => true]);
            [$claim2, $owner2] = $store->claim($backendId, $uuid, "smoke-response-hash", 60, "no-ip");
            if ($claim2 !== BelConsulting\KiwiCaptchaBundle\SiteVerify\IdempotencyClaim::CompleteSame || $owner2 !== null) {
                fwrite(STDERR, "re-claim was not COMPLETE_SAME\n"); exit(1);
            }
            $stored = $store->stored($backendId, $uuid);
            if (!is_array($stored) || ($stored["success"] ?? null) !== true) {
                fwrite(STDERR, "stored canonical response missing\n"); exit(1);
            }
            $r->del($key);
            echo "OK\n";
          '
      - name: siteverify + idempotency suites (real Redis)
        # The smoke above already proved the \Redis branch of the
        # idempotency store; this step runs the full Siteverify +
        # concurrency coverage once (the standard Symfony lane owns the
        # full-suite regression run).
        working-directory: packages/kiwicaptcha/integrations/symfony
        run: vendor/bin/phpunit --filter "SiteVerifyTest|SiteVerifyConcurrencyTest"

  redis-compat:
    # Non-gating forward-compatibility probe: runs the risk real-Redis
    # suites against newer Redis (8.x, digest-pinned) so future Redis
    # behavior changes surface as visible warnings, while the release gate
    # keeps testing the deterministic pinned Redis 7 digest. Deliberately
    # NOT in the protected-main required-check set.
    name: Redis 8 compatibility (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      redis:
        image: redis@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366 # Redis 8.x (digest of the redis:8 tag as of 2026-08-15)
