kiwi_captcha:
    # Policy-level posture preset: balanced | privacy_strict | high_abuse |
    # compatibility. The profile fills safe derived defaults for the
    # safety-relevant knobs you do not set explicitly; an explicitly
    # configured knob always wins. See docs/configuration.md.
    protection_profile: balanced

    # Required, min 16 bytes. Generate with: openssl rand -hex 32
    secret_key: '%env(KIWI_SECRET_KEY)%'

    # Canonical public origin (required in production; the same-origin
    # check compares against this value, never the Host header).
    public_base_url: '%env(KIWI_PUBLIC_URL)%'

    # Production requires a shared atomic storage (RedisStorage), which
    # enforces strict single-use across workers. Define the storage
    # service in your application and uncomment:
    # storage: kiwicaptcha.storage.redis
    #
    # Optional: service id of your Redis client (\Redis or Predis\Client)
    # used for the atomic rate limiter and the Argon admission semaphore.
    # redis_service: '%env(KIWI_REDIS_CLIENT)%'
