# Traefik forwardAuth gate for KiwiCaptcha (file provider dynamic
# configuration). Deploy: drop the file into the dynamic-config
# directory the static config watches (--providers.file.directory),
# run kiwi-verify.php (this directory ships a copy) behind
# 127.0.0.1:8788, and attach the kiwi-captcha middleware to every
# router that must carry a captcha.
#
# The forwardAuth call preserves the original method and body, so the
# token may arrive in the X-Kiwi-Token header, the kiwi_token cookie,
# a form field or a JSON body. On a deny (403) or a redirect (302 with
# KIWI_DENY=302), Traefik returns the endpoint's response to the
# client, so the redirect knob works natively here.

http:
  middlewares:
    kiwi-captcha:
      forwardAuth:
        address: http://127.0.0.1:8788/kiwi-verify.php
        trustForwardHeader: true
        # Client-IP contract: Traefik is a forwarding proxy — its
        # forwarded-header middleware APPENDS the real client to
        # X-Forwarded-For after whatever the client sent. The endpoint
        # walks that chain right to left through KIWI_TRUSTED_PROXIES
        # (which must cover only the PHP peer, e.g. 127.0.0.0/8) and
        # takes the first hop outside it, so a forged leftmost entry is
        # ignored. This holds only while Traefik keeps appending: if
        # the forwarded-header middleware is disabled or the chain is
        # passed through raw, the header becomes client-controlled and
        # the gate must not trust it (empty KIWI_TRUSTED_PROXIES). With
        # an intermediate proxy in front of Traefik, name only that
        # proxy in KIWI_TRUSTED_PROXIES — never the client's own range.
        # authResponseHeaders stays empty: nothing is copied back to
        # the app on success.

  routers:
    admin-gated:
      rule: "PathPrefix(`/admin`)"
      service: admin
      middlewares:
        - kiwi-captcha

  services:
    admin:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3000"
