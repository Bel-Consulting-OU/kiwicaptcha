# The GitLab CE sign-up gate: an nginx snippet that fronts the
# registration POST with the kiwi auth_request bundle. GitLab's
# registration POST hits /users/sign_up (the Rails route the sign-up
# form posts to, format suffixes included: /users/sign_up.json).
#
# This snippet is a fragment: compose it into the server block of the
# reverse proxy in front of GitLab. GitLab Omnibus embeds its own
# nginx; either put a plain nginx (or Caddy) in front of the Omnibus
# instance, or use the Omnibus nginx['custom_nginx_config'] hook to
# include the pieces. The deployment docs keep the reference pieces
# next to nginx/kiwi-gate.conf.example, which is lintable standalone.
#
# Routing decision, stated plainly: GitLab has no plugin surface for
# captcha on self-hosted CE, and patching the Rails controllers would
# not survive an update. The gate lives in the reverse proxy and
# covers exactly the sign-up endpoint.

# The auth subrequest target: PHP + kiwi-verify.php (see
# integrations-platforms/nginx/).
location = /_kiwi_signup_verify {
    internal;
    fastcgi_pass unix:/run/php/php-fpm-kiwi.sock;
    fastcgi_param SCRIPT_FILENAME /srv/kiwi/kiwi-verify.php;
    fastcgi_param DOCUMENT_ROOT /srv/kiwi;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param HTTP_X_KIWI_TOKEN $http_x_kiwi_token;
    fastcgi_param HTTP_COOKIE $http_cookie;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param KIWI_VERIFY_URL http://127.0.0.1:7371/verify;
    fastcgi_param KIWI_SCOPE signup;
    fastcgi_param KIWI_TRUSTED_PROXIES 127.0.0.0/8;
    fastcgi_param KIWI_DENY 403;
}

# The gated route: the sign-up POST, format suffixes included.
location ~ ^/users/sign_up(\.json)?$ {
    auth_request /_kiwi_signup_verify;
    error_page 403 = @kiwi_signup_denied;
    error_page 500 502 503 504 = @kiwi_gate_fault;
    proxy_pass http://127.0.0.1:8181; # GitLab Omnibus workhorse, the default
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The browser redirect when the challenge is missing or failed.
location @kiwi_signup_denied {
    return 302 /users/sign_in;
}

# The gate fault page: kiwi unreachable means fail closed.
location @kiwi_gate_fault {
    return 503;
}
