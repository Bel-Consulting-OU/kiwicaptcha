# The Gitea/Forgejo sign-up gate: an nginx snippet that fronts the
# registration POST with the kiwi auth_request bundle. Gitea's
# registration POST hits /user/sign_up; Forgejo is the same path.
#
# This snippet is a fragment: include it from the http context of the
# server block that reverse-proxies Gitea (the deployment docs keep
# the pieces next to nginx/kiwi-gate.conf.example, which is lintable
# standalone).
#
# Routing decision, stated plainly: Gitea and Forgejo have no plugin
# surface for captcha, and patching core would not survive an update.
# The gate lives in the reverse proxy and covers exactly the sign-up
# endpoint; everything else reaches Gitea untouched.

# The auth subrequest target: PHP + kiwi-verify.php (see
# integrations-platforms/nginx/). This snippet assumes the nginx in
# front of Gitea/Forgejo is the EDGE: the socket peer is the real
# client, so trust is OFF (no KIWI_TRUSTED_PROXIES) and no forwarding
# header is passed. Behind another proxy, pass the chain and name only
# that proxy in KIWI_TRUSTED_PROXIES — never $proxy_add_x_forwarded_for
# with trust off, and never $http_x_forwarded_for raw.
location = /_kiwi_signup_verify {
    internal;
    fastcgi_pass unix:/run/php/php-fpm-kiwi.sock;
    fastcgi_param SCRIPT_FILENAME /srv/kiwi/kiwi-verify.php;
    fastcgi_param DOCUMENT_ROOT /srv/kiwi;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param HTTP_X_KIWI_TOKEN $http_x_kiwi_token;
    fastcgi_param HTTP_COOKIE $http_cookie;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param KIWI_VERIFY_URL http://127.0.0.1:7371/verify;
    fastcgi_param KIWI_SCOPE signup;
    fastcgi_param KIWI_DENY 403;
}

# The gated route: Gitea/Forgejo's registration POST.
location = /user/sign_up {
    auth_request /_kiwi_signup_verify;
    error_page 403 = @kiwi_signup_denied;
    error_page 500 502 503 504 = @kiwi_gate_fault;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Edge: replace (never append to) the client's X-Forwarded-For so
    # a forged leftmost hop cannot reach the upstream application.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The browser redirect when the challenge is missing or failed.
location @kiwi_signup_denied {
    return 302 /user/login?redirect_to=%2Fuser%2Fsign_up;
}

# The gate fault page: kiwi unreachable means fail closed.
location @kiwi_gate_fault {
    return 503;
}
