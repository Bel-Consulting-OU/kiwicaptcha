<!-- INCLUDE overall_header.html -->

<a name="maincontent"></a>

<h1>{L_ACP_KIWI_SETTINGS}</h1>
<p>{L_CAPTCHA_KIWI_TITLE_EXPLAIN}</p>

<form id="acp_kiwi_settings" method="post" action="{U_ACTION}">
    <fieldset>
        <legend>{L_ACP_KIWI_SETTINGS}</legend>

        <dl>
            <dt><label for="kiwi_verify_url">{L_KIWI_VERIFY_URL}{L_COLON}</label><br /><span>{L_KIWI_VERIFY_URL_EXPLAIN}</span></dt>
            <dd><input type="text" id="kiwi_verify_url" name="kiwi_verify_url" value="{KIWI_VERIFY_URL}" size="60" /></dd>
        </dl>
        <dl>
            <dt><label for="kiwi_bearer">{L_KIWI_BEARER}{L_COLON}</label><br /><span>{L_KIWI_BEARER_EXPLAIN}</span></dt>
            <dd><input type="password" id="kiwi_bearer" name="kiwi_bearer" value="{KIWI_BEARER}" size="60" autocomplete="off" /></dd>
        </dl>
        <dl>
            <dt><label for="kiwi_shim_url">{L_KIWI_SHIM_URL}{L_COLON}</label><br /><span>{L_KIWI_SHIM_URL_EXPLAIN}</span></dt>
            <dd><input type="text" id="kiwi_shim_url" name="kiwi_shim_url" value="{KIWI_SHIM_URL}" size="60" /></dd>
        </dl>
        <dl>
            <dt><label for="kiwi_mode">{L_KIWI_MODE}{L_COLON}</label></dt>
            <dd>
                <select id="kiwi_mode" name="kiwi_mode">
                    <option value="json"<!-- IF S_KIWI_MODE_JSON --> selected="selected"<!-- ENDIF -->>{L_KIWI_MODE_JSON}</option>
                    <option value="compat"<!-- IF S_KIWI_MODE_COMPAT --> selected="selected"<!-- ENDIF -->>{L_KIWI_MODE_COMPAT}</option>
                </select>
            </dd>
        </dl>
        <dl>
            <dt><label for="kiwi_scope">{L_KIWI_SCOPE}{L_COLON}</label><br /><span>{L_KIWI_SCOPE_EXPLAIN}</span></dt>
            <dd><input type="text" id="kiwi_scope" name="kiwi_scope" value="{KIWI_SCOPE}" size="40" /></dd>
        </dl>
        <dl>
            <dt><label for="kiwi_trusted_proxies">{L_KIWI_TRUSTED_PROXIES}{L_COLON}</label><br /><span>{L_KIWI_TRUSTED_PROXIES_EXPLAIN}</span></dt>
            <dd><input type="text" id="kiwi_trusted_proxies" name="kiwi_trusted_proxies" value="{KIWI_TRUSTED_PROXIES}" size="60" /></dd>
        </dl>

        <p class="submit-buttons">
            <input class="button1" type="submit" id="submit" name="submit" value="{L_SUBMIT}" />&nbsp;
            <input class="button2" type="reset" id="reset" name="reset" value="{L_RESET}" />
            {S_FORM_TOKEN}
        </p>
    </fieldset>
</form>

<!-- INCLUDE overall_footer.html -->
