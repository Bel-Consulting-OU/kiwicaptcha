# Woodpecker CI: the release-evidence tool lanes (mirrors the GitHub
# jobs release-validator-mutation-suite and perf-budget in full: the
# hard byte budgets, the CI-mode release-baseline gate, and the
# non-gating diagnostic benchmarks against the Redis service, failing
# at the end exactly when the gate rejected the committed evidence).
# A separate workflow file: the perf step installs two composer vendor
# trees and a Node toolchain, so it must not race another lane in the
# shared workspace.
when:
  - event: [push, pull_request, tag, manual]

services:
  redis:
    image: redis:7-alpine
    commands:
      - redis-server --port 6399 --save "" --appendonly no

steps:
  - name: validator-mutation-suites
    image: node:22-alpine
    commands:
      - apk add --no-cache bash git
      - node tools/ci/test-validate-release-baseline.mjs
      - node tools/ci/test-validate-autofill-qualification.mjs
      - bash tools/ci/latency-compare-test.sh

  - name: perf-budget
    image: php:8.3-cli
    environment:
      KC_REDIS_URL: redis://redis:6399
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev unzip git brotli curl
        docker-php-ext-install -j"$(nproc)" gmp
        EXPECTED="$(php -r 'copy("https://composer.github.io/installer.sig", "php://stdout");')"
        php -r "copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');"
        ACTUAL="$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")"
        [ "$EXPECTED" = "$ACTUAL" ] || { echo "composer installer checksum mismatch" >&2; exit 1; }
        php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
        rm -f /tmp/composer-setup.php
        # The Node runtime is fetched from its versioned dist path and
        # verified against the published SHASUMS256.txt entry.
        NODE_VERSION=v22.14.0
        cd /tmp
        curl -sSfO "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz"
        curl -sSfO "https://nodejs.org/dist/${NODE_VERSION}/SHASUMS256.txt"
        grep "node-${NODE_VERSION}-linux-x64.tar.xz\$" SHASUMS256.txt | sha256sum -c -
        tar -xJf "node-${NODE_VERSION}-linux-x64.tar.xz" -C /usr/local --strip-components=1
      - |
        set -euo pipefail
        (cd packages/kiwicaptcha-php && composer install --no-interaction --prefer-dist)
        (cd packages/kiwicaptcha-risk-php && composer install --no-interaction --prefer-dist)
        bash packages/kiwicaptcha/tools/perf-budget.sh
        node tools/ci/validate-release-baseline.mjs tools/client-perf/results/baseline.json || echo gate_failed > "$CI_WORKSPACE/.ci-perf-gate-failed"
      - |
        set -euo pipefail
        # The diagnostic benchmark steps are advisory timing runs: every
        # one records its percentiles, and the workflow still fails only
        # on the recorded release-baseline gate, exactly like the
        # primary perf-budget job.
        php packages/kiwicaptcha/tools/perf-bench.php
        php packages/kiwicaptcha/tools/perf-bench.php --redis
        php packages/kiwicaptcha/tools/perf-bench.php --argon
        php packages/kiwicaptcha/tools/perf-bench-risk.php
        php packages/kiwicaptcha/tools/perf-bench-risk.php --redis
        php packages/kiwicaptcha/tools/perf-wait.php
        php packages/kiwicaptcha/tools/perf-wait-replica.php
        if [ -f "$CI_WORKSPACE/.ci-perf-gate-failed" ]; then
          echo "release-baseline evidence gate rejected the committed baseline; the diagnostic steps still ran" >&2
          exit 1
        fi
        echo "release-baseline evidence gate passed; the diagnostic steps above ran"
