# Woodpecker CI: the aggregate promotion gate. One workflow that runs
# after the whole push-triggered functional matrix and reports a single
# pass/fail — the one status a forge ruleset should make required for
# main and for release promotion. The verification IS the DAG:
# Woodpecker's required depends_on semantics refuse to start this
# workflow when any dependency failed or was skipped, so this workflow
# running at all proves every entry in the list below finished green.
# No server API query, no read token in PR pipelines, no response-shape
# coupling to a server version. A lane missing from the list is a lane
# the gate no longer witnesses — review this list whenever a lane is
# added. Deliberately NOT listed: perf-latency (manual-only hard
# ratchet, never a merge gate by design), assets and the public-install
# lanes (manual-only), latency-regression (non-gating by design), and
# iOS (the Swift/XCTest lane needs a macOS runner, so it lives in the
# GitHub workflow only).
#
# Forge-side setup (one time, needs repository admin): add a ruleset
# for main requiring the check `promotion-gate` (and keep the v* tag
# ruleset the release lane preflights). The gate is deliberately a
# single workflow so the required-check list stays one line.
labels:
  capability: docker
when:
  - event: [push, pull_request, tag, manual]

depends_on:
  - lint
  - php-core
  - symfony
  - risk
  - rust
  - browser
  - redis-lanes
  - redis8
  - interop
  - compat-build
  - release-tools
  - packages
  - docker-deploy
  - sdks
  - wrappers
  - platform-integrations
  - verifier-redis
  - flutter

steps:
  - name: promotion-gate
    image: alpine:3.20
    commands:
      - |
        echo "promotion-gate: every dependency workflow in depends_on finished green for $${CI_COMMIT_SHA}"
        echo "required-check name for the forge ruleset: promotion-gate"
