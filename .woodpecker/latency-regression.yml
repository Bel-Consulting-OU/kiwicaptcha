# Woodpecker CI: the manual base/head latency regression (mirrors
# .github/workflows/latency-regression.yml). Manual event only: the
# comparator is meaningful on a quiet, dedicated host, never on a
# busy shared agent. Set LATENCY_BASE_REF (default head~1; pass the
# previous release tag for a release regression pass) and
# LATENCY_REDIS_URL when the redis mode is requested. Cross-step
# evidence lives under .ci-run-tmp/ in the shared workspace. The
# comparator itself is tools/ci/latency-compare.sh with its
# deterministic fixtures; only confident regressions block.
labels:
  capability: docker
when:
- event:
  - manual
services:
  redis:
    image: redis:7-alpine
steps:
- name: resolve-the-base-ref-(previous-release-commit-by-ref)
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -euo pipefail
      base="$${LATENCY_BASE_REF:-head~1}"
      git fetch origin "$$base" --tags 2>/dev/null || true
      if ! git rev-parse --verify -q "$$base" >/dev/null 2>&1; then
        echo "base ref $$base does not resolve" >&2
        exit 1
      fi
      echo "$$base" > .ci-run-tmp/base-ref

- name: check-out-the-base-tree-(same-session,-same-host)
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - 'set -euo pipefail

    git worktree add --detach base "$$BASE_REF"

    git -C base rev-parse head

    '
- name: composer-install-(head-tree)
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - composer install --no-interaction --prefer-dist
- name: composer-install-(base-tree)
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - composer install --no-interaction --prefer-dist
- name: record-the-host-state-(machine-identity,-governor,-load,-ver
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -euo pipefail
      mkdir -p "$$CI_WORKSPACE/.ci-run-tmp/kiwi-latency"
      evidence="$$CI_WORKSPACE/.ci-run-tmp/kiwi-latency/host-evidence.txt"
      {
        echo "captured_at=$$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        echo "head_sha=$$(git rev-parse HEAD)"
        echo "base_ref=$$BASE_REF"
        echo "uname=$$(uname -a)"
        echo "nproc=$$(nproc 2>/dev/null || true)"
        echo "php=$$(php -r 'echo PHP_VERSION;')"
        if command -v redis-cli >/dev/null 2>&1; then
          echo "redis=$$(redis-cli -u "$$KC_REDIS_URL" INFO server 2>/dev/null | sed -n 's/^redis_version://p' | tr -d '\r')"
        fi
        if [ -r /proc/cpuinfo ]; then
          echo "cpu_model=$$(awk -F: '/model name/ { gsub(/^ +/, "", $$2); print $$2; exit }' /proc/cpuinfo)"
        fi
        if command -v lscpu >/dev/null 2>&1; then
          lscpu | sed -n 's/^ *\(Model name\|CPU(s)\|CPU max MHz\|CPU min MHz\|Thread(s) per core\|Core(s) per socket\): */lscpu_\1=/p'
        fi
        for cpu in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
          [ -r "$$cpu" ] || continue
          echo "$$cpu=$$(cat "$$cpu")"
        done
        echo "uptime=$$(uptime 2>/dev/null || true)"
        echo "loadavg=$$(cat /proc/loadavg 2>/dev/null || true)"
      } | tee "$$evidence"

- name: host-warm-up-runs-(both-trees,-discarded;-settles-governor,-
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -euo pipefail
      for _ in 1 2; do
        for root in "$$CI_WORKSPACE/base" "$$CI_WORKSPACE"; do
          (cd "$$root" && php packages/kiwicaptcha/tools/perf-bench.php) >/dev/null 2>&1 || true
        done
      done
      echo "warm-up runs done (base and head, two interleaved passes)"

- name: balanced-repeated-benchmark-runs-(balanced-alternating-order
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -euo pipefail
      repeats="$${LATENCY_REGRESSION_REPEATS:-6}"
      modes="$${LATENCY_REGRESSION_MODES:-array}"
      if (( repeats < 2 || repeats % 2 != 0 )); then
        echo "LATENCY_REGRESSION_REPEATS must be an even count >= 2 for a balanced balanced alternating order (got $$repeats)" >&2
        exit 1
      fi
      mkdir -p "$$CI_WORKSPACE/.ci-run-tmp/kiwi-latency/base" "$$CI_WORKSPACE/.ci-run-tmp/kiwi-latency/head"
      for mode in $$modes; do
        case "$$mode" in
          array) flags=() ;;
          redis) flags=(--redis) ;;
          argon) flags=(--argon) ;;
          *) echo "unknown LATENCY_REGRESSION_MODES entry: $$mode" >&2; exit 1 ;;
        esac
        for ((repeat = 1; repeat <= repeats; repeat++)); do
          if (( repeat % 2 == 1 )); then order=(base head); else order=(head base); fi
          for side in "$${order[@]}"; do
            if [ "$$side" = base ]; then
              root="$$CI_WORKSPACE/base"
              out="$$CI_WORKSPACE/.ci-run-tmp/kiwi-latency/base/$$mode-$$repeat.log"
            else
              root="$$CI_WORKSPACE"
              out="$$CI_WORKSPACE/.ci-run-tmp/kiwi-latency/head/$$mode-$$repeat.log"
            fi
            (cd "$$root" && php packages/kiwicaptcha/tools/perf-bench.php "$${flags[@]}") >"$$out" 2>&1 || true
            echo "$$side $$mode repeat $$repeat (order $$repeat%2): $$(sed -n 's/perf-bench: \(SHA-256 [a-z]*\|Argon2id admission\) issuance.*/bench line recorded/p' "$$out" || true)"
          done
        done
      done

- name: compare-base-vs-head-(paired-distributions,-balanced-order)
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -euo pipefail
      repeats="$${LATENCY_REGRESSION_REPEATS:-6}"
      modes="$${LATENCY_REGRESSION_MODES:-array}"
      rel_max="$${LATENCY_REGRESSION_MAX_REL_PCT:-20}"
      abs_max="$${LATENCY_REGRESSION_MAX_ABS_MS:-0.5}"
      spread_max="$${LATENCY_REGRESSION_MAX_SPREAD:-10}"
      bash tools/ci/latency-compare.sh \
        "$$CI_WORKSPACE/.ci-run-tmp/kiwi-latency" "$$repeats" "$$modes" "$$rel_max" "$$abs_max" "$$spread_max"
      if [ -f "$$CI_WORKSPACE/.ci-run-tmp/kiwi-latency/ambiguous" ]; then
        {
          echo "Latency regression: ambiguous"
          echo ""
          echo "An over-threshold signal without paired-distribution agreement was recorded."
          echo "It is non-blocking; re-run on the quiet runner before concluding. Evidence: kiwi-latency-evidence."
        } >>"$$CI_WORKSPACE/.ci-run-tmp/step-summary.txt"
      fi

- name: reverse-order-validation-note
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - 'echo "reverse-order probe: dispatch with base_ref newer than the head commit; expect PASS"

    '
