# Woodpecker CI: the manual hard-ratchet performance benchmark (mirrors
# the GitHub job perf-latency-quiet). Manual event only, exactly like
# the primary lane: the ratchet is meaningful on a quiet, dedicated
# host. The fenced Redis service feeds the --redis modes; the preflight
# proves reachability before the first hard-ratchet gate.
#
# Every timing command writes a --json-out provenance record under
# .ci-run-tmp/kiwi-perf-latency/, the shared-workspace evidence
# convention of this repository. Woodpecker has no artifact store, so
# the publish-timing-records step prints each record into the run log,
# on a failed run as well: a failed hard ratchet is exactly the run
# whose provenance matters. A missing record never fails the lane.
labels:
  capability: docker
when:
  - event: [manual]

services:
  redis:
    image: redis:7-alpine
    commands:
      - redis-server --port 6399 --save "" --appendonly no

steps:
  - name: perf-latency-quiet
    image: php:8.3-cli
    environment:
      KC_REDIS_URL: redis://redis:6399
    commands:
      - |
        set -eu
        apt-get update -qq
        apt-get install -y -qq libgmp-dev libsodium-dev unzip git redis-server
        # The replica fixture boots its own master and replica, so the
        # step image needs the server binary: the fenced redis service
        # feeds the --redis modes, not perf-wait-replica.php.
        docker-php-ext-install -j"$$(nproc)" gmp sodium
        EXPECTED="$$(php -r 'copy("https://composer.github.io/installer.sig", "php://stdout");')"
        php -r "copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');"
        ACTUAL="$$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")"
        [ "$$EXPECTED" = "$$ACTUAL" ] || { echo "composer installer checksum mismatch" >&2; exit 1; }
        php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
        rm -f /tmp/composer-setup.php
      - |
        set -eu
        (cd packages/kiwicaptcha-php && composer install --no-interaction --prefer-dist)
        (cd packages/kiwicaptcha/integrations/symfony && composer install --no-interaction --prefer-dist --no-scripts)
      - |
        set -eu
        php -r '
          require "packages/kiwicaptcha-php/vendor/autoload.php";
          $$url = getenv("KC_REDIS_URL") ?: "redis://redis:6399";
          $$client = new Predis\Client($$url, ["timeout" => 5.0, "read_write_timeout" => 5.0]);
          $$client->ping();
          echo "manual-benchmark preflight: Redis answers at $$url\n";
        '
      - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp/kiwi-perf-latency"
      - php packages/kiwicaptcha/tools/perf-bench.php --json-out "$$CI_WORKSPACE/.ci-run-tmp/kiwi-perf-latency/perf-bench-array.json"
      - php packages/kiwicaptcha/tools/perf-bench.php --redis --json-out "$$CI_WORKSPACE/.ci-run-tmp/kiwi-perf-latency/perf-bench-redis.json"
      - php packages/kiwicaptcha/tools/perf-bench.php --argon --json-out "$$CI_WORKSPACE/.ci-run-tmp/kiwi-perf-latency/perf-bench-argon.json"
      - php packages/kiwicaptcha/tools/perf-bench-risk.php --json-out "$$CI_WORKSPACE/.ci-run-tmp/kiwi-perf-latency/perf-bench-risk-inmemory.json"
      - php packages/kiwicaptcha/tools/perf-bench-risk.php --redis --json-out "$$CI_WORKSPACE/.ci-run-tmp/kiwi-perf-latency/perf-bench-risk-redis.json"
      - php packages/kiwicaptcha/tools/perf-wait.php --json-out "$$CI_WORKSPACE/.ci-run-tmp/kiwi-perf-latency/perf-wait.json"
      - php packages/kiwicaptcha/tools/perf-wait-replica.php --json-out "$$CI_WORKSPACE/.ci-run-tmp/kiwi-perf-latency/perf-wait-replica.json"

  - name: publish-timing-records
    # Woodpecker has no artifact store, so the records are published to
    # the retained run log. The step is tolerant by design: a missing
    # record prints a note and never fails the lane. Running it on both
    # statuses keeps the provenance of a failed hard-ratchet run.
    image: php:8.3-cli
    when:
      - status: [success, failure]
    commands:
      - |
        set -u
        dir="$$CI_WORKSPACE/.ci-run-tmp/kiwi-perf-latency"
        found=0
        for record in "$$dir"/*.json; do
          [ -f "$$record" ] || continue
          found=1
          echo "=== $$record ==="
          cat "$$record"
        done
        [ "$$found" = "1" ] || echo "no timing records were written"
