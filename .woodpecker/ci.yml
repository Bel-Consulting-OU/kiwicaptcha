# Woodpecker CI: the full required lane set, at least equivalent to
# .github/workflows/ci.yml (kept in place during the migration). Docs
# lint and every other lint run HERE as first-class required steps, not
# only on GitHub Actions.
#
# Equivalence map (GitHub job -> Woodpecker step below):
#   repo-sanity, release-contract, doc-hygiene  -> lint-repo
#   workflow-lint                               -> lint-workflow
#   php, php-matrix                             -> php-core-8.1/8.3/8.5
#   php-no-gmp                                  -> php-core-no-gmp
#   php-core-real-redis, redis                  -> php-core-real-redis
#   phpredis-siteverify                         -> phpredis-siteverify
#   symfony, symfony-matrix                     -> symfony-bundle
#   risk-php, risk-parity                       -> risk-php, risk-parity
#   rust, package-cargo, quick-start            -> rust-workspace
#   risk-rust                                   -> risk-rust
#   rust-redis-verify                           -> rust-redis-verify
#   cross-language                              -> cross-language-*
#   release-validator-mutation-suite            -> validator-mutation-suites
#   perf-budget (gating validator part)         -> perf-budget
#   browser, browser-a11y                       -> .woodpecker/browser.yml
# The hardware-bound lanes stay on their dedicated infrastructure:
# build reproducibility (independent runners), the latency runner
# (self-hosted kiwi-perf), the Docker reference deployment (DinD), and
# the manual hard-ratchet benchmark.
when:
  - event: [push, pull_request, tag, manual]

services:
  redis:
    image: redis:7-alpine
    commands:
      - redis-server --port 6379 --save "" --appendonly no

steps:
  # ── Repository contract + every lint (docs lint included) ─────────
  - name: lint-repo
    image: alpine:3.20
    commands:
      - apk add --no-cache bash git gawk ripgrep coreutils
      - |
        set -euo pipefail
        KIWI_HDR='# KiwiCaptcha'
        APEX_HDR='# ApexM''ail'
        grep -q "^$KIWI_HDR" README.md
        ! grep -q "^$APEX_HDR" README.md
        grep -q 'packages/kiwicaptcha' README.md
        grep -q '"name": "bel-consulting/kiwicaptcha-symfony"' packages/kiwicaptcha/integrations/symfony/composer.json
        grep -q '^name = "kiwicaptcha"' packages/kiwicaptcha/Cargo.toml
        for asset in kiwicaptcha-wasm.js kiwi-worker.js widget-driver.js widget-risk.js widget-telemetry.js widget-locales.js widget-compat.js widget.css; do
          test -f "packages/kiwicaptcha-wasm/assets/$asset"
        done
        test -f tests/browser/compat-capabilities.json
        for d in kiwicaptcha kiwicaptcha-php kiwicaptcha-wasm kiwicaptcha-risk kiwicaptcha-risk-php; do
          test ! -d "$d"
        done
        echo "product identity OK"
      - |
        set -euo pipefail
        cmp packages/kiwicaptcha-wasm/ACCESSIBILITY.md \
          packages/kiwicaptcha/integrations/symfony/Resources/ACCESSIBILITY.md
        echo "accessibility documents byte-identical"
      - sh packages/kiwicaptcha/tools/docs-lint-one-shot-test.sh
      - sh packages/kiwicaptcha/tools/verify-error-code-parity.sh
      - bash packages/kiwicaptcha/tools/docs-lint.sh --source --baseline packages/kiwicaptcha/tools/docs-lint-baseline.txt
      - |
        set -euo pipefail
        base="${CI_COMMIT_BEFORE_SHA:-}"
        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
          if [ "${CI_PIPELINE_EVENT:-}" = "pull_request" ] && [ -n "${CI_COMMIT_TARGET_SHA:-}" ]; then
            base="$CI_COMMIT_TARGET_SHA"
          else
            base="$(git rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
        fi
        [ -n "$base" ] || { echo "baseline integrity needs a comparison base (before-SHA, target-SHA or HEAD^)" >&2; exit 1; }
        git cat-file -e "$base:packages/kiwicaptcha/tools/docs-lint-baseline.txt" 2>/dev/null \
          || { echo "no baseline file at $base" >&2; exit 1; }
        git show "$base:packages/kiwicaptcha/tools/docs-lint-baseline.txt" > /tmp/base-baseline.txt
        while IFS= read -r entry; do
          entry="${entry#"${entry%%[![:space:]]*}"}"
          entry="${entry%%#*}"
          entry="${entry%"${entry##*[![:space:]]}"}"
          [ -n "$entry" ] || continue
          if awk -v p="$entry" '!/^TOTAL[ \t]/ && $2 == p { found = 1 } END { exit !found }' /tmp/base-baseline.txt; then
            echo "stale adoption manifest entry: $entry already has a baseline row" >&2
            exit 1
          fi
        done < packages/kiwicaptcha/tools/docs-lint-adopted.txt
        bash packages/kiwicaptcha/tools/docs-lint.sh --source --integrity /tmp/base-baseline.txt
      - bash tools/ci/version-prose-lint.sh
      - bash tools/ci/release-asset-contract.sh
      - bash tools/ci/protocol-manifest-check.sh
      - bash tools/ci/release-governance-fixture.sh
      - |
        set -euo pipefail
        for f in risk-v1.lua calibration.lua confirm.lua correction.lua \
                  outcome_confirm.lua outcome_correct.lua outcome_register.lua \
                  register_decision.lua sampling_metrics.lua; do
          test -f "protocol/risk-v1/$f"
          test -f "packages/kiwicaptcha-risk/resources/$f"
          test -f "packages/kiwicaptcha-risk-php/resources/$f"
          cmp -s "protocol/risk-v1/$f" "packages/kiwicaptcha-risk/resources/$f"
          cmp -s "protocol/risk-v1/$f" "packages/kiwicaptcha-risk-php/resources/$f"
        done
        echo "all canonical Lua copies byte-identical"
      - |
        set -euo pipefail
        PATTERN='audit( round)? #[0-9]''+''|audit roun''d''|(^|[^A-Za-z])round[- ]?[0-9]''+''|\bP[0-3]\b''|the o''ld''|previousl''y''|previous implementatio''n''|catastroph''ic''|ApexMa''il'
        if rg -n -i \
          --glob '!CHANGELOG*' \
          --glob '!**/CHANGELOG*' \
          --glob '!**/vendor/**' \
          --glob '!**/node_modules/**' \
          --glob '!**/target/**' \
          "$PATTERN" \
          packages tests README.md SECURITY.md .github/workflows .woodpecker; then
          echo "internal-history commentary found in product source/docs" >&2
          exit 1
        fi
        echo "doc hygiene OK"

  - name: lint-workflow
    image: rhysd/actionlint:latest
    commands:
      - actionlint -color=never

  - name: composer-contracts
    image: composer:2
    commands:
      - |
        set -euo pipefail
        composer validate --strict --no-check-publish --working-dir=packages/kiwicaptcha-php
        composer validate --strict --no-check-publish --working-dir=packages/kiwicaptcha-risk-php
        composer validate --strict --no-check-publish --working-dir=packages/kiwicaptcha/integrations/symfony
        (cd packages/kiwicaptcha-php && bash ../kiwicaptcha/tools/check-psr4.sh)

  # ── PHP core matrix ───────────────────────────────────────────────
  - name: php-core
    image: php:8.3-cli
    commands:
      - &php_extensions |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev libsodium-dev unzip git
        docker-php-ext-install -j"$(nproc)" gmp sodium
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - &php_core_suite |
        set -euo pipefail
        cd packages/kiwicaptcha-php
        composer validate --strict
        bash ../kiwicaptcha/tools/check-psr4.sh
        composer install --no-interaction --prefer-dist
        vendor/bin/phpunit

  - name: php-core-8.1
    image: php:8.1-cli
    commands:
      - *php_extensions
      - *php_core_suite

  - name: php-core-8.5
    image: php:8.5-cli
    commands:
      - *php_extensions
      - *php_core_suite

  - name: php-core-no-gmp
    image: php:8.3-cli
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq unzip git
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - |
        set -euo pipefail
        cd packages/kiwicaptcha-php
        composer validate --strict
        composer install --no-interaction --prefer-dist
        php ../../tools/ci/no-gmp-verify.php

  - name: php-core-real-redis
    image: php:8.3-cli
    environment:
      KC_REDIS_URL: redis://redis:6379
      TEST_REDIS_URL: redis://redis:6379
      KIWI_REQUIRE_REAL_REDIS_TESTS: '1'
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev libsodium-dev unzip git redis-server redis-tools
        docker-php-ext-install -j"$(nproc)" gmp sodium pcntl posix
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - |
        set -euo pipefail
        cd packages/kiwicaptcha-php
        composer install --no-interaction --prefer-dist
        (cd ../kiwicaptcha/integrations/symfony && composer install --no-interaction --prefer-dist --no-scripts)
        vendor/bin/phpunit --filter "FailoverPromotionStateLossRealRedisTest|WorkerDeathMatrixRealRedisTest|RedisClusterTopologyTest|RedisSentinelFailoverTest"

  - name: phpredis-siteverify
    image: php:8.3-cli
    environment:
      KC_REDIS_URL: redis://redis:6379
      TEST_REDIS_URL: redis://redis:6379
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev libsodium-dev unzip git
        docker-php-ext-install -j"$(nproc)" gmp sodium
        pecl install redis && docker-php-ext-enable redis
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - |
        set -euo pipefail
        cd packages/kiwicaptcha/integrations/symfony
        composer install --no-interaction --prefer-dist
        php -r 'if (!extension_loaded("redis")) { fwrite(STDERR, "redis extension missing\n"); exit(1); } echo "phpredis OK\n";'
        vendor/bin/phpunit --filter "SiteVerifyTest|SiteVerifyConcurrencyTest"

  # ── Symfony bundle (default line + the declared compatibility ends) ─
  - name: symfony-bundle
    image: php:8.3-cli
    environment:
      KC_REDIS_URL: redis://redis:6379
      TEST_REDIS_URL: redis://redis:6379
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev libsodium-dev unzip git
        docker-php-ext-install -j"$(nproc)" gmp sodium
        pecl install redis && docker-php-ext-enable redis
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - |
        set -euo pipefail
        cd packages/kiwicaptcha/integrations/symfony
        composer install --no-interaction --prefer-dist
        vendor/bin/phpunit
        composer update --no-interaction --with symfony/framework-bundle:8.1.* --with symfony/http-kernel:8.1.* --with symfony/http-foundation:8.1.* --with symfony/validator:8.1.* --with symfony/form:8.1.*
        vendor/bin/phpunit
        composer update --no-interaction --with symfony/framework-bundle:6.4.* --with symfony/http-kernel:6.4.* --with symfony/http-foundation:6.4.* --with symfony/validator:6.4.* --with symfony/form:6.4.* --with symfony/config:6.4.* --with symfony/dependency-injection:6.4.* --with symfony/twig-bridge:6.4.* --with symfony/routing:6.4.* --with symfony/cache:6.4.* --with symfony/property-info:6.4.* --with symfony/error-handler:6.4.*
        vendor/bin/phpunit

  # ── Risk: PHP mirror, Rust crate, parity ──────────────────────────
  - name: risk-php
    image: php:8.3-cli
    environment:
      KC_REDIS_URL: redis://redis:6379
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev unzip git
        docker-php-ext-install -j"$(nproc)" gmp
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - |
        set -euo pipefail
        cd packages/kiwicaptcha-risk-php
        composer install --no-interaction --prefer-dist
        vendor/bin/phpunit

  - name: risk-rust
    image: rust:1.96
    commands:
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git
        rustup component add rustfmt clippy || true
        cd packages/kiwicaptcha-risk
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings
        cargo test

  - name: risk-parity
    image: php:8.3-cli
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev unzip git curl
        docker-php-ext-install -j"$(nproc)" gmp
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
        . "$HOME/.cargo/env"
        cd packages/kiwicaptcha-risk-php
        composer install --no-interaction --prefer-dist
        PHP_HASH="$(php tools/fixture_hash.php)"
        cd ../kiwicaptcha-risk
        RUST_HASH="$(cargo run --quiet --example fixture_hash)"
        echo "php=$PHP_HASH rust=$RUST_HASH"
        test "$PHP_HASH" = "$RUST_HASH"
        echo "risk fixture hashes identical"

  # ── Rust core ─────────────────────────────────────────────────────
  - name: rust-workspace
    image: rust:1.96
    commands:
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git
        rustup component add rustfmt clippy || true
        rustup target add wasm32-unknown-unknown || true
        cargo fmt --check
        cargo clippy --workspace --all-targets -- -D warnings
        cargo test --workspace
        cargo test -p kiwicaptcha --example quickstart
        cargo package --locked --manifest-path packages/kiwicaptcha/Cargo.toml
      - |
        set -euo pipefail
        cd packages/kiwicaptcha-wasm
        cargo build --target wasm32-unknown-unknown
      - |
        set -euo pipefail
        cargo install cargo-audit --version 0.22.2 --locked
        cargo audit

  - name: rust-redis-verify
    image: rust:1.96
    environment:
      KC_REDIS_URL: redis://redis:6379
    commands:
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq git
        cargo test --features redis --test redis_verify

  # ── Cross-language (PHP <-> Rust, shared Redis) ───────────────────
  # The records are written into the workspace (.ci-cross-language/), so
  # they survive across the per-step containers; the PHP steps install
  # the vendor into the workspace, which later steps reuse.
  - name: cross-language-php-issue
    image: php:8.3-cli
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev libsodium-dev unzip git
        docker-php-ext-install -j"$(nproc)" gmp sodium
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        mkdir -p .ci-cross-language
        cd packages/kiwicaptcha-php
        composer install --no-interaction --prefer-dist
        KC_PHP_RECORD=../../.ci-cross-language/php-sha.json KC_PHP_ALGO=sha256 php tests/CrossLanguageIssue.php
        KC_PHP_RECORD=../../.ci-cross-language/php-argon.json KC_PHP_ALGO=argon2id php tests/CrossLanguageIssue.php
        KC_PHP_RECORD=../../.ci-cross-language/php-rsw.json KC_PHP_ALGO=rsw php tests/CrossLanguageIssue.php
      - |
        set -euo pipefail
        test -s .ci-cross-language/php-sha.json
        test -s .ci-cross-language/php-argon.json
        test -s .ci-cross-language/php-rsw.json

  - name: cross-language-rust-verify
    image: php:8.3-cli
    depends_on: [cross-language-php-issue]
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev libsodium-dev unzip git curl
        docker-php-ext-install -j"$(nproc)" gmp sodium
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
        . "$HOME/.cargo/env"
        KC_PHP_RECORD=.ci-cross-language/php-sha.json cargo test --test cross_language rust_verifies_php_issued_record -- --nocapture
        KC_PHP_RECORD=.ci-cross-language/php-argon.json cargo test --test cross_language rust_verifies_php_issued_record -- --nocapture
        KC_PHP_RSW_RECORD=.ci-cross-language/php-rsw.json cargo test --test cross_language rust_verifies_php_issued_rsw_record -- --nocapture

  - name: cross-language-rust-issue-and-redis
    image: php:8.3-cli
    environment:
      KC_REDIS_URL: redis://redis:6379
      TEST_REDIS_URL: redis://redis:6379
    depends_on: [cross-language-rust-verify]
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev libsodium-dev unzip git curl
        docker-php-ext-install -j"$(nproc)" gmp sodium
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
        . "$HOME/.cargo/env"
        KC_RUST_RECORD=.ci-cross-language/rust-sha.json cargo test --test cross_language rust_issues_record_for_php -- --nocapture
        KC_RUST_RECORD=.ci-cross-language/rust-argon.json KC_RUST_ALGO=argon2id cargo test --test cross_language rust_issues_record_for_php -- --nocapture
        KC_RUST_RSW_RECORD=.ci-cross-language/rust-rsw.json cargo test --test cross_language rust_issues_rsw_record_for_php -- --nocapture
        KC_RUST_RECORD=.ci-cross-language/rust-v4.json KC_RUST_ALGO=sha256 cargo test --features redis --test cross_language rust_issues_v4_execution_record_for_php -- --nocapture
        cargo test --features redis --test cross_language redis_runtime_state_interop_with_php -- --nocapture
        cargo test --features redis --test cross_language redis_v3_decoy_interop_with_php -- --nocapture
        cargo test --features redis --test cross_language redis_v4_execution_interop_with_php -- --nocapture
        cargo test --features redis --test cross_language redis_rsw_interop_with_php -- --nocapture

  - name: cross-language-php-verify
    image: php:8.3-cli
    depends_on: [cross-language-rust-issue-and-redis]
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev libsodium-dev unzip git
        docker-php-ext-install -j"$(nproc)" gmp sodium
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        cd packages/kiwicaptcha-php
        composer install --no-interaction --prefer-dist
        KC_RUST_RECORD=../../.ci-cross-language/rust-sha.json php tests/CrossLanguageVerify.php
        KC_RUST_RECORD=../../.ci-cross-language/rust-argon.json php tests/CrossLanguageVerify.php
        KC_RUST_RECORD=../../.ci-cross-language/rust-rsw.json php tests/CrossLanguageVerify.php
        KC_RUST_RECORD=../../.ci-cross-language/rust-v4.json php tests/CrossLanguageVerify.php
        KC_RUST_RECORD=../../.ci-cross-language/rust-v4.json KC_RUST_EXPECT_TAMPER=1 php tests/CrossLanguageVerify.php


  # ── Release-validator mutation suites + perf validator ────────────
  - name: validator-mutation-suites
    image: node:22-alpine
    commands:
      - apk add --no-cache bash git
      - node tools/ci/test-validate-release-baseline.mjs
      - node tools/ci/test-validate-autofill-qualification.mjs

  - name: perf-budget
    image: php:8.3-cli
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq libgmp-dev unzip git brotli curl
        docker-php-ext-install -j"$(nproc)" gmp
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        curl -sL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz | tar -xJ -C /usr/local --strip-components=1
      - |
        set -euo pipefail
        (cd packages/kiwicaptcha-php && composer install --no-interaction --prefer-dist)
        (cd packages/kiwicaptcha-risk-php && composer install --no-interaction --prefer-dist)
        bash packages/kiwicaptcha/tools/perf-budget.sh
        if ! node tools/ci/validate-release-baseline.mjs tools/client-perf/results/baseline.json; then
          echo "gate_failed" > /tmp/kiwicaptcha-release-baseline-gate-failed
        fi
      - |
        set -euo pipefail
        php packages/kiwicaptcha/tools/perf-bench.php || true
        php packages/kiwicaptcha/tools/perf-bench.php --redis || true
        php packages/kiwicaptcha/tools/perf-bench.php --argon || true
        php packages/kiwicaptcha/tools/perf-bench-risk.php || true
        php packages/kiwicaptcha/tools/perf-wait.php || true
        if [ -f /tmp/kiwicaptcha-release-baseline-gate-failed ]; then
          echo "release-baseline validator refused the committed evidence (see above)" >&2
          exit 1
        fi
        echo "perf budgets + validator OK"
