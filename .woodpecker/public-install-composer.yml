# Woodpecker CI: the public Composer installation proof (mirrors
# .github/workflows/public-install-smoke.yml, composer-smoke). Manual
# event only: it proves the published packagist + Flex recipe journey
# and is fail-closed until those artifacts exist. Provide
# the bundle version through the kiwicaptcha_bundle_version repo
# secret; the lane writes the documented minimum
# configuration against the Redis service, requires
# kiwicaptcha:doctor to exit cleanly, serves the application and drives
# issue -> solve -> verify in a headless browser, then repeats the
# boot/doctor/page path after uninstall -> reinstall -> update. The
# server-dependent steps run in ONE step (a background server does not
# survive between Woodpecker steps), and the clean-room app lives
# under .ci-run-tmp/ in the workspace.
when:
- event:
  - manual
services:
  redis:
    image: redis:7-alpine
steps:
- name: install-the-symfony-cli-(versioned-release,-sha256-pinned)
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -euo pipefail
      curl -fsSL -o /tmp/symfony-cli.tar.gz \
        "https://github.com/symfony-cli/symfony-cli/releases/download/v$${SYMFONY_CLI_VERSION}/symfony-cli_linux_amd64.tar.gz"
      echo "$${SYMFONY_CLI_SHA256}  /tmp/symfony-cli.tar.gz" | sha256sum -c -
      mkdir -p "$$HOME/.symfony5/bin"
      tar -xzf /tmp/symfony-cli.tar.gz -C "$$HOME/.symfony5/bin" symfony
      "$$HOME/.symfony5/bin/symfony" --version
      echo "$$HOME/.symfony5/bin" >> "$$GITHUB_PATH"

  environment:
    SYMFONY_CLI_VERSION: 5.20.0
    SYMFONY_CLI_SHA256: f50bfbbc1825a2f12a125ea4391f6f7c5b3d7e656901aeeeece0dd8bba135f36
- name: create-the-empty-lts-application-(--webapp)
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - 'set -euo pipefail

    symfony new kiwi-smoke --version=lts --webapp

    '
- name: require-the-bundle-from-packagist-(no-path-repository)
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - 'set -euo pipefail

    composer require "bel-consulting/kiwicaptcha-symfony:$$BUNDLE_VERSION" --no-interaction --no-progress

    composer show bel-consulting/kiwicaptcha-symfony

    '
  environment:
    BUNDLE_VERSION:
      from_secret: kiwicaptcha_bundle_version
- name: the-application-boots-(console-about)
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - php bin/console about
- name: write-the-documented-minimum-configuration-(secret,-public-u
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -euo pipefail
      {
        echo "KIWI_SECRET_KEY=$${KIWI_SECRET_KEY}"
        echo "KIWI_PUBLIC_URL=http://127.0.0.1:8000"
        echo "KIWI_REDIS_DSN=redis://127.0.0.1:6379/0"
      } >> .env.local
      cat .env.local

  environment:
    KIWI_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
- name: kiwicaptcha:doctor-must-exit-cleanly-on-the-documented-minim
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - 'set -euo pipefail

    php bin/console kiwicaptcha:doctor

    echo "doctor: exit 0 (clean) on the documented minimum configuration"

    '
- name: the-flex-recipe-delivered-the-starter-config-and-the-routes
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -euo pipefail
      test -f config/packages/kiwicaptcha.yaml \
        || { echo "the Flex recipe has not been applied (checklist steps 4-5 outstanding)"; exit 1; }
      php bin/console debug:router | grep -q kiwicaptcha \
        || { echo "the recipe's kiwicaptcha routes are missing"; exit 1; }
      echo "recipe config + routes present"

- name: add-the-demo-page-(form-widget)-to-the-smoke-application
  image: php:8.3-cli
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -euo pipefail
      mkdir -p src/Form src/Controller templates
      cat > src/Form/CaptchaDemoType.php <<'PHP'
      <?php

      namespace App\Form;

      use BelConsulting\KiwiCaptchaBundle\Form\Type\KiwiCaptchaType;
      use Symfony\Component\Form\AbstractType;
      use Symfony\Component\Form\FormBuilderInterface;

      final class CaptchaDemoType extends AbstractType
      {
          public function buildForm(FormBuilderInterface $$builder, array $$options): void
          {
              $$builder->add('captcha', KiwiCaptchaType::class, ['scope' => 'login']);
          }
      }
      PHP
      cat > src/Form/CaptchaDemoInput.php <<'PHP'
      <?php

      namespace App\Form;

      use Symfony\Component\Validator\Constraints as Assert;

      final class CaptchaDemoInput
      {
          #[Assert\NotBlank]
          public ?string $$captcha = null;
      }
      PHP
      cat > src/Controller/CaptchaDemoController.php <<'PHP'
      <?php

      namespace App\Controller;

      use App\Form\CaptchaDemoInput;
      use App\Form\CaptchaDemoType;
      use Symfony\Bundle\FrameworkBundle\Controller\AbstractController;
      use Symfony\Component\HttpFoundation\Request;
      use Symfony\Component\HttpFoundation\Response;
      use Symfony\Component\Routing\Attribute\Route;

      final class CaptchaDemoController extends AbstractController
      {
          #[Route('/captcha-demo', name: 'captcha_demo', methods: ['GET', 'POST'])]
          public function __invoke(Request $$request): Response
          {
              $$form = $$this->createForm(CaptchaDemoType::class, new CaptchaDemoInput());
              $$form->handleRequest($$request);
              $$result = null;
              if ($$form->isSubmitted()) {
                  $$result = json_encode([
                      'ok' => $$form->isValid(),
                      'errors' => array_map(
                          static fn ($$violation): string => (string) $$violation->getMessage(),
                          iterator_to_array($$form->getErrors(true)),
                      ),
                  ], JSON_THROW_ON_ERROR);
              }

              return $$this->render('captcha_demo.html.twig', ['form' => $$form, 'result' => $$result]);
          }
      }
      PHP
      cat > templates/captcha_demo.html.twig <<'TWIG'
      <!doctype html>
      <html lang="en">
      <head><meta charset="utf-8"><title>KiwiCaptcha smoke</title></head>
      <body{% if result %} data-result="{{ result|e('html_attr') }}"{% endif %}>
      {{ form_start(form) }}
      {{ form_widget(form) }}
      <button id="demo-submit" type="submit">Verify</button>
      {{ form_end(form) }}
      </body>
      </html>
      TWIG
      cat > config/packages/kiwicaptcha_widget.yaml <<'YAML'
      twig:
          form_themes:
              - '@KiwiCaptcha/form_div_layout.html.twig'
      YAML
      php bin/console cache:clear
      php bin/console debug:router | grep -q captcha_demo
      echo "demo page wired"

- name: application-journey-and-reinstall-cycle
  image: php:8.3-cli
  environment:
    BUNDLE_VERSION:
      from_secret: kiwicaptcha_bundle_version
  commands:
  - set -euo pipefail
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -euo pipefail
      symfony serve --no-tls --port=8000 --daemon
      for _ in $$(seq 1 60); do
        if curl -fsS http://127.0.0.1:8000/captcha-demo > /dev/null; then
          echo "application server answering on 127.0.0.1:8000"
          exit 0
        fi
        sleep 1
      done
      echo "application server did not answer in 60 s" >&2
      exit 1

  - |
      set -euo pipefail
      npm init -y > /dev/null
      npm install --no-audit --no-fund playwright@1.62.1 > /dev/null
      npx playwright install --with-deps chromium > /dev/null
      cat > e2e.mjs <<'JS'
      import { chromium } from 'playwright';

      const base = 'http://127.0.0.1:8000';
      const browser = await chromium.launch();
      const page = await browser.newPage();
      page.on('console', (message) => console.log('[browser]', message.type(), message.text()));
      await page.goto(`$${base}/captcha-demo`, { waitUntil: 'load' });
      await page.waitForSelector('.kiwi-widget[data-state="verified"]', { timeout: 180000 });
      const token = await page.locator('input[data-kiwi-token]').first().inputValue();
      if (!token) {
        throw new Error('the widget reached verified without writing a token');
      }
      await page.click('#demo-submit');
      await page.waitForFunction(() => document.body.dataset.result !== undefined, { timeout: 60000 });
      const result = JSON.parse(await page.evaluate(() => document.body.dataset.result));
      if (result.ok !== true) {
        throw new Error(`server-side verification refused the token: $${JSON.stringify(result)}`);
      }
      console.log(`issue -> solve -> verify OK (token bytes: $${token.length})`);
      await browser.close();
      JS
      node e2e.mjs

  - 'set -euo pipefail

    composer remove bel-consulting/kiwicaptcha-symfony --no-interaction

    composer require "bel-consulting/kiwicaptcha-symfony:$$BUNDLE_VERSION" --no-interaction --no-progress

    php bin/console about

    php bin/console kiwicaptcha:doctor

    composer update bel-consulting/kiwicaptcha-symfony --no-interaction --no-progress

    php bin/console about

    php bin/console kiwicaptcha:doctor

    curl -fsS http://127.0.0.1:8000/captcha-demo > /dev/null

    echo "uninstall -> reinstall -> update cycle OK (boot, doctor and demo page after each step)"

    '
  - 'set -euo pipefail

    test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/kiwicaptcha-wasm.js

    test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/widget-driver.js

    test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/widget-risk.js

    test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/widget-telemetry.js

    test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/widget-locales.js

    test -s vendor/bel-consulting/kiwicaptcha-symfony/Resources/public/widget-compat.js

    echo "bundle assets present in the installed package"

    '
