# Woodpecker CI: the browser lanes (mirrors .github/workflows/ci.yml
# jobs `browser` and `browser-a11y`). The Playwright image carries the
# three engines for the pinned lockfile version; PHP is installed for
# the fixture router, which serves /kiwi-captcha/api.js and
# /kiwi-captcha/widget.css through the real Symfony controller.
labels:
  capability: docker
when:
  - event: [push, pull_request, tag, manual]

steps:
  - name: browser-native-chromium
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    commands:
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq php8.3-cli php8.3-gmp php8.3-sodium php8.3-mbstring php8.3-xml php8.3-curl unzip git
        php -r 'if (!extension_loaded("gmp")) { fwrite(STDERR, "gmp missing\n"); exit(1); }'
        EXPECTED="$$(php8.3 -r 'copy("https://composer.github.io/installer.sig", "php://stdout");')"
        php8.3 -r "copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');"
        ACTUAL="$$(php8.3 -r "echo hash_file('sha384', '/tmp/composer-setup.php');")"
        [ "$$EXPECTED" = "$$ACTUAL" ] || { echo "composer installer checksum mismatch" >&2; exit 1; }
        php8.3 /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
        rm -f /tmp/composer-setup.php
      - |
        set -euo pipefail
        cd packages/kiwicaptcha-php
        composer install --no-interaction --prefer-dist
        cd ../kiwicaptcha/integrations/symfony
        composer install --no-interaction --prefer-dist --no-scripts
      - |
        set -euo pipefail
        cd tests/browser
        npm ci --no-audit --no-fund
        npx playwright test

  - name: browser-a11y-three-engines
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    depends_on: [browser-native-chromium]
    commands:
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq php8.3-cli php8.3-gmp php8.3-sodium php8.3-mbstring php8.3-xml php8.3-curl unzip git
        EXPECTED="$$(php8.3 -r 'copy("https://composer.github.io/installer.sig", "php://stdout");')"
        php8.3 -r "copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');"
        ACTUAL="$$(php8.3 -r "echo hash_file('sha384', '/tmp/composer-setup.php');")"
        [ "$$EXPECTED" = "$$ACTUAL" ] || { echo "composer installer checksum mismatch" >&2; exit 1; }
        php8.3 /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
        rm -f /tmp/composer-setup.php
      - |
        set -euo pipefail
        cd packages/kiwicaptcha-php
        composer install --no-interaction --prefer-dist
        cd ../kiwicaptcha/integrations/symfony
        composer install --no-interaction --prefer-dist --no-scripts
      - |
        set -euo pipefail
        cd tests/browser
        npm ci --no-audit --no-fund
        npx playwright test --config=playwright.a11y.config.mjs
