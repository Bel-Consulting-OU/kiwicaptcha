# Woodpecker CI: the Docker reference-deployment e2e (mirrors the
# GitHub job docker-reference-deployment). The step scripts are the
# same commands; the docker CLI talks to the agent's daemon through
# the mounted socket, so the agent must allow the socket volume. The
# compose stack and the scratch files under .ci-run-tmp/ live in the
# shared workspace (Woodpecker steps do not share /tmp); paths inside
# the captcha container stay /tmp. The deploy compose stack, the
# /healthz wait, the solve/verify/replay journey, the F1
# algorithm-ownership tables, the F2 request-binding table and the
# restart-persistence pass all run here exactly as in the primary
# pipeline.
when:
- event:
  - push
  - pull_request
  - tag
  - manual
steps:
- name: docker-build-the-deploy-image
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - docker build -f deploy/Dockerfile -t kiwicaptcha/reference-deployment .
- name: write-a-fresh-random-secret-to-deploy/.env
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - 'set -euo pipefail

    umask 077

    printf ''KIWI_SECRET_KEY=%s\n'' "$(openssl rand -hex 32)" > .env

    printf ''KIWI_SHA_TARGET_BITS=8\n'' >> .env

    # The Valkey requirepass credential of the compose stack: a

    # fresh random value, generated once here and preserved by

    # every later .env rewrite in this lane.

    printf ''VALKEY_PASSWORD=%s\n'' "$(openssl rand -hex 16)" >> .env'
- name: docker-compose-up-(valkey-+-captcha)
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - docker compose up -d
- name: retry-/healthz-until-200
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\nfor attempt in $(seq 1 60); do\n  if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then\n    echo \"healthz answered 200 on attempt $attempt\"\n    exit 0\n  fi\n  sleep 2\ndone\ndocker compose ps\ndocker compose logs captcha\necho \"healthz never answered 200 within 120s\" >&2\nexit 1"
- name: post-/challenge-and-capture-the-challenge-document
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\ncurl -fsS -o $CI_WORKSPACE/.ci-run-tmp/challenge.json -X POST -H 'Content-Type: application/json' \\\n  -d '{\"scope\":\"login\"}' http://127.0.0.1:8080/challenge"
- name: solve-the-sha-256-proof-inside-the-captcha-container
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - 'set -euo pipefail

    docker compose cp $CI_WORKSPACE/.ci-run-tmp/$CI_WORKSPACE/.ci-run-tmp/challenge.json captcha:/tmp/challenge.json

    docker compose exec -T captcha php /srv/kiwicaptcha/deploy/app/solve.php /tmp/challenge.json > /tmp/token.txt

    test -s $CI_WORKSPACE/.ci-run-tmp/token.txt

    printf ''%s'' "$(tr -d ''\r\n'' < $CI_WORKSPACE/.ci-run-tmp/token.txt)" > $CI_WORKSPACE/.ci-run-tmp/token-clean.txt'
- name: post-/verify-with-the-solved-token-(success)
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\nTOKEN=\"$(cat $CI_WORKSPACE/.ci-run-tmp/token-clean.txt)\"\ncurl -fsS -X POST -H 'Content-Type: application/json' \\\n  -d \"{\\\"token\\\":\\\"$TOKEN\\\",\\\"scope\\\":\\\"login\\\"}\" \\\n  http://127.0.0.1:8080/verify | tee $CI_WORKSPACE/.ci-run-tmp/verify1.json\nphp -r 'exit(json_decode(file_get_contents(\"$CI_WORKSPACE/.ci-run-tmp/verify1.json\"), true)[\"ok\"] === true ? 0 : 1);'"
- name: post-the-same-/verify-again-(replay-rejection)
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\nTOKEN=\"$(cat $CI_WORKSPACE/.ci-run-tmp/token-clean.txt)\"\ncurl -fsS -X POST -H 'Content-Type: application/json' \\\n  -d \"{\\\"token\\\":\\\"$TOKEN\\\",\\\"scope\\\":\\\"login\\\"}\" \\\n  http://127.0.0.1:8080/verify | tee $CI_WORKSPACE/.ci-run-tmp/replay.json\n# shellcheck disable=SC2016 # PHP variables inside single-quoted code\nphp -r '$d = json_decode(file_get_contents(\"$CI_WORKSPACE/.ci-run-tmp/replay.json\"), true); exit($d[\"ok\"] === false && $d[\"code\"] === \"already_consumed\" ? 0 : 1);'"
- name: f1-algorithm-ownership-table-(sha256-profile-rows)
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\nchallenge_row() {  # $1 = request body; asserts a 200 challenge\n  curl -fsS -X POST -H 'Content-Type: application/json' \\\n    -d \"$1\" http://127.0.0.1:8080/challenge > $CI_WORKSPACE/.ci-run-tmp/f1-challenge.json\n}\nchallenge_row '{\"scope\":\"login\"}'\ngrep -q '\"algorithm\":\"sha256\"' $CI_WORKSPACE/.ci-run-tmp/f1-challenge.json\nchallenge_row '{\"scope\":\"login\",\"algorithm\":\"sha256\"}'\ngrep -q '\"algorithm\":\"sha256\"' $CI_WORKSPACE/.ci-run-tmp/f1-challenge.json\n# The field stays accepted but only validated: a nonsense value\n# is refused with a 422 before any issuance.\nSTATUS=\"$(curl -sS -o $CI_WORKSPACE/.ci-run-tmp/f1-invalid.json -w '%{http_code}' -X POST \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"scope\":\"login\",\"algorithm\":\"nonsense\"}' \\\n  http://127.0.0.1:8080/challenge)\"\ntest \"$STATUS\" = \"422\"\ngrep -q '\"code\":\"INVALID_ALGORITHM\"' $CI_WORKSPACE/.ci-run-tmp/f1-invalid.json"
- name: f1-algorithm-ownership-table-(argon2id-profile-rows)
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\nSECRET=\"$(sed -n 's/^KIWI_SECRET_KEY=//p' .env | head -1)\"\nVALKEY_PASSWORD=\"$(sed -n 's/^VALKEY_PASSWORD=//p' .env | head -1)\"\ntest -n \"$SECRET\"\ntest -n \"$VALKEY_PASSWORD\"\n{\n  printf 'KIWI_SECRET_KEY=%s\\n' \"$SECRET\"\n  printf 'KIWI_SHA_TARGET_BITS=8\\n'\n  printf 'KIWI_ALGORITHM=argon2id\\n'\n  printf 'VALKEY_PASSWORD=%s\\n' \"$VALKEY_PASSWORD\"\n} > .env\ndocker compose up -d --force-recreate captcha\nfor attempt in $(seq 1 60); do\n  if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then\n    echo \"healthz answered 200 on attempt $attempt under the argon2id profile\"\n    break\n  fi\n  sleep 1\ndone\ntest \"$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)\" = \"200\"\nfor body in '{\"scope\":\"login\"}' '{\"scope\":\"login\",\"algorithm\":\"argon2id\"}' \\\n  '{\"scope\":\"login\",\"algorithm\":\"sha256\"}'; do\n  curl -fsS -X POST -H 'Content-Type: application/json' -d \"$body\" \\\n    http://127.0.0.1:8080/challenge > $CI_WORKSPACE/.ci-run-tmp/f1-challenge.json\n  grep -q '\"algorithm\":\"argon2id\"' $CI_WORKSPACE/.ci-run-tmp/f1-challenge.json\ndone"
- name: f1-algorithm-ownership-table-(rsw-profile-rows)
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\nSECRET=\"$(sed -n 's/^KIWI_SECRET_KEY=//p' .env | head -1)\"\ntest -n \"$SECRET\"\n# The committed rsw fixture pair (packages/kiwicaptcha-php\n# tests/Support/RswFixture.php) supplies the trapdoor values\n# for the CI-only profile rows; the container's php reads them.\ndocker compose cp ../packages/kiwicaptcha-php/tests/Support/RswFixture.php \\\n  captcha:/tmp/RswFixture.php\nMODULUS_N=\"$(docker compose exec -T captcha php -r \\\n  'require \"$CI_WORKSPACE/.ci-run-tmp/RswFixture.php\"; echo \\KiwiCaptcha\\Tests\\Support\\RswFixture::MODULUS_N_B64;')\"\nLAMBDA=\"$(docker compose exec -T captcha php -r \\\n  'require \"$CI_WORKSPACE/.ci-run-tmp/RswFixture.php\"; echo \\KiwiCaptcha\\Tests\\Support\\RswFixture::LAMBDA_B64;')\"\ntest -n \"$MODULUS_N\"\ntest -n \"$LAMBDA\"\nVALKEY_PASSWORD=\"$(sed -n 's/^VALKEY_PASSWORD=//p' .env | head -1)\"\ntest -n \"$VALKEY_PASSWORD\"\n{\n  printf 'KIWI_SECRET_KEY=%s\\n' \"$SECRET\"\n  printf 'KIWI_SHA_TARGET_BITS=8\\n'\n  printf 'KIWI_ALGORITHM=rsw\\n'\n  printf 'KIWI_RSW_MODULUS_N=%s\\n' \"$MODULUS_N\"\n  printf 'KIWI_RSW_LAMBDA=%s\\n' \"$LAMBDA\"\n  printf 'VALKEY_PASSWORD=%s\\n' \"$VALKEY_PASSWORD\"\n} > .env\ndocker compose up -d --force-recreate captcha\nfor attempt in $(seq 1 60); do\n  if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then\n    echo \"healthz answered 200 on attempt $attempt under the rsw profile\"\n    break\n  fi\n  sleep 1\ndone\ntest \"$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)\" = \"200\"\nfor body in '{\"scope\":\"login\",\"algorithm\":\"sha256\"}' \\\n  '{\"scope\":\"login\",\"algorithm\":\"argon2id\"}'; do\n  curl -fsS -X POST -H 'Content-Type: application/json' -d \"$body\" \\\n    http://127.0.0.1:8080/challenge > $CI_WORKSPACE/.ci-run-tmp/f1-challenge.json\n  grep -q '\"algorithm\":\"rsw\"' $CI_WORKSPACE/.ci-run-tmp/f1-challenge.json\ndone"
- name: f1-table-done:-restore-the-default-sha256-profile
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\nSECRET=\"$(sed -n 's/^KIWI_SECRET_KEY=//p' .env | head -1)\"\nVALKEY_PASSWORD=\"$(sed -n 's/^VALKEY_PASSWORD=//p' .env | head -1)\"\ntest -n \"$SECRET\"\ntest -n \"$VALKEY_PASSWORD\"\n{\n  printf 'KIWI_SECRET_KEY=%s\\n' \"$SECRET\"\n  printf 'KIWI_SHA_TARGET_BITS=8\\n'\n  printf 'VALKEY_PASSWORD=%s\\n' \"$VALKEY_PASSWORD\"\n} > .env\ndocker compose up -d --force-recreate captcha\nfor attempt in $(seq 1 60); do\n  if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then\n    echo \"healthz answered 200 on attempt $attempt after the profile restore\"\n    break\n  fi\n  sleep 1\ndone\ntest \"$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)\" = \"200\""
- name: f2-request-binding-table-(real-/verify,-one-challenge-per-ro
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\nissue() {  # $1 = issue binding (empty = unbound)\n  local body='{\"scope\":\"login\"}'\n  if [ -n \"$1\" ]; then\n    body=\"{\\\"scope\\\":\\\"login\\\",\\\"request_binding\\\":\\\"$1\\\"}\"\n  fi\n  curl -fsS -X POST -H 'Content-Type: application/json' -d \"$body\" \\\n    http://127.0.0.1:8080/challenge > $CI_WORKSPACE/.ci-run-tmp/f2-challenge.json\n  docker compose cp $CI_WORKSPACE/.ci-run-tmp/$CI_WORKSPACE/.ci-run-tmp/f2-challenge.json captcha:/tmp/f2-challenge.json\n  docker compose exec -T captcha php /srv/kiwicaptcha/deploy/app/solve.php \\\n    $CI_WORKSPACE/.ci-run-tmp/f2-challenge.json > $CI_WORKSPACE/.ci-run-tmp/f2-token.txt\n  test -s $CI_WORKSPACE/.ci-run-tmp/f2-token.txt\n  tr -d '\\r\\n' < $CI_WORKSPACE/.ci-run-tmp/f2-token.txt > $CI_WORKSPACE/.ci-run-tmp/f2-token-clean.txt\n  sleep 0.15\n}\nverify() {  # $1 = presented binding (empty = absent)\n  local token\n  token=\"$(cat $CI_WORKSPACE/.ci-run-tmp/f2-token-clean.txt)\"\n  local body=\"{\\\"token\\\":\\\"$token\\\",\\\"scope\\\":\\\"login\\\"}\"\n  if [ -n \"$1\" ]; then\n    body=\"{\\\"token\\\":\\\"$token\\\",\\\"scope\\\":\\\"login\\\",\\\"request_binding\\\":\\\"$1\\\"}\"\n  fi\n  curl -sS -X POST -H 'Content-Type: application/json' -d \"$body\" \\\n    http://127.0.0.1:8080/verify > $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\n}\n# Issue bound to txn-A, verify with txn-A -> success.\nissue txn-A\nverify txn-A\ngrep -q '\"ok\":true' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\n# Issue bound to txn-A, verify with txn-B -> request_binding_mismatch.\nissue txn-A\nverify txn-B\ngrep -q '\"ok\":false' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\ngrep -q '\"code\":\"request_binding_mismatch\"' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\n# Issue bound to txn-A, verify with no binding -> request_binding_mismatch.\nissue txn-A\nverify ''\ngrep -q '\"ok\":false' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\ngrep -q '\"code\":\"request_binding_mismatch\"' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\n# Issue unbound, verify with no binding -> success.\nissue ''\nverify ''\ngrep -q '\"ok\":true' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\n# Issue unbound, verify with txn-A -> request_binding_mismatch.\n# The mismatch is the core verifier's own hard cheap-phase\n# verdict, which retires the pending record (one-shot\n# anti-oracle semantics): the same token is then gone.\nissue ''\nverify txn-A\ngrep -q '\"ok\":false' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\ngrep -q '\"code\":\"request_binding_mismatch\"' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\nverify ''\ngrep -q '\"ok\":false' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\ngrep -q '\"code\":\"record_not_found\"' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\n# Correct binding, second redemption -> already_consumed.\nissue txn-A\nverify txn-A\ngrep -q '\"ok\":true' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\nverify txn-A\ngrep -q '\"ok\":false' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\ngrep -q '\"code\":\"already_consumed\"' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\n# One-shot row: a wrong-binding attempt is a hard cheap-phase\n# verdict that retires the pending record, so the same token\n# can never be re-tried against the correct binding. The\n# pinned core outcome of the corrected retry is\n# record_not_found (verified locally against the real core on\n# PHP 8.5: the mismatch answers first, then the record is\n# gone). No adapter-level preflight may keep the record\n# alive for a free retry oracle.\nissue txn-A\nverify txn-B\ngrep -q '\"ok\":false' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\ngrep -q '\"code\":\"request_binding_mismatch\"' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\nverify txn-A\ngrep -q '\"ok\":false' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json\ngrep -q '\"code\":\"record_not_found\"' $CI_WORKSPACE/.ci-run-tmp/f2-verify.json"
- name: restart-the-captcha-container
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - docker compose restart captcha
- name: retry-/healthz-after-the-restart
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\nfor attempt in $(seq 1 60); do\n  if curl -fsS -o /dev/null http://127.0.0.1:8080/healthz; then\n    echo \"healthz answered 200 on attempt $attempt after the restart\"\n    exit 0\n  fi\n  sleep 2\ndone\ndocker compose logs captcha\necho \"healthz never answered 200 after the restart\" >&2\nexit 1"
- name: issue,-solve-and-verify-again-against-the-persistent-store
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - "set -euo pipefail\ncurl -fsS -o $CI_WORKSPACE/.ci-run-tmp/challenge2.json -X POST -H 'Content-Type: application/json' \\\n  -d '{\"scope\":\"login\"}' http://127.0.0.1:8080/challenge\ndocker compose cp $CI_WORKSPACE/.ci-run-tmp/$CI_WORKSPACE/.ci-run-tmp/challenge2.json captcha:/tmp/challenge2.json\ndocker compose exec -T captcha php /srv/kiwicaptcha/deploy/app/solve.php /tmp/challenge2.json > /tmp/token2.txt\nTOKEN2=\"$(tr -d '\\r\\n' < $CI_WORKSPACE/.ci-run-tmp/token2.txt)\"\ntest -n \"$TOKEN2\"\ncurl -fsS -X POST -H 'Content-Type: application/json' \\\n  -d \"{\\\"token\\\":\\\"$TOKEN2\\\",\\\"scope\\\":\\\"login\\\"}\" \\\n  http://127.0.0.1:8080/verify | tee $CI_WORKSPACE/.ci-run-tmp/verify2.json\nphp -r 'exit(json_decode(file_get_contents(\"$CI_WORKSPACE/.ci-run-tmp/verify2.json\"), true)[\"ok\"] === true ? 0 : 1);'"
- name: docker-compose-down
  image: docker:28-cli
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - set -euo pipefail
  - mkdir -p "$CI_WORKSPACE/.ci-run-tmp"
  - docker compose down
