# Woodpecker CI: every platform integration (mirrors the GitHub job
# platform-integrations). The master runner exercises WordPress,
# Drupal, Joomla, phpBB, Flarum, Discourse, Authentik, Zitadel,
# Keycloak, the reverse-proxy gateways and the shared endpoint, and it
# is also the caller of tools/ci/verify-gateway-parity.sh. The Symfony
# migrate leg self-skips when the bundle vendor tree is absent; the
# Symfony lane owns that suite.
labels:
  capability: docker
when:
  - event: [push, pull_request, tag, manual]

steps:
  - name: platform-suites
    image: php:8.3-cli
    commands:
      - |
        set -eu
        apt-get update -qq
        apt-get install -y -qq nginx nodejs npm ruby python3 default-jdk
        # Debian ships the binary as nodejs in some releases; the
        # runners invoke `node`.
        ln -sf /usr/bin/nodejs /usr/local/bin/node 2>/dev/null || true
      - |
        set -eu
        sh integrations-platforms/tests/run-all.sh
