# Woodpecker CI: the public crates.io installation proof (mirrors
# .github/workflows/public-install-smoke.yml, cargo-smoke, both
# published crates). Manual event only and fail-closed until the
# crates exist. Each crate is added at an exact =X.Y.Z pin and the
# resolved package is read back from cargo metadata: exact version, a
# crates.io registry source, no path/git replacement. Provide
# KIWICAPTCHA_VERSION and KIWICAPTCHA_RISK_VERSION.
labels:
  capability: docker
when:
- event:
  - manual
steps:
- name: init-an-empty-crate-in-a-temp-dir-(no-repo-checkout)
  image: rust:1.96
  commands:
  - set -eu
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - 'set -eu

    rm -rf "$$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke"

    cargo init --name kiwi-cargo-smoke "$$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke"

    '
- name: add-the-exact-crates.io-version-(=)-and-check-(no-path,-no-g
  image: rust:1.96
  commands:
  - set -eu
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - |
      set -eu
      cd "$$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke"
      # `=X.Y.Z` is the only requirement that cannot resolve to a
      # newer compatible release: a caret requirement would accept
      # 1.7.1 for a requested 1.7.0 and the smoke would still pass.
      cargo add "$$CRATE@=$$RUST_VERSION"
      cargo check
      cargo tree -p "$$CRATE" --depth 0
      # Read the resolution back: exactly one package of that name,
      # the requested version, a crates.io registry source, and no
      # path/git replacement (a replacement has source null).
      cargo metadata --format-version 1 > "$$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke/meta.json"
      python3 - "$$CRATE" "$$RUST_VERSION" "$$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke/meta.json" <<'PY'
      import json
      import sys

      crate, want, path = sys.argv[1], sys.argv[2], sys.argv[3]
      meta = json.load(open(path))
      named = [p for p in meta['packages'] if p['name'] == crate]
      exact = [p for p in named if p['version'] == want]
      assert len(exact) == 1, (
          f'{crate}@{want} must resolve to exactly one package, got '
          f'{[p["version"] for p in named]}'
      )
      source = exact[0].get('source') or ''
      assert source.startswith('registry+') and 'crates.io' in source, (
          f'{crate}@{want} resolved from {source!r}, not the crates.io registry'
      )
      print(f'cargo smoke: verified {crate}@{want} from {source}')
      PY
      echo "cargo smoke: $$CRATE@$$RUST_VERSION resolved and checked from crates.io"

  environment:
    CRATE: kiwicaptcha
    RUST_VERSION: $${KIWICAPTCHA_VERSION:?set KIWICAPTCHA_VERSION}
- commands:
  - set -eu
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
  - 'set -eu

    rm -rf "$$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke"

    cargo init --name kiwi-cargo-smoke "$$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke"

    '
  image: rust:1.96
  name: risk-init-an-empty-crate-in-a-temp-dir-(no-repo-checkout)
- commands:
  - set -eu
  - mkdir -p "$$CI_WORKSPACE/.ci-run-tmp"
