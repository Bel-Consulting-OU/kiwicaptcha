[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwicaptcha"
version = "1.0.0"
description = "KiwiCaptcha: privacy-first, self-hosted proof-of-work anti-abuse engine for Python. Zero third-party services or tracking; the SHA-256 and RSW proofs verify on the stdlib alone, Argon2id through the native [argon2] extra (or a local verifier sidecar)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bel Consulting OU" }]
requires-python = ">=3.10"
keywords = ["captcha", "proof-of-work", "sha256", "argon2", "security", "privacy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Session",
]
dependencies = []

[project.optional-dependencies]
argon2 = ["argon2-cffi>=23.1.0"]
redis = ["redis>=4.2"]
# The test suite constructs default verifiers, so the native binding
# must be importable when it runs (the no-binding refusals are tested
# through a simulated flag, not a missing install).
test = ["argon2-cffi>=23.1.0"]

[project.urls]
Homepage = "https://kiwicaptcha.dev"

[tool.setuptools.packages.find]
include = ["kiwicaptcha*"]

[tool.setuptools.package-data]
kiwicaptcha = ["py.typed"]
