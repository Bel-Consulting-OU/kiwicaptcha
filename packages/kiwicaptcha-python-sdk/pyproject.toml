[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwicaptcha"
version = "1.0.0"
description = "KiwiCaptcha: privacy-first, self-hosted proof-of-work anti-abuse engine for Python. Zero third-party services or tracking; the SHA-256 and RSW proofs verify on the stdlib alone, Argon2id through the bundled native binding (or a local verifier sidecar)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bel Consulting OU" }]
requires-python = ">=3.10"
keywords = ["captcha", "proof-of-work", "sha256", "argon2", "security", "privacy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Session",
]
dependencies = ["argon2-cffi>=23.1.0"]

[project.optional-dependencies]
# The alias extra: argon2-cffi ships as a core dependency (it publishes
# wheels for every major platform), so a plain `pip install kiwicaptcha`
# verifies every rung the protocol can issue and a SHA-only deployment
# constructs its verifier without any optional install. The extra stays
# so the documented `pip install kiwicaptcha[argon2]` spelling keeps
# working on every deployment that already uses it.
argon2 = []
redis = ["redis>=4.2"]
# Kept for the CI lanes and contributors that install `.[test]`; the
# binding itself rides the core dependency now.
test = []

[project.urls]
Homepage = "https://kiwicaptcha.dev"

[tool.setuptools.packages.find]
include = ["kiwicaptcha*"]

[tool.setuptools.package-data]
kiwicaptcha = ["py.typed"]
