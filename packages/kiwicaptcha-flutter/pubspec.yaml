name: kiwicaptcha
description: Flutter KiwiCaptcha widget plus the Dart solver (FFI to the Rust core) with a pure-Dart SHA-256 fallback for low-difficulty challenges.
version: 0.1.0
homepage: https://kiwicaptcha.dev

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
