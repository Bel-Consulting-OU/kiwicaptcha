# The KiwiCaptcha product website. Static output only: no JavaScript,
# no external asset hosts, no feeds and no search index. The design
# source of truth is KiwiCaptcha_Website.pdf (edition 4) and the
# identity contract in packages/kiwicaptcha/design/IDENTITY.md.
base_url = "/"
title = "KiwiCaptcha"
description = "Self-hosted adaptive anti-abuse with first-class hosts on machine-checked parity with the Rust core."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false
minify_html = true

[markdown]
render_emoji = false

