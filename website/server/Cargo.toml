[package]
name = "kiwicaptcha-website"
version = "1.0.0"
edition = "2021"
description = "Static file server for the Zola-built KiwiCaptcha product website: no JavaScript, self-hosted assets only."
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[dev-dependencies]
http-body-util = "0.1"
