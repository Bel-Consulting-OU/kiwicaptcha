<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>red-team widget page</title>
<script src="__URL_runtime__" integrity="__SRI_runtime__" crossorigin="anonymous"></script>
<script src="__URL_driver__" integrity="__SRI_driver__" crossorigin="anonymous"></script>
</head>
<body>
<div id="host">
<form id="the-form" action="/form-submit" method="post">
<div class="kiwi-container"
     data-kiwi-scope="login"
     data-kiwi-endpoint="/challenge"
     data-kiwi-runtime-src="__URL_runtime__" data-kiwi-runtime-integrity="__SRI_runtime__"
     data-kiwi-worker-src="__URL_worker__" data-kiwi-worker-integrity="__SRI_worker__"
     data-kiwi-risk-src="__URL_risk__" data-kiwi-risk-integrity="__SRI_risk__"
     data-kiwi-telemetry-src="__URL_telemetry__" data-kiwi-telemetry-integrity="__SRI_telemetry__"
     data-kiwi-execution-src="__URL_execution__" data-kiwi-execution-integrity="__SRI_execution__"
     data-kiwi-telemetry="1">
<input type="hidden" name="kiwi__token" data-kiwi-token value="">
<div class="kiwi-widget" data-kiwi-widget data-state="idle" role="status" aria-live="polite">
<div class="kiwi-icon-wrapper"><svg></svg><div class="kiwi-glow"></div></div>
<div class="kiwi-main">
<div class="kiwi-top"><span class="kiwi-label" data-kiwi-label>Security Check</span><span data-kiwi-badge class="kiwi-badge">Idle</span></div>
<div class="kiwi-track" aria-hidden="true"><div class="kiwi-bar" data-kiwi-bar></div></div>
<div class="kiwi-bottom"><p class="kiwi-info" data-kiwi-info>Protected</p><span class="kiwi-timer" data-kiwi-timer></span></div>
</div></div></div></form>
</div>
<p id="out"></p>

<script>
// The service-worker MITM fixture: this page registers the campaign's
// worker, which rewrites every widget asset response with tampered
// bytes. The widget's integrity attributes must refuse them and the
// widget must fail closed.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(() => {
    document.title = 'sw-registered';
  }).catch((err) => {
    document.title = 'sw-refused:' + err.name;
  });
}
</script>
</body>
</html>
