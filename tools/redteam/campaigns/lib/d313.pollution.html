</div></div></div></form>

<script>
// The hostile host page: prototype pollution lands before and during
// the widget's work; the DOM clobbering shadows the driver's name
// spaces. The required result: the driver survives and solves; any
// observable breakage is reported as a finding.
try {
  (Object.prototype).__kiwiPolluted = 'polluted';
  (Object.prototype).kiwiMode = 'attacker';
  (Object.prototype).dataState = 'done';
} catch (e) {}
window.name = '{"kiwiConfig":{"mode":"attacker"}}';
document.addEventListener('DOMContentLoaded', () => {
  try {
    const mk = (tag, id) => { const el = document.createElement(tag); el.id = id; document.body.appendChild(el); return el; };
    mk('div', 'kiwiWidgets');
    mk('div', 'kiwiCaptcha');
    mk('form', 'kiwiForm');
  } catch (e) {}
  setInterval(() => {
    try { (Object.prototype).kiwiMode = 'attacker'; } catch (e) {}
  }, 500);
});
