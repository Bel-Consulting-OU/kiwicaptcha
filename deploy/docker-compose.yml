# The KiwiCaptcha reference deployment: the reference image plus Valkey
# (the Redis-compatible store the core targets). The captcha service
# reads EVERY secret and knob from the environment or from deploy/.env
# (see deploy/.env.example and deploy/README.md); no secret is
# committed. Valkey keeps its data in the named volume below, so the
# challenge records survive a captcha container restart. Valkey answers
# only with the requirepass credential, and the store network is
# internal: Valkey has no route off the docker network, while the
# captcha port stays published for the widget.
services:
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in the environment or deploy/.env (any non-empty random string, e.g. openssl rand -hex 16)}"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in the environment or deploy/.env}
    volumes:
      - valkey-data:/data
    networks:
      - kiwi-store
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 2s
      retries: 10

  captcha:
    image: kiwicaptcha/reference-deployment
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # KC_REDIS_URL is the challenge-store connection of the core, the
      # same variable the CI real-Redis lanes publish, carrying the
      # Valkey credential.
      KC_REDIS_URL: "redis://:${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in the environment or deploy/.env}@valkey:6379"
      # Required: at least 32 bytes of random data. The :? form fails
      # the compose up when the variable is missing from the
      # environment or deploy/.env.
      KIWI_SECRET_KEY: "${KIWI_SECRET_KEY:?KIWI_SECRET_KEY must be set in the environment or deploy/.env (at least 32 bytes of random data)}"
      # Optional surface knobs; an unset or empty value uses the
      # documented in-image default (see deploy/README.md).
      KIWI_EXECUTION_KEY: ${KIWI_EXECUTION_KEY:-}
      KIWI_RSW_MODULUS_N: ${KIWI_RSW_MODULUS_N:-}
      KIWI_RSW_LAMBDA: ${KIWI_RSW_LAMBDA:-}
      KIWI_ALGORITHM: ${KIWI_ALGORITHM:-}
      KIWI_SHA_TARGET_BITS: ${KIWI_SHA_TARGET_BITS:-}
      KIWI_ARGON2_TARGET_BITS: ${KIWI_ARGON2_TARGET_BITS:-}
      KIWI_ARGON2_M_KIB: ${KIWI_ARGON2_M_KIB:-}
      KIWI_TTL_SECS: ${KIWI_TTL_SECS:-}
      KIWI_MIN_DURATION_MS: ${KIWI_MIN_DURATION_MS:-}
      KIWI_RSW_T: ${KIWI_RSW_T:-}
      KIWI_ISSUANCE_PER_MINUTE_PER_IP: ${KIWI_ISSUANCE_PER_MINUTE_PER_IP:-}
      KIWI_HEALTHZ_MODE: ${KIWI_HEALTHZ_MODE:-}
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - kiwi-store
      - default
    ports:
      - "8080:8080"
    restart: unless-stopped

networks:
  # The store network is internal: Valkey (and the store traffic) has
  # no route off the docker network. The captcha service joins it plus
  # the default network, so its published port keeps working.
  kiwi-store:
    internal: true

volumes:
  valkey-data:
