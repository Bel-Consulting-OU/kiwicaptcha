version: 1
name: kiwicaptcha
jobs:
  assets:
    name: assets
    runtime: container
    steps:
    - name: regenerate-strict-build
      run: 'set -eu

        apt-get update -qq

        apt-get install -y -qq git nodejs npm

        rustup target add wasm32-unknown-unknown

        cd packages/kiwicaptcha-wasm

        bash build.sh

        echo "strict deterministic build complete on the release platform"

        '
    - name: refresh-generated-copies
      run: "set -eu\ntrue\nmkdir -p .ci-asset-refresh/packages/kiwicaptcha-wasm/assets \\\n  .ci-asset-refresh/packages/kiwicaptcha/resources \\\n  .ci-asset-refresh/packages/kiwicaptcha/integrations/symfony/Resources/public\nwhile IFS= read -r asset; do\n  [ -n \"$asset\" ] || continue\n  cp \"packages/kiwicaptcha-wasm/assets/$asset\" .ci-asset-refresh/packages/kiwicaptcha-wasm/assets/\n  cp \"packages/kiwicaptcha/resources/$asset\" .ci-asset-refresh/packages/kiwicaptcha/resources/\n  cp \"packages/kiwicaptcha/integrations/symfony/Resources/public/$asset\" .ci-asset-refresh/packages/kiwicaptcha/integrations/symfony/Resources/public/\ndone < packages/kiwicaptcha-wasm/release-assets.txt\necho \"refreshed copies staged under .ci-asset-refresh/\"\n\n\nset -eu\ngit status --porcelain -- packages/kiwicaptcha-wasm/assets packages/kiwicaptcha/resources packages/kiwicaptcha/integrations/symfony/Resources/public | tee .ci-asset-refresh/diff.txt\ntest -s .ci-asset-refresh/diff.txt || echo \"no generated-copy\
        \ drift in this build\"\n"
    image: rust:1.96
    shell: bash
  public-install-cargo:
    name: public-install-cargo
    runtime: container
    steps:
    - name: init-an-empty-crate-in-a-temp-dir--no-repo-checkout
      run: '# Map Kiwi''s native run metadata onto the legacy variable names the

        # imported scripts read.

        CI_COMMIT_SHA="${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}"

        CI_COMMIT_BEFORE_SHA=""

        CI_COMMIT_TARGET_SHA=""

        CI_PIPELINE_EVENT="push"

        CI_WORKSPACE="$PWD"

        CI_COMMIT_TAG=""

        case "${KIWI_GIT_REF:-}" in refs/tags/*) CI_COMMIT_TAG="${KIWI_GIT_REF#refs/tags/}";; esac

        CI_REPO="${CI_REPO:-${KIWI_REPO:-}}"

        export CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO

        set -eu


        mkdir -p "$CI_WORKSPACE/.ci-run-tmp"


        set -eu

        rm -rf "$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke"

        cargo init --name kiwi-cargo-smoke "$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke"

        '
    - name: add-the-exact-crates.io-version---and-check--no-path--no-g
      run: "RUST_VERSION=\"${KIWICAPTCHA_RISK_VERSION:?set KIWICAPTCHA_RISK_VERSION}\"\nexport RUST_VERSION\n# Map Kiwi's native run metadata onto the legacy variable names the\n# imported scripts read.\nCI_COMMIT_SHA=\"${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}\"\nCI_COMMIT_BEFORE_SHA=\"\"\nCI_COMMIT_TARGET_SHA=\"\"\nCI_PIPELINE_EVENT=\"push\"\nCI_WORKSPACE=\"$PWD\"\nCI_COMMIT_TAG=\"\"\ncase \"${KIWI_GIT_REF:-}\" in refs/tags/*) CI_COMMIT_TAG=\"${KIWI_GIT_REF#refs/tags/}\";; esac\nCI_REPO=\"${CI_REPO:-${KIWI_REPO:-}}\"\nexport CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO\nset -eu\n\nmkdir -p \"$CI_WORKSPACE/.ci-run-tmp\"\n\nset -eu\ncd \"$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke\"\n# `=X.Y.Z` is the only requirement that cannot resolve to a\n# newer compatible release: a caret requirement would accept\n# 1.7.1 for a requested 1.7.0 and the smoke would still pass.\ncargo add \"$CRATE@=$RUST_VERSION\"\ncargo check\ncargo tree -p \"\
        $CRATE\" --depth 0\n# Read the resolution back: exactly one package of that name,\n# the requested version, a crates.io registry source, and no\n# path/git replacement (a replacement has source null).\ncargo metadata --format-version 1 > \"$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke/meta.json\"\npython3 - \"$CRATE\" \"$RUST_VERSION\" \"$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke/meta.json\" <<'PY'\nimport json\nimport sys\n\ncrate, want, path = sys.argv[1], sys.argv[2], sys.argv[3]\nmeta = json.load(open(path))\nnamed = [p for p in meta['packages'] if p['name'] == crate]\nexact = [p for p in named if p['version'] == want]\nassert len(exact) == 1, (\n    f'{crate}@{want} must resolve to exactly one package, got '\n    f'{[p[\"version\"] for p in named]}'\n)\nsource = exact[0].get('source') or ''\nassert source.startswith('registry+') and 'crates.io' in source, (\n    f'{crate}@{want} resolved from {source!r}, not the crates.io registry'\n)\nprint(f'cargo smoke: verified {crate}@{want}\
        \ from {source}')\nPY\necho \"cargo smoke: $CRATE@$RUST_VERSION resolved and checked from crates.io\"\n"
    - name: risk-init-an-empty-crate-in-a-temp-dir--no-repo-checkout
      run: '# Map Kiwi''s native run metadata onto the legacy variable names the

        # imported scripts read.

        CI_COMMIT_SHA="${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}"

        CI_COMMIT_BEFORE_SHA=""

        CI_COMMIT_TARGET_SHA=""

        CI_PIPELINE_EVENT="push"

        CI_WORKSPACE="$PWD"

        CI_COMMIT_TAG=""

        case "${KIWI_GIT_REF:-}" in refs/tags/*) CI_COMMIT_TAG="${KIWI_GIT_REF#refs/tags/}";; esac

        CI_REPO="${CI_REPO:-${KIWI_REPO:-}}"

        export CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO

        set -eu


        mkdir -p "$CI_WORKSPACE/.ci-run-tmp"


        set -eu

        rm -rf "$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke"

        cargo init --name kiwi-cargo-smoke "$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke"

        '
    - name: risk-add-the-exact-crates.io-version---and-check--no-path--no-g
      run: "RUST_VERSION=\"${KIWICAPTCHA_RISK_VERSION:?set KIWICAPTCHA_RISK_VERSION}\"\nexport RUST_VERSION\n# Map Kiwi's native run metadata onto the legacy variable names the\n# imported scripts read.\nCI_COMMIT_SHA=\"${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}\"\nCI_COMMIT_BEFORE_SHA=\"\"\nCI_COMMIT_TARGET_SHA=\"\"\nCI_PIPELINE_EVENT=\"push\"\nCI_WORKSPACE=\"$PWD\"\nCI_COMMIT_TAG=\"\"\ncase \"${KIWI_GIT_REF:-}\" in refs/tags/*) CI_COMMIT_TAG=\"${KIWI_GIT_REF#refs/tags/}\";; esac\nCI_REPO=\"${CI_REPO:-${KIWI_REPO:-}}\"\nexport CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO\nset -eu\n\nmkdir -p \"$CI_WORKSPACE/.ci-run-tmp\"\n\nset -eu\ncd \"$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke\"\n# `=X.Y.Z` is the only requirement that cannot resolve to a\n# newer compatible release: a caret requirement would accept\n# 1.7.1 for a requested 1.7.0 and the smoke would still pass.\ncargo add \"$CRATE@=$RUST_VERSION\"\ncargo check\ncargo tree -p \"\
        $CRATE\" --depth 0\n# Read the resolution back: exactly one package of that name,\n# the requested version, a crates.io registry source, and no\n# path/git replacement (a replacement has source null).\ncargo metadata --format-version 1 > \"$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke/meta.json\"\npython3 - \"$CRATE\" \"$RUST_VERSION\" \"$CI_WORKSPACE/.ci-run-tmp/kiwi-cargo-smoke/meta.json\" <<'PY'\nimport json\nimport sys\n\ncrate, want, path = sys.argv[1], sys.argv[2], sys.argv[3]\nmeta = json.load(open(path))\nnamed = [p for p in meta['packages'] if p['name'] == crate]\nexact = [p for p in named if p['version'] == want]\nassert len(exact) == 1, (\n    f'{crate}@{want} must resolve to exactly one package, got '\n    f'{[p[\"version\"] for p in named]}'\n)\nsource = exact[0].get('source') or ''\nassert source.startswith('registry+') and 'crates.io' in source, (\n    f'{crate}@{want} resolved from {source!r}, not the crates.io registry'\n)\nprint(f'cargo smoke: verified {crate}@{want}\
        \ from {source}')\nPY\necho \"cargo smoke: $CRATE@$RUST_VERSION resolved and checked from crates.io\"\n"
    image: rust:1.96
    env:
      CRATE: kiwicaptcha-risk
    shell: bash
  public-install-composer:
    name: public-install-composer
    runtime: container
    steps:
    - name: install-the-symfony-cli--versioned-release--sha256-pinned
      run: "# Map Kiwi's native run metadata onto the legacy variable names the\n# imported scripts read.\nCI_COMMIT_SHA=\"${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}\"\nCI_COMMIT_BEFORE_SHA=\"\"\nCI_COMMIT_TARGET_SHA=\"\"\nCI_PIPELINE_EVENT=\"push\"\nCI_WORKSPACE=\"$PWD\"\nCI_COMMIT_TAG=\"\"\ncase \"${KIWI_GIT_REF:-}\" in refs/tags/*) CI_COMMIT_TAG=\"${KIWI_GIT_REF#refs/tags/}\";; esac\nCI_REPO=\"${CI_REPO:-${KIWI_REPO:-}}\"\nexport CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO\nset -eu\n\nmkdir -p \"$CI_WORKSPACE/.ci-run-tmp\"\n\nset -eu\ncurl -fsSL -o /tmp/symfony-cli.tar.gz \\\n  \"https://github.com/symfony-cli/symfony-cli/releases/download/v${SYMFONY_CLI_VERSION}/symfony-cli_linux_amd64.tar.gz\"\necho \"${SYMFONY_CLI_SHA256}  /tmp/symfony-cli.tar.gz\" | sha256sum -c -\n# The binary lands in the shared workspace, never the step\n# container's HOME: every later step is a fresh container and\n# reaches it by absolute path. No GitHub-only\
        \ state variables.\nmkdir -p \"$CI_WORKSPACE/.ci-run-tmp/bin\"\ntar -xzf /tmp/symfony-cli.tar.gz -C \"$CI_WORKSPACE/.ci-run-tmp/bin\" symfony\n\"$CI_WORKSPACE/.ci-run-tmp/bin/symfony\" --version\n# php:8.3-cli ships neither composer nor unzip: the phar is\n# pinned below, and every composer-running step installs unzip\n# (composer's ZipDownloader needs it, the image ships no ext-zip).\ncurl -fsSL -o \"$CI_WORKSPACE/.ci-run-tmp/bin/composer\" \\\n  \"https://github.com/composer/composer/releases/download/${COMPOSER_VERSION}/composer.phar\"\necho \"${COMPOSER_SHA256}  $CI_WORKSPACE/.ci-run-tmp/bin/composer\" | sha256sum -c -\nchmod +x \"$CI_WORKSPACE/.ci-run-tmp/bin/composer\"\n\"$CI_WORKSPACE/.ci-run-tmp/bin/composer\" --version\n"
    - name: create-the-empty-lts-application----webapp
      run: '# Map Kiwi''s native run metadata onto the legacy variable names the

        # imported scripts read.

        CI_COMMIT_SHA="${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}"

        CI_COMMIT_BEFORE_SHA=""

        CI_COMMIT_TARGET_SHA=""

        CI_PIPELINE_EVENT="push"

        CI_WORKSPACE="$PWD"

        CI_COMMIT_TAG=""

        case "${KIWI_GIT_REF:-}" in refs/tags/*) CI_COMMIT_TAG="${KIWI_GIT_REF#refs/tags/}";; esac

        CI_REPO="${CI_REPO:-${KIWI_REPO:-}}"

        export CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO

        set -eu


        mkdir -p "$CI_WORKSPACE/.ci-run-tmp"


        set -eu

        apt-get update >/dev/null && apt-get install -y --no-install-recommends unzip git >/dev/null

        cd "$CI_WORKSPACE/.ci-run-tmp"

        "$CI_WORKSPACE/.ci-run-tmp/bin/symfony" new --version=lts --webapp --no-git kiwi-smoke

        '
    - name: require-the-bundle-from-packagist--no-path-repository
      run: '# Map Kiwi''s native run metadata onto the legacy variable names the

        # imported scripts read.

        CI_COMMIT_SHA="${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}"

        CI_COMMIT_BEFORE_SHA=""

        CI_COMMIT_TARGET_SHA=""

        CI_PIPELINE_EVENT="push"

        CI_WORKSPACE="$PWD"

        CI_COMMIT_TAG=""

        case "${KIWI_GIT_REF:-}" in refs/tags/*) CI_COMMIT_TAG="${KIWI_GIT_REF#refs/tags/}";; esac

        CI_REPO="${CI_REPO:-${KIWI_REPO:-}}"

        export CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO

        set -eu


        mkdir -p "$CI_WORKSPACE/.ci-run-tmp"


        set -eu

        apt-get update >/dev/null && apt-get install -y --no-install-recommends unzip >/dev/null cd "$CI_WORKSPACE/.ci-run-tmp/kiwi-smoke" export PATH="$CI_WORKSPACE/.ci-run-tmp/bin:$PATH"

        composer require "bel-consulting/kiwicaptcha-symfony:${KIWICAPTCHA_BUNDLE_VERSION:?KIWICAPTCHA_BUNDLE_VERSION must be provided}" --no-interaction --no-progress

        composer show bel-consulting/kiwicaptcha-symfony

        '
    - name: the-application-boots--console-about
      run: '# Map Kiwi''s native run metadata onto the legacy variable names the

        # imported scripts read.

        CI_COMMIT_SHA="${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}"

        CI_COMMIT_BEFORE_SHA=""

        CI_COMMIT_TARGET_SHA=""

        CI_PIPELINE_EVENT="push"

        CI_WORKSPACE="$PWD"

        CI_COMMIT_TAG=""

        case "${KIWI_GIT_REF:-}" in refs/tags/*) CI_COMMIT_TAG="${KIWI_GIT_REF#refs/tags/}";; esac

        CI_REPO="${CI_REPO:-${KIWI_REPO:-}}"

        export CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO

        set -eu


        mkdir -p "$CI_WORKSPACE/.ci-run-tmp"


        set -eu

        cd "$CI_WORKSPACE/.ci-run-tmp/kiwi-smoke"

        export PATH="$CI_WORKSPACE/.ci-run-tmp/bin:$PATH"

        php bin/console about

        '
    - name: write-the-documented-minimum-configuration--secret--public-url--redis-dsn
      run: "# Map Kiwi's native run metadata onto the legacy variable names the\n# imported scripts read.\nCI_COMMIT_SHA=\"${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}\"\nCI_COMMIT_BEFORE_SHA=\"\"\nCI_COMMIT_TARGET_SHA=\"\"\nCI_PIPELINE_EVENT=\"push\"\nCI_WORKSPACE=\"$PWD\"\nCI_COMMIT_TAG=\"\"\ncase \"${KIWI_GIT_REF:-}\" in refs/tags/*) CI_COMMIT_TAG=\"${KIWI_GIT_REF#refs/tags/}\";; esac\nCI_REPO=\"${CI_REPO:-${KIWI_REPO:-}}\"\nexport CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO\nset -eu\n\nmkdir -p \"$CI_WORKSPACE/.ci-run-tmp\"\n\nset -eu\ncd \"$CI_WORKSPACE/.ci-run-tmp/kiwi-smoke\"\nexport PATH=\"$CI_WORKSPACE/.ci-run-tmp/bin:$PATH\"\n{\n  echo \"KIWI_SECRET_KEY=${KIWI_SECRET_KEY}\"\n  echo \"KIWI_PUBLIC_URL=http://127.0.0.1:8000\"\n  echo \"KIWI_REDIS_DSN=redis://redis:6379/0\"\n} >> .env.local\ncat .env.local\n"
    - name: kiwicaptcha-doctor-must-exit-cleanly-on-the-documented-minim
      run: '# Map Kiwi''s native run metadata onto the legacy variable names the

        # imported scripts read.

        CI_COMMIT_SHA="${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}"

        CI_COMMIT_BEFORE_SHA=""

        CI_COMMIT_TARGET_SHA=""

        CI_PIPELINE_EVENT="push"

        CI_WORKSPACE="$PWD"

        CI_COMMIT_TAG=""

        case "${KIWI_GIT_REF:-}" in refs/tags/*) CI_COMMIT_TAG="${KIWI_GIT_REF#refs/tags/}";; esac

        CI_REPO="${CI_REPO:-${KIWI_REPO:-}}"

        export CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO

        set -eu


        mkdir -p "$CI_WORKSPACE/.ci-run-tmp"


        set -eu cd "$CI_WORKSPACE/.ci-run-tmp/kiwi-smoke" export PATH="$CI_WORKSPACE/.ci-run-tmp/bin:$PATH"

        php bin/console kiwicaptcha:doctor

        echo "doctor: exit 0 (clean) on the documented minimum configuration"

        '
    - name: the-flex-recipe-delivered-the-starter-config-and-the-routes
      run: "# Map Kiwi's native run metadata onto the legacy variable names the\n# imported scripts read.\nCI_COMMIT_SHA=\"${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}\"\nCI_COMMIT_BEFORE_SHA=\"\"\nCI_COMMIT_TARGET_SHA=\"\"\nCI_PIPELINE_EVENT=\"push\"\nCI_WORKSPACE=\"$PWD\"\nCI_COMMIT_TAG=\"\"\ncase \"${KIWI_GIT_REF:-}\" in refs/tags/*) CI_COMMIT_TAG=\"${KIWI_GIT_REF#refs/tags/}\";; esac\nCI_REPO=\"${CI_REPO:-${KIWI_REPO:-}}\"\nexport CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO\nset -eu\n\nmkdir -p \"$CI_WORKSPACE/.ci-run-tmp\"\n\nset -eu\ncd \"$CI_WORKSPACE/.ci-run-tmp/kiwi-smoke\"\nexport PATH=\"$CI_WORKSPACE/.ci-run-tmp/bin:$PATH\"\ntest -f config/packages/kiwicaptcha.yaml \\\n  || { echo \"the Flex recipe has not been applied (checklist steps 4-5 outstanding)\"; exit 1; }\nphp bin/console debug:router | grep -q kiwicaptcha \\\n  || { echo \"the recipe's kiwicaptcha routes are missing\"; exit 1; }\necho \"recipe config + routes present\"\
        \n"
    - name: add-the-demo-page--form-widget--to-the-smoke-application
      run: "# Map Kiwi's native run metadata onto the legacy variable names the\n# imported scripts read.\nCI_COMMIT_SHA=\"${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}\"\nCI_COMMIT_BEFORE_SHA=\"\"\nCI_COMMIT_TARGET_SHA=\"\"\nCI_PIPELINE_EVENT=\"push\"\nCI_WORKSPACE=\"$PWD\"\nCI_COMMIT_TAG=\"\"\ncase \"${KIWI_GIT_REF:-}\" in refs/tags/*) CI_COMMIT_TAG=\"${KIWI_GIT_REF#refs/tags/}\";; esac\nCI_REPO=\"${CI_REPO:-${KIWI_REPO:-}}\"\nexport CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO\nset -eu\n\nmkdir -p \"$CI_WORKSPACE/.ci-run-tmp\"\n\nset -eu\ncd \"$CI_WORKSPACE/.ci-run-tmp/kiwi-smoke\"\nexport PATH=\"$CI_WORKSPACE/.ci-run-tmp/bin:$PATH\"\nmkdir -p src/Form src/Controller templates\ncat > src/Form/CaptchaDemoType.php <<'PHP'\n<?php\n\nnamespace App\\Form;\n\nuse BelConsulting\\KiwiCaptchaBundle\\Form\\Type\\KiwiCaptchaType;\nuse Symfony\\Component\\Form\\AbstractType;\nuse Symfony\\Component\\Form\\FormBuilderInterface;\n\nfinal class CaptchaDemoType\
        \ extends AbstractType\n{\n    public function buildForm(FormBuilderInterface $builder, array $options): void\n    {\n        $builder->add('captcha', KiwiCaptchaType::class, ['scope' => 'login']);\n    }\n}\nPHP\ncat > src/Form/CaptchaDemoInput.php <<'PHP'\n<?php\n\nnamespace App\\Form;\n\nuse Symfony\\Component\\Validator\\Constraints as Assert;\n\nfinal class CaptchaDemoInput\n{\n    #[Assert\\NotBlank]\n    public ?string $captcha = null;\n}\nPHP\ncat > src/Controller/CaptchaDemoController.php <<'PHP'\n<?php\n\nnamespace App\\Controller;\n\nuse App\\Form\\CaptchaDemoInput;\nuse App\\Form\\CaptchaDemoType;\nuse Symfony\\Bundle\\FrameworkBundle\\Controller\\AbstractController;\nuse Symfony\\Component\\HttpFoundation\\Request;\nuse Symfony\\Component\\HttpFoundation\\Response;\nuse Symfony\\Component\\Routing\\Attribute\\Route;\n\nfinal class CaptchaDemoController extends AbstractController\n{\n    #[Route('/captcha-demo', name: 'captcha_demo', methods: ['GET', 'POST'])]\n    public\
        \ function __invoke(Request $request): Response\n    {\n        $form = $this->createForm(CaptchaDemoType::class, new CaptchaDemoInput());\n        $form->handleRequest($request);\n        $result = null;\n        if ($form->isSubmitted()) {\n            $result = json_encode([\n                'ok' => $form->isValid(),\n                'errors' => array_map(\n                    static fn ($violation): string => (string) $violation->getMessage(),\n                    iterator_to_array($form->getErrors(true)),\n                ),\n            ], JSON_THROW_ON_ERROR);\n        }\n\n        return $this->render('captcha_demo.html.twig', ['form' => $form, 'result' => $result]);\n    }\n}\nPHP\ncat > templates/captcha_demo.html.twig <<'TWIG'\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>KiwiCaptcha smoke</title></head>\n<body{% if result %} data-result=\"{{ result|e('html_attr') }}\"{% endif %}>\n{{ form_start(form) }}\n{{ form_widget(form) }}\n<button id=\"\
        demo-submit\" type=\"submit\">Verify</button>\n{{ form_end(form) }}\n</body>\n</html>\nTWIG\ncat > config/packages/kiwicaptcha_widget.yaml <<'YAML'\ntwig:\n    form_themes:\n        - '@KiwiCaptcha/form_div_layout.html.twig'\nYAML\nphp bin/console cache:clear\nphp bin/console debug:router | grep -q captcha_demo\necho \"demo page wired\"\n"
    - name: application-journey-and-reinstall-cycle
      run: "# Map Kiwi's native run metadata onto the legacy variable names the\n# imported scripts read.\nCI_COMMIT_SHA=\"${CI_COMMIT_SHA:-${KIWI_GIT_SHA:-}}\"\nCI_COMMIT_BEFORE_SHA=\"\"\nCI_COMMIT_TARGET_SHA=\"\"\nCI_PIPELINE_EVENT=\"push\"\nCI_WORKSPACE=\"$PWD\"\nCI_COMMIT_TAG=\"\"\ncase \"${KIWI_GIT_REF:-}\" in refs/tags/*) CI_COMMIT_TAG=\"${KIWI_GIT_REF#refs/tags/}\";; esac\nCI_REPO=\"${CI_REPO:-${KIWI_REPO:-}}\"\nexport CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO\nset -eu\n\nmkdir -p \"$CI_WORKSPACE/.ci-run-tmp\"\n\nset -eu\ncd \"$CI_WORKSPACE/.ci-run-tmp/kiwi-smoke\"\nexport PATH=\"$CI_WORKSPACE/.ci-run-tmp/bin:$PATH\"\n# php:8.3-cli ships no node/npm and no unzip; the e2e leg and\n# the reinstall cycle install them from the Debian archive\n# inside this step's own container.\napt-get update >/dev/null && apt-get install -y --no-install-recommends nodejs npm unzip >/dev/null\n\"$CI_WORKSPACE/.ci-run-tmp/bin/symfony\"\
        \ serve --no-tls --port=8000 --daemon\nfor _ in $(seq 1 60); do\n  if curl -fsS http://127.0.0.1:8000/captcha-demo > /dev/null; then\n    echo \"application server answering on 127.0.0.1:8000\"\n    exit 0\n  fi\n  sleep 1\ndone\necho \"application server did not answer in 60 s\" >&2\nexit 1\n\n\nset -eu\nnpm init -y > /dev/null\nnpm install --no-audit --no-fund playwright@1.62.1 > /dev/null\nnpx playwright install --with-deps chromium > /dev/null\ncat > e2e.mjs <<'JS'\nimport { chromium } from 'playwright';\n\nconst base = 'http://127.0.0.1:8000';\nconst browser = await chromium.launch();\nconst page = await browser.newPage();\npage.on('console', (message) => console.log('[browser]', message.type(), message.text()));\nawait page.goto(`${base}/captcha-demo`, { waitUntil: 'load' });\nawait page.waitForSelector('.kiwi-widget[data-state=\"verified\"]', { timeout: 180000 });\nconst token = await page.locator('input[data-kiwi-token]').first().inputValue();\nif (!token) {\n  throw new\
