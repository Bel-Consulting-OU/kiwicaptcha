        TOKEN2=\"$(tr -d '\\r\\n' < $CI_WORKSPACE/.ci-run-tmp/token2.txt)\"\ntest -n \"$TOKEN2\"\ncurl -fsS -X POST -H 'Content-Type: application/json' \\\n  -d \"{\\\"token\\\":\\\"$TOKEN2\\\",\\\"scope\\\":\\\"login\\\"}\" \\\n  http://$CAPTCHA_HOST:8080/verify | tee $CI_WORKSPACE/.ci-run-tmp/verify2.json\nphp -r 'exit(json_decode(file_get_contents(getenv(\"CI_WORKSPACE\").\"/.ci-run-tmp/verify2.json\"), true)[\"ok\"] === true ? 0 : 1);'"
    - name: docker-compose-down
      run: 'set -eu

        mkdir -p .ci-run-tmp

        docker compose down'
