    - name: commands
      run: "set -eu\ncd packages/kiwicaptcha-go\ngo vet ./...\ngo test -race ./...\nfor d in integrations/*/; do\n  echo \"== $d\"\n  (cd \"$d\" && go test ./...)\ndone"
