    name: node
    runtime: container
    image: node:22-bookworm
    steps:
    - name: commands
      run: 'set -eu

        cd packages/kiwicaptcha-node

        npm ci --no-audit --no-fund

        npm test'
    shell: bash
  python:
    name: python
    runtime: container
    image: python:3.12-bookworm
    steps:
    - name: commands
      run: 'set -eu

        python3 -m pip install --upgrade pip

