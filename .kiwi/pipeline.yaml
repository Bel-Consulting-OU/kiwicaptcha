    name: elixir
    runtime: container
    image: elixir:1.18-otp-27
    steps:
    - name: commands
      run: 'set -eu

        apt-get update -qq

        apt-get install -y -qq build-essential

        cd packages/kiwicaptcha-elixir

        mix local.hex --force

        mix local.rebar --force

        mix deps.get

        mix test'
