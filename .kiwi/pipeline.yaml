version: 1
name: kiwicaptcha
'on':
  push: {}
  pull_request: {}
concurrency:
  group: ${{ repo.full_name }}:${{ git.branch }}
  cancel_in_progress: true
jobs:
  lint-repo:
    name: lint-repo
    runtime: container
    image: alpine:3.20
    steps:
    - name: commands
      run: "# Map Kiwi's native run metadata onto the legacy variable names the\n# imported scripts read.\nCI_COMMIT_SHA=\"${KIWI_GIT_SHA:-}\"\nCI_COMMIT_BEFORE_SHA=\"\"\nCI_COMMIT_TARGET_SHA=\"\"\nCI_PIPELINE_EVENT=\"push\"\nCI_WORKSPACE=\"${KIWI_WORKSPACE:-$PWD}\"\nCI_COMMIT_TAG=\"\"\ncase \"${KIWI_GIT_REF:-}\" in refs/tags/*) CI_COMMIT_TAG=\"${KIWI_GIT_REF#refs/tags/}\";; esac\nCI_REPO=\"${KIWI_REPO:-}\"\nexport CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO\napk add --no-cache bash git gawk ripgrep coreutils jq python3 py3-yaml\nset -eu\nKIWI_HDR='# KiwiCaptcha'\nAPEX_HDR='# ApexM''ail'\ngrep -q \"^$KIWI_HDR\" README.md\n! grep -q \"^$APEX_HDR\" README.md\ngrep -q 'packages/kiwicaptcha' README.md\ngrep -q '\"name\": \"bel-consulting/kiwicaptcha-symfony\"' packages/kiwicaptcha/integrations/symfony/composer.json\ngrep -q '^name = \"kiwicaptcha\"' packages/kiwicaptcha/Cargo.toml\nwhile IFS= read -r asset; do\n  [ -n \"$asset\"\
        \ ] || continue\n  test -f \"packages/kiwicaptcha-wasm/assets/$asset\"\ndone < packages/kiwicaptcha-wasm/release-assets.txt\ntest -f tests/browser/compat-capabilities.json\nfor d in kiwicaptcha kiwicaptcha-php kiwicaptcha-wasm kiwicaptcha-risk kiwicaptcha-risk-php; do\n  test ! -d \"$d\"\ndone\necho \"product identity OK\"\n\nset -eu\ncmp packages/kiwicaptcha-wasm/ACCESSIBILITY.md \\\n  packages/kiwicaptcha/integrations/symfony/Resources/ACCESSIBILITY.md\necho \"accessibility documents byte-identical\"\n\nset -eu\n# Kiwi-CI jobs run in isolated workspaces, so GitHub-only state\n# variables (GITHUB_PATH, GITHUB_ENV, GITHUB_OUTPUT) never exist\n# here and writing them has always been a silent no-op or an\n# unbound-variable crash under set -u. The lint refuses any new\n# occurrence so the class of bug stays dead.\nif rg -n '\\$\\{?GITHUB_(PATH|ENV|OUTPUT)' .kiwi/ ; then\n  echo \"workflow lint: GitHub-only state variables in .kiwi/ (see above)\" >&2\n  exit 1\nfi\necho \"workflow lint:\
        \ no GitHub-only state variables in the Kiwi pipelines\"\n# The aggregate gate must name only jobs that exist in one of the\n# Kiwi pipeline files; a renamed or deleted job would otherwise\n# leave the gate waiting on a dependency the engine cannot build.\npython3 - <<'KIWI_LINT'\nimport glob\nimport sys\nimport yaml\njobs = {}\nfor path in sorted(glob.glob('.kiwi/*.yaml')):\n    doc = yaml.safe_load(open(path))\n    if not isinstance(doc, dict) or not isinstance(doc.get('jobs'), dict):\n        sys.exit(f'{path}: no jobs map')\n    for key in doc['jobs']:\n        jobs.setdefault(key, []).append(path)\ngate = yaml.safe_load(open('.kiwi/pipeline.yaml'))['jobs']['promotion-gate']\nmissing = [dep for dep in gate.get('needs', []) if dep not in jobs]\nif missing:\n    sys.exit(f'promotion-gate needs unknown jobs: {missing}')\nprint(f'workflow lint: {len(jobs)} Kiwi jobs, every gate dependency exists')\nKIWI_LINT\n# SECURITY.md's solver protocol id is machine-checked against\n# the canonical\
        \ constant, never hand-maintained.\nCANONICAL_ID=$(sed -n 's/.*\"worker_protocol_id\": *\"\\([^\"]*\\)\".*/\\1/p' protocol/limits.json)\n[ -n \"$CANONICAL_ID\" ] || { echo \"workflow lint: no worker_protocol_id in protocol/limits.json\" >&2; exit 1; }\ngrep -q \"current \\`$CANONICAL_ID\\` solver protocol id\" SECURITY.md || {\n  echo \"workflow lint: SECURITY.md names a stale solver protocol id (canonical: $CANONICAL_ID)\" >&2\n  exit 1\n}\necho \"workflow lint: SECURITY.md protocol id matches the canonical constant ($CANONICAL_ID)\"\n\nsh packages/kiwicaptcha/tools/docs-lint-one-shot-test.sh\nsh packages/kiwicaptcha/tools/verify-error-code-parity.sh\nbash packages/kiwicaptcha/tools/docs-lint.sh --source --baseline packages/kiwicaptcha/tools/docs-lint-baseline.txt\nset -eu\nbase=\"${CI_COMMIT_BEFORE_SHA:-}\"\nif [ -z \"$base\" ] || [ \"$base\" = \"0000000000000000000000000000000000000000\" ]; then\n  if [ \"${CI_PIPELINE_EVENT:-}\" = \"pull_request\" ] && [ -n \"${CI_COMMIT_TARGET_SHA:-}\"\
        \ ]; then\n    base=\"$CI_COMMIT_TARGET_SHA\"\n  else\n    # A manual pipeline has no before-SHA and the clone is\n    # shallow (depth 1, tree-filtered): deepen to the parent\n    # commit so the integrity diff has a real base.\n    git fetch --depth=2 --no-filter origin \"$CI_COMMIT_SHA\" >/dev/null 2>&1 || true\n    base=\"$(git rev-parse --verify HEAD^ 2>/dev/null || true)\"\n  fi\nfi\n[ -n \"$base\" ] || { echo \"baseline integrity needs a comparison base (before-SHA, target-SHA or HEAD^)\" >&2; exit 1; }\ngit cat-file -e \"$base:packages/kiwicaptcha/tools/docs-lint-baseline.txt\" 2>/dev/null \\\n  || { echo \"no baseline file at $base\" >&2; exit 1; }\ngit show \"$base:packages/kiwicaptcha/tools/docs-lint-baseline.txt\" > /tmp/base-baseline.txt\nwhile IFS= read -r entry; do\n  entry=\"${entry#\"${entry%%[![:space:]]*}\"}\"\n  entry=\"${entry%%#*}\"\n  entry=\"${entry%\"${entry##*[![:space:]]}\"}\"\n  [ -n \"$entry\" ] || continue\n  if awk -v p=\"$entry\" '!/^TOTAL[ \\t]/ &&\
        \ $2 == p { found = 1 } END { exit !found }' /tmp/base-baseline.txt; then\n    echo \"stale adoption manifest entry: $entry already has a baseline row\" >&2\n    exit 1\n  fi\ndone < packages/kiwicaptcha/tools/docs-lint-adopted.txt\nbash packages/kiwicaptcha/tools/docs-lint.sh --source --integrity /tmp/base-baseline.txt\n\nbash tools/ci/version-prose-lint.sh\ngit checkout -- tools/redteam/target 2>/dev/null || true\nbash tools/ci/release-asset-contract.sh\nbash tools/ci/protocol-manifest-check.sh\nbash tools/ci/limits-parity-check.sh\nbash tools/ci/deploy-image-pin-check.sh\nbash tools/ci/release-governance-fixture.sh\nset -eu\ncount=0\nfor path in protocol/risk-v1/*.lua; do\n  f=$(basename \"$path\")\n  count=$((count + 1))\n  test -f \"protocol/risk-v1/$f\"\n  test -f \"packages/kiwicaptcha-risk/resources/$f\"\n  test -f \"packages/kiwicaptcha-risk-php/resources/$f\"\n  cmp -s \"protocol/risk-v1/$f\" \"packages/kiwicaptcha-risk/resources/$f\"\n  cmp -s \"protocol/risk-v1/$f\" \"\
        packages/kiwicaptcha-risk-php/resources/$f\"\ndone\ntest \"$count\" -ge 21\necho \"all $count canonical Lua copies byte-identical\"\n\n\nset -eu\nPATTERN='audit( round)? #[0-9]''+''|audit roun''d''|(^|[^A-Za-z])round[- ]?[0-9]''+''|(^|[^A-Za-z0-9_])(?-i:P[0-3])([^A-Za-z0-9_-]|$)|ApexMa''il'\nif rg -n -i \\\n  --glob '!CHANGELOG*' \\\n  --glob '!**/CHANGELOG*' \\\n  --glob '!**/vendor/**' \\\n  --glob '!**/node_modules/**' \\\n  --glob '!**/target/**' --glob '!**/deps/**' \\\n  \"$PATTERN\" \\\n  packages tests README.md SECURITY.md .github/workflows .kiwi; then\n  echo \"internal-history commentary found in product source/docs\" >&2\n  exit 1\nfi\necho \"doc hygiene OK\""
    shell: sh
  lint-workflow:
    name: lint-workflow
    runtime: container
    image: alpine:3.20
    steps:
    - name: commands
      run: '# Map Kiwi''s native run metadata onto the legacy variable names the

        # imported scripts read.

        CI_COMMIT_SHA="${KIWI_GIT_SHA:-}"

        CI_COMMIT_BEFORE_SHA=""

        CI_COMMIT_TARGET_SHA=""

        CI_PIPELINE_EVENT="push"

        CI_WORKSPACE="${KIWI_WORKSPACE:-$PWD}"

        CI_COMMIT_TAG=""

        case "${KIWI_GIT_REF:-}" in refs/tags/*) CI_COMMIT_TAG="${KIWI_GIT_REF#refs/tags/}";; esac

        CI_REPO="${KIWI_REPO:-}"

        export CI_COMMIT_SHA CI_COMMIT_BEFORE_SHA CI_COMMIT_TARGET_SHA CI_PIPELINE_EVENT CI_WORKSPACE CI_COMMIT_TAG CI_REPO

        apk add --no-cache bash curl tar

        set -eu

        ACTIONLINT_VERSION=1.7.12

        # sha256 of the linux amd64 release tarball, from the release''s

        # checksums file (actionlint_1.7.12_checksums.txt).

        ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

        cd /tmp

        curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

        echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -

        tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint

        /tmp/actionlint -version

        cd "$CI_WORKSPACE"

        /tmp/actionlint -color=false .github/workflows/*.yml'
    shell: sh
  storage-lua-parity:
    name: storage-lua-parity
    runtime: container
    image: alpine:3.20
    steps:
    - name: commands
      run: 'apk add --no-cache python3

        python3 tools/ci/storage-lua-parity-check.py

        python3 tools/ci/storage-lua-parity-check.py --assert'
    shell: sh
  composer-contracts:
    name: composer-contracts
    runtime: container
    image: composer:2.9
    services:
    - name: redis
      image: redis:7-alpine
    steps:
    - name: commands
      run: 'set -eu

        composer validate --strict --no-check-publish --working-dir=packages/kiwicaptcha-php

        composer validate --strict --no-check-publish --working-dir=packages/kiwicaptcha-risk-php

        composer validate --strict --no-check-publish --working-dir=packages/kiwicaptcha/integrations/symfony

        (cd packages/kiwicaptcha-php && bash ../kiwicaptcha/tools/check-psr4.sh)'
    shell: bash
  php-core-8.1:
    name: php-core-8.1
    runtime: container
    image: php:8.1-cli
    services:
    - name: redis
      image: redis:7-alpine
    steps:
    - name: commands
      run: "set -eu\napt-get update -qq\napt-get install -y -qq libgmp-dev libsodium-dev unzip git\ndocker-php-ext-install -j\"$(nproc)\" gmp sodium\n\nset -eu\nEXPECTED=\"$(php -r 'copy(\"https://composer.github.io/installer.sig\", \"php://stdout\");')\"\nphp -r \"copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');\"\nACTUAL=\"$(php -r \"echo hash_file('sha384', '/tmp/composer-setup.php');\")\"\n[ \"$EXPECTED\" = \"$ACTUAL\" ] || { echo \"composer installer checksum mismatch\" >&2; exit 1; }\nphp /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer\nrm -f /tmp/composer-setup.php\n\nset -eu\ncd packages/kiwicaptcha-php\ncomposer validate --strict\nbash ../kiwicaptcha/tools/check-psr4.sh\ncomposer install --no-interaction --prefer-dist\nfor i in 1 2 3 4 5; do\n  if composer audit --locked; then\n    break\n  fi\n  echo \"composer audit attempt $i failed \u2014 retrying in 30s\" >&2\n  sleep 30\ndone\ncomposer audit --locked\nvendor/bin/phpunit"
    shell: bash
  php-core-8.2:
    name: php-core-8.2
    runtime: container
    image: php:8.2-cli
    services:
    - name: redis
      image: redis:7-alpine
    steps:
    - name: commands
      run: "set -eu\napt-get update -qq\napt-get install -y -qq libgmp-dev libsodium-dev unzip git\ndocker-php-ext-install -j\"$(nproc)\" gmp sodium\n\nset -eu\nEXPECTED=\"$(php -r 'copy(\"https://composer.github.io/installer.sig\", \"php://stdout\");')\"\nphp -r \"copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');\"\nACTUAL=\"$(php -r \"echo hash_file('sha384', '/tmp/composer-setup.php');\")\"\n[ \"$EXPECTED\" = \"$ACTUAL\" ] || { echo \"composer installer checksum mismatch\" >&2; exit 1; }\nphp /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer\nrm -f /tmp/composer-setup.php\n\nset -eu\ncd packages/kiwicaptcha-php\ncomposer validate --strict\nbash ../kiwicaptcha/tools/check-psr4.sh\ncomposer install --no-interaction --prefer-dist\nfor i in 1 2 3 4 5; do\n  if composer audit --locked; then\n    break\n  fi\n  echo \"composer audit attempt $i failed \u2014 retrying in 30s\" >&2\n  sleep 30\ndone\ncomposer audit --locked\nvendor/bin/phpunit"
    shell: bash
  php-core-8.3:
    name: php-core-8.3
    runtime: container
    image: php:8.3-cli
    services:
    - name: redis
      image: redis:7-alpine
    steps:
    - name: commands
      run: "set -eu\napt-get update -qq\napt-get install -y -qq libgmp-dev libsodium-dev unzip git\ndocker-php-ext-install -j\"$(nproc)\" gmp sodium\n\nset -eu\nEXPECTED=\"$(php -r 'copy(\"https://composer.github.io/installer.sig\", \"php://stdout\");')\"\nphp -r \"copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');\"\nACTUAL=\"$(php -r \"echo hash_file('sha384', '/tmp/composer-setup.php');\")\"\n[ \"$EXPECTED\" = \"$ACTUAL\" ] || { echo \"composer installer checksum mismatch\" >&2; exit 1; }\nphp /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer\nrm -f /tmp/composer-setup.php\n\nset -eu\ncd packages/kiwicaptcha-php\ncomposer validate --strict\nbash ../kiwicaptcha/tools/check-psr4.sh\ncomposer install --no-interaction --prefer-dist\nfor i in 1 2 3 4 5; do\n  if composer audit --locked; then\n    break\n  fi\n  echo \"composer audit attempt $i failed \u2014 retrying in 30s\" >&2\n  sleep 30\ndone\ncomposer audit --locked\nvendor/bin/phpunit"
    shell: bash
  php-core-8.4:
    name: php-core-8.4
    runtime: container
    image: php:8.4-cli
    services:
    - name: redis
      image: redis:7-alpine
    steps:
    - name: commands
      run: "set -eu\napt-get update -qq\napt-get install -y -qq libgmp-dev libsodium-dev unzip git\ndocker-php-ext-install -j\"$(nproc)\" gmp sodium\n\nset -eu\nEXPECTED=\"$(php -r 'copy(\"https://composer.github.io/installer.sig\", \"php://stdout\");')\"\nphp -r \"copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');\"\nACTUAL=\"$(php -r \"echo hash_file('sha384', '/tmp/composer-setup.php');\")\"\n[ \"$EXPECTED\" = \"$ACTUAL\" ] || { echo \"composer installer checksum mismatch\" >&2; exit 1; }\nphp /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer\nrm -f /tmp/composer-setup.php\n\nset -eu\ncd packages/kiwicaptcha-php\ncomposer validate --strict\nbash ../kiwicaptcha/tools/check-psr4.sh\ncomposer install --no-interaction --prefer-dist\nfor i in 1 2 3 4 5; do\n  if composer audit --locked; then\n    break\n  fi\n  echo \"composer audit attempt $i failed \u2014 retrying in 30s\" >&2\n  sleep 30\ndone\ncomposer audit --locked\nvendor/bin/phpunit"
    shell: bash
  php-core-8.5:
    name: php-core-8.5
    runtime: container
    image: php:8.5-cli
    services:
    - name: redis
      image: redis:7-alpine
    steps:
    - name: commands
      run: "set -eu\napt-get update -qq\napt-get install -y -qq libgmp-dev libsodium-dev unzip git\ndocker-php-ext-install -j\"$(nproc)\" gmp sodium\n\nset -eu\nEXPECTED=\"$(php -r 'copy(\"https://composer.github.io/installer.sig\", \"php://stdout\");')\"\nphp -r \"copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');\"\nACTUAL=\"$(php -r \"echo hash_file('sha384', '/tmp/composer-setup.php');\")\"\n[ \"$EXPECTED\" = \"$ACTUAL\" ] || { echo \"composer installer checksum mismatch\" >&2; exit 1; }\nphp /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer\nrm -f /tmp/composer-setup.php\n\nset -eu\ncd packages/kiwicaptcha-php\ncomposer validate --strict\nbash ../kiwicaptcha/tools/check-psr4.sh\ncomposer install --no-interaction --prefer-dist\nfor i in 1 2 3 4 5; do\n  if composer audit --locked; then\n    break\n  fi\n  echo \"composer audit attempt $i failed \u2014 retrying in 30s\" >&2\n  sleep 30\ndone\ncomposer audit --locked\nvendor/bin/phpunit"
    shell: bash
  php-core-no-gmp:
    name: php-core-no-gmp
    runtime: container
    image: php:8.3-cli
    services:
    - name: redis
      image: redis:7-alpine
    steps:
    - name: commands
      run: 'set -eu

        apt-get update -qq

        apt-get install -y -qq unzip git


        set -eu

        EXPECTED="$(php -r ''copy("https://composer.github.io/installer.sig", "php://stdout");'')"

        php -r "copy(''https://getcomposer.org/installer'', ''/tmp/composer-setup.php'');"

        ACTUAL="$(php -r "echo hash_file(''sha384'', ''/tmp/composer-setup.php'');")"

        [ "$EXPECTED" = "$ACTUAL" ] || { echo "composer installer checksum mismatch" >&2; exit 1; }

        php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer

        rm -f /tmp/composer-setup.php


        set -eu

        cd packages/kiwicaptcha-php

        composer validate --strict

        composer install --no-interaction --prefer-dist

        php ../../tools/ci/no-gmp-verify.php'
    shell: bash
  php-core-real-redis:
    name: php-core-real-redis
    runtime: container
    image: php:8.3-cli
    env:
      KC_REDIS_URL: redis://redis:6379
      KIWI_REQUIRE_REAL_REDIS_TESTS: '1'
      TEST_REDIS_URL: redis://redis:6379
    services:
    - name: redis
      image: redis:7-alpine
    steps:
    - name: commands
      run: 'set -eu

        apt-get update -qq

        apt-get install -y -qq libgmp-dev libsodium-dev unzip git redis-server redis-tools

        docker-php-ext-install -j"$(nproc)" gmp sodium pcntl posix


        set -eu

        EXPECTED="$(php -r ''copy("https://composer.github.io/installer.sig", "php://stdout");'')"

        php -r "copy(''https://getcomposer.org/installer'', ''/tmp/composer-setup.php'');"

        ACTUAL="$(php -r "echo hash_file(''sha384'', ''/tmp/composer-setup.php'');")"

        [ "$EXPECTED" = "$ACTUAL" ] || { echo "composer installer checksum mismatch" >&2; exit 1; }

        php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer

        rm -f /tmp/composer-setup.php


        set -eu

        cd packages/kiwicaptcha-php

        composer install --no-interaction --prefer-dist

        (cd ../kiwicaptcha/integrations/symfony && composer install --no-interaction --prefer-dist --no-scripts)

        vendor/bin/phpunit --filter "FailoverPromotionStateLossRealRedisTest|WorkerDeathMatrixRealRedisTest|RedisClusterTopologyTest|RedisSentinelFailoverTest"'
    shell: bash
  php-nightly-8.6:
    name: php-nightly-8.6
    runtime: container
    image: php:8.6-rc-cli
    services:
    - name: redis
      image: redis:7-alpine
    steps:
    - name: commands
      run: "set -eu\napt-get update -qq\napt-get install -y -qq libgmp-dev libsodium-dev unzip git\ndocker-php-ext-install -j\"$(nproc)\" gmp sodium\n\nset -eu\nEXPECTED=\"$(php -r 'copy(\"https://composer.github.io/installer.sig\", \"php://stdout\");')\"\nphp -r \"copy('https://getcomposer.org/installer', '/tmp/composer-setup.php');\"\nACTUAL=\"$(php -r \"echo hash_file('sha384', '/tmp/composer-setup.php');\")\"\n[ \"$EXPECTED\" = \"$ACTUAL\" ] || { echo \"composer installer checksum mismatch\" >&2; exit 1; }\nphp /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer\nrm -f /tmp/composer-setup.php\n\nset +e\n(\n  *php_core_suite\n)\nstatus=$?\necho \"php 8.6 pre-release probe finished with status $status (non-gating; the stable lanes above are the evidence)\"\nexit 0"
    shell: bash
  phpredis-siteverify:
    name: phpredis-siteverify
    runtime: container
    image: php:8.3-cli
    env:
      KC_REDIS_URL: redis://redis:6379
      TEST_REDIS_URL: redis://redis:6379
    services:
    - name: redis
      image: redis:7-alpine
    steps:
    - name: commands
      run: 'set -eu

        apt-get update -qq

        apt-get install -y -qq libgmp-dev libsodium-dev unzip git

        docker-php-ext-install -j"$(nproc)" gmp sodium

        pecl install redis && docker-php-ext-enable redis


        set -eu

        EXPECTED="$(php -r ''copy("https://composer.github.io/installer.sig", "php://stdout");'')"

        php -r "copy(''https://getcomposer.org/installer'', ''/tmp/composer-setup.php'');"

        ACTUAL="$(php -r "echo hash_file(''sha384'', ''/tmp/composer-setup.php'');")"

        [ "$EXPECTED" = "$ACTUAL" ] || { echo "composer installer checksum mismatch" >&2; exit 1; }

        php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer

        rm -f /tmp/composer-setup.php


        set -eu

        cd packages/kiwicaptcha/integrations/symfony

        composer install --no-interaction --prefer-dist

        php -r ''if (!extension_loaded("redis")) { fwrite(STDERR, "redis extension missing\n"); exit(1); } echo "phpredis OK\n";''

        vendor/bin/phpunit --filter "SiteVerifyTest|SiteVerifyConcurrencyTest"'
    shell: bash
  symfony-6.4-php8.2:
    name: symfony-6.4-php8.2
    runtime: container
    image: php:8.2-cli
    env:
      KC_REDIS_URL: redis://redis:6379
      TEST_REDIS_URL: redis://redis:6379
    services:
    - name: redis
      image: redis:7-alpine
    steps:
